  <script>
    /* ---------------------------------------------------------
    GLOBAL STATE
    --------------------------------------------------------- */
    let isAdmin = false;
    let projectState = {};

    const PROJECT_ID = (typeof APP_DATA !== 'undefined') ? APP_DATA.projectId : "";

    /* ---------------------------------------------------------
    INITIALIZATION & NAVIGATION UI
    --------------------------------------------------------- */
    const userBtn  = document.getElementById('userMenuBtn');
    const userMenu = document.getElementById('userMenu');
    const navBtn   = document.getElementById('navMenuBtn');
    const navMenu  = document.getElementById('navMenu');

    if (userBtn) userBtn.onclick = (e) => { e.stopPropagation(); userMenu.classList.toggle('hidden'); navMenu.classList.add('hidden'); };
    if (navBtn)  navBtn.onclick  = (e) => { e.stopPropagation(); navMenu.classList.toggle('hidden'); userMenu.classList.add('hidden'); };
    document.onclick = (e) => {
      if (userMenu && !userBtn.contains(e.target) && !userMenu.contains(e.target)) userMenu.classList.add('hidden');
      if (navMenu  && !navBtn.contains(e.target)  && !navMenu.contains(e.target))  navMenu.classList.add('hidden');
    };

    // Sidebar state - UX preference, correct to store in localStorage
    const sidebar   = document.getElementById('mainSidebar');
    const toggleBtn = document.getElementById('toggleSidebar');
    if (toggleBtn) {
      toggleBtn.onclick = () => {
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
      };
    }
    if (localStorage.getItem('sidebarCollapsed') === 'true') sidebar?.classList.add('collapsed');

    window.onload = () => {
      const user = (typeof APP_DATA !== 'undefined') ? APP_DATA.user : null;

      if (user) {
        isAdmin      = user.role.toLowerCase() === 'admin';
        const isDir  = user.role.toLowerCase() === 'directeur';

        if (isAdmin)        document.getElementById('navSettings')?.classList.remove('hidden');
        if (isAdmin || isDir) document.getElementById('navUsers')?.classList.remove('hidden');

        safeSetText('pageMainTitle', 'Paramètres du projet');
        safeSetText('pageSubTitle',  'Configurations.');
        safeSetText('u_name',        user.name);
        safeSetText('u_role',        user.role);
        safeSetText('u_initials',    user.name.substring(0, 2).toUpperCase());

        const currentLink = document.getElementById('navSettings');
        if (currentLink) currentLink.classList.add('bg-primary/10', 'text-primary');
      }
      refreshState();
    };

    /* ---------------------------------------------------------
    LOAD PROJECT SETTINGS
    --------------------------------------------------------- */
    function refreshState() {
      const loader = document.getElementById('stateLoader');
      const forms  = document.getElementById('projectForms');

      loader.classList.remove('hidden');
      forms.classList.add('hidden');

      google.script.run
        .withSuccessHandler(res => {
          projectState = res;
          renderHolidays();
          loader.classList.add('hidden');
          forms.classList.remove('hidden');
          renderUI();
        })
        .withFailureHandler(err => {
          loader.classList.add('hidden');
          showModal({ icon: 'error', title: 'Erreur de chargement', text: err.message });
          appErrorLog(err, "refreshState", {
            context: "Load project settings",
            projectId: PROJECT_ID
          });
        })
        .getSettingsState(APP_DATA.token);
    }

    /* ---------------------------------------------------------
    UI RENDER
    --------------------------------------------------------- */
    function renderUI() {
      const btnZone  = document.getElementById('actionButtons');
      const startInp = document.getElementById('start_date');
      const endInp   = document.getElementById('end_date');
      const title    = document.getElementById('projTitle');

      if (projectState.isCreated) {
        startInp.value = projectState.currentStart;
        endInp.value   = projectState.currentEnd;
        title.innerText = "Modification du Projet";

        if (isAdmin) {
          btnZone.innerHTML = `
            <button onclick="doAction('modify')"
                class="bg-amber-500 text-white px-6 py-3 rounded-lg font-black hover:bg-amber-600 transition-all flex items-center gap-2 shadow-lg transform hover:scale-105">
              <span class="material-symbols-outlined">edit_calendar</span> MODIFIER LE PROJET
            </button>`;
        } else {
          startInp.disabled = true;
          btnZone.innerHTML = `
            <button onclick="doAction('extend')"
                class="bg-teal-600 text-white px-6 py-3 rounded-lg font-black hover:bg-teal-700 transition-all flex items-center gap-2 shadow-lg">
              <span class="material-symbols-outlined">update</span> PROLONGER LE PROJET
            </button>`;
        }
      } else {
        title.innerText = "Initialisation du Projet";
        btnZone.innerHTML = `
          <button onclick="doAction('create')" class="btn-primary px-6 py-3">
            <span class="material-symbols-outlined">rocket_launch</span> GÉNÉRER LE PROJET
          </button>`;
      }
    }

    /* ---------------------------------------------------------
    TAB SWITCHING
    --------------------------------------------------------- */
    function switchTab(t) {
      document.getElementById('module-project').style.display  = (t === 'project'  ? 'block' : 'none');
      document.getElementById('module-holidays').style.display = (t === 'holidays' ? 'block' : 'none');
      document.getElementById('tab-project').classList.toggle('active',  t === 'project');
      document.getElementById('tab-holidays').classList.toggle('active', t === 'holidays');
    }

    /* ---------------------------------------------------------
    HOLIDAYS RENDER
    --------------------------------------------------------- */
    function renderHolidays() {
      const container  = document.getElementById('holidayGrid');
      const yearSelect = document.getElementById('yearSelect');
      if (!container || !yearSelect) return;

      container.innerHTML = `
        <div class="text-center py-6 text-slate-400 italic">
          <span class="material-symbols-outlined animate-spin mr-2 align-middle">sync</span>
          Chargement des jours fériés...
        </div>
      `;

      google.script.run
        .withSuccessHandler(function(holidays) {
          const start = new Date(projectState.currentStart);
          const end   = new Date(projectState.currentEnd);

          holidays = holidays.filter(h => {
            const d = new Date(h.dateStr);
            return d >= start && d <= end;
          });

          if (holidays.length === 0) {
            const singleYear = projectState.currentStart.substring(0, 4);
            yearSelect.innerHTML = `<option value="${singleYear}">${singleYear}</option>`;
            container.innerHTML = `
              <button onclick="openHolidayModal('${singleYear}')" class="text-primary text-xs font-bold underline mb-4 ml-1">
                + Ajouter un jour de fermeture
              </button>
              <div class="text-center py-10 text-slate-400 italic">Aucun congé enregistré pour cette période.</div>`;
            return;
          }

          const prevYear = yearSelect.value;
          const years    = [...new Set(holidays.map(h => h.dateStr.substring(0, 4)))].sort();
          yearSelect.innerHTML = years.map(y => `<option value="${y}" ${y === prevYear ? "selected" : ""}>${y}</option>`).join("");

          const selectedYear  = yearSelect.value;
          const yearHolidays  = holidays.filter(h => h.dateStr.startsWith(selectedYear));
          const fragment      = document.createDocumentFragment();

          const addBtn        = document.createElement('button');
          addBtn.className    = "text-primary text-xs font-bold underline mb-4 ml-1 block";
          addBtn.innerText    = "+ Ajouter un jour de fermeture";
          addBtn.onclick      = () => openHolidayModal(selectedYear);
          fragment.appendChild(addBtn);

          yearHolidays.forEach(h => {
            const isFixed   = h.typeFixe === "Oui";
            const dateObj   = new Date(h.dateStr);
            const displayDate = dateObj.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });

            const row       = document.createElement('div');
            row.className   = "holiday-row flex items-center justify-between px-4 py-3 bg-white border border-slate-200 rounded-xl shadow-sm mb-2 hover:border-primary/30 transition-colors";

            row.innerHTML = `
              <div class="flex items-center gap-6 flex-1">
                <span class="text-sm font-bold text-slate-700 w-[100px]">${displayDate}</span>
                <input type="text" value="${h.desc}" disabled
                   class="flex-1 border-none bg-transparent text-sm font-medium focus:ring-0 ${isFixed ? "text-slate-400" : "text-slate-800"}">
              </div>

              <div class="flex items-center gap-4">
                <span class="text-[10px] font-black px-2 py-1 rounded ${isFixed ? "bg-slate-100 text-slate-500" : "bg-amber-50 text-amber-600"}">
                  ${isFixed ? "FIXE" : "MODIFIABLE"}
                </span>

                ${isFixed ? `
                  <label class="flex items-center gap-2 text-xs font-bold text-slate-500 cursor-pointer">
                    Ouvré
                    <input type="checkbox" ${h.isWorkingDay === "Oui" ? "checked" : ""}
                      onchange="toggleHolidayWorkingStatus('${h.dateStr}', this.checked, this)"
                      class="w-4 h-4 rounded text-primary border-slate-300 focus:ring-primary transition-all">
                  </label>
                ` : `
                  <div class="flex gap-2">
                    <button class="w-8 h-8 flex items-center justify-center text-blue-500 hover:bg-blue-50 rounded-full transition-colors"
                        onclick="openHolidayEditModal('${h.dateStr}', '${h.desc}')">
                      <span class="material-symbols-outlined text-lg">edit</span>
                    </button>
                    <button class="w-8 h-8 flex items-center justify-center text-rose-500 hover:bg-rose-50 rounded-full transition-colors"
                        onclick="deleteHoliday('${h.dateStr}', '${h.desc}')">
                      <span class="material-symbols-outlined text-lg">delete</span>
                    </button>
                  </div>
                `}
              </div>
            `;
            fragment.appendChild(row);
          });

          container.innerHTML = "";
          container.appendChild(fragment);
        })
        .withFailureHandler(err => {
          appErrorLog(err, "renderHolidays", { context: "Render Holidays", projectId: PROJECT_ID });
        })
        .getHolidaysFromSheet(APP_DATA.token);
    }

    /* ---------------------------------------------------------
    OPEN / CLOSE HOLIDAY MODAL
    --------------------------------------------------------- */
    function openHolidayModal(year) {
      const modal = document.getElementById("holidayModal");
      const box   = document.getElementById("holidayModalBox");

      document.getElementById("holidayModalYear").innerText = "Année " + year;
      modal.dataset.year = year;
      modal.classList.remove("hidden");

      setTimeout(() => {
        box.classList.remove("scale-95", "opacity-0");
        box.classList.add("scale-100", "opacity-100");
      }, 10);
    }

    function closeHolidayModal() {
      const modal = document.getElementById("holidayModal");
      const box   = document.getElementById("holidayModalBox");

      box.classList.add("scale-95", "opacity-0");

      setTimeout(() => {
        modal.classList.add("hidden");
        modal.dataset.mode = "create";
        delete modal.dataset.originalDate;
        delete modal.dataset.originalDesc;
        document.getElementById("holidayDate").value = "";
        document.getElementById("holidayDesc").value = "";
        document.getElementById("holidayModalYear").innerText = "";
      }, 150);
    }


    /* ---------------------------------------------------------
    SAVE NEW / EDIT HOLIDAY (AVEC VÉRIFICATION)
    --------------------------------------------------------- */
function saveNewHoliday(event) {
  event.preventDefault();
  const modal = document.getElementById("holidayModal");
  const mode  = modal.dataset.mode || "create";
  const date  = document.getElementById("holidayDate").value;
  const desc  = document.getElementById("holidayDesc").value;

  if (!date || !desc) return;

  // 1. La logique de sauvegarde finale
  const executeSave = () => {
    closeHolidayModal();
    showLoading('Enregistrement...');

    if (mode === "edit") {
      const originalDate = modal.dataset.originalDate;
      const originalDesc = modal.dataset.originalDesc;
      google.script.run
        .withSuccessHandler(() => {
          showModal({ icon: 'success', title: 'Succès', text: 'Le congé a été mis à jour.' });
          renderHolidays();
        })
        .withFailureHandler(err => {
          showModal({ icon: 'error', title: 'Erreur', text: err.message });
          appErrorLog(err, "updateCustomHoliday", { originalDate, originalDesc, date, desc, projectId: PROJECT_ID });
        })
        .updateCustomHoliday(APP_DATA.token, originalDate, originalDesc, date, desc, PROJECT_ID);
    } else {
      const year = modal.dataset.year;
      google.script.run
        .withSuccessHandler(() => {
          showModal({ icon: 'success', title: 'Succès', text: 'Le congé a été ajouté.' });
          renderHolidays();
        })
        .withFailureHandler(err => {
          showModal({ icon: 'error', title: 'Erreur', text: err.message });
          appErrorLog(err, "insertCustomHoliday", { date, desc, year, projectId: PROJECT_ID });
        })
        .insertCustomHoliday(APP_DATA.token, date, desc, "Non", year, PROJECT_ID);
    }
  };

  // 2. Vérification avant de sauvegarder
  Swal.fire({
    title: 'Vérification...',
    text: 'Recherche de tâches planifiées sur cette date.',
    allowOutsideClick: false,
    didOpen: () => { Swal.showLoading(); }
  });

  google.script.run
    .withSuccessHandler((response) => {
      if (response.hasTasks) {
        Swal.fire({
          title: 'Attention !',
          html: `Des tâches ou interventions sont déjà planifiées le <b>${date}</b>.<br><br>Voulez-vous vraiment définir ce jour comme de fermeture ?`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'Oui, continuer',
          cancelButtonText: 'Annuler'
        }).then((result) => {
          if (result.isConfirmed) {
            executeSave();
          }
        });
      } else {
        Swal.close();
        executeSave();
      }
    })
    .withFailureHandler((error) => {
      console.error("Erreur de vérification :", error);
      Swal.fire('Erreur', 'Impossible de vérifier le planning.', 'error');
    })
    .gsCheckTasksOnDates(APP_DATA.token, [date]);
}

    /* ---------------------------------------------------------
    SAVE ALL HOLIDAYS (bulk)
    --------------------------------------------------------- */
    function saveHolidays() {
      const grid        = document.getElementById('holidayGrid');
      const holidayDivs = grid.querySelectorAll('.holiday-row');
      const holidayData = [];

      holidayDivs.forEach(div => {
        const dateInput   = div.querySelector('input[type="date"]');
        const descInput   = div.querySelector('input[type="text"]');
        const workingCheck = div.querySelector('input[type="checkbox"]');
        const typeLabel   = div.querySelector('span').innerText;

        if (dateInput && dateInput.value) {
          const isWorking = workingCheck && workingCheck.checked ? "Oui" : "Non";
          holidayData.push([
            dateInput.value,
            descInput.value,
            typeLabel.includes('FIXE') ? "Oui" : "Non",
            isWorking
          ]);
        }
      });

      showLoading('Enregistrement...');

      google.script.run
        .withSuccessHandler(() => {
          showModal({ icon: 'success', title: 'Succès', text: 'Calendrier mis à jour.' });
          renderHolidays();
        })
        .withFailureHandler(err => {
          appErrorLog(err, "updateHolidaysInSheet", { holidayData, projectId: PROJECT_ID });
        })
        .updateHolidaysInSheet(APP_DATA.token, holidayData, PROJECT_ID);
    }

    /* ---------------------------------------------------------
    DO ACTION (project generation / modification)
    --------------------------------------------------------- */
    function doAction(mode) {
      const isProjectTab = document.getElementById('module-project').style.display !== "none";

      let startDate = "";
      let endDate   = "";
      let months    = "";

      if (isProjectTab) {
        startDate = document.getElementById('start_date').value;
        endDate   = document.getElementById('end_date').value;
        months    = document.getElementById('end_months').value;

        if (!startDate) {
          return showModal({ icon: 'warning', title: 'Champ manquant', text: 'Veuillez choisir une date de début.' });
        }
      }

      showModal({
        title: 'Confirmer la modification ?',
        text: "Le planning sera recalculé et les données existantes seront déplacées.",
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#0d59f2',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Oui, modifier',
        cancelButtonText: 'Annuler'
      }).then((result) => {
        if (!result.isConfirmed) return;

        showLoading('Traitement en cours', "Vérification de l'intégrité des données...");

        google.script.run
          .withSuccessHandler((msg) => {
            showModal({ icon: 'success', title: 'Succès', text: msg });
            refreshState();
          })
          .withFailureHandler((err) => {
            if (err.message && err.message.includes("DATA_LOSS_PREVENTION")) {
              const cleanMessage = err.message.replace("DATA_LOSS_PREVENTION:", "").trim();
              showModal({
                title: "Action Interrompue",
                html: `
                  <div class="text-left p-4 bg-rose-50 border border-rose-200 rounded text-rose-700">
                    <p class="font-bold mb-2">⚠️ Risque de perte de données :</p>
                    <p class="mb-4">${cleanMessage}</p>
                    <hr class="border-rose-200 mb-4">
                    <p class="text-xs italic">Veuillez élargir vos dates ou supprimer manuellement ces données avant de modifier.</p>
                  </div>
                `,
                icon: "error",
                confirmButtonText: "Compris",
                confirmButtonColor: "#be123c"
              });
            } else {
              showModal({ icon: 'error', title: 'Erreur Système', text: err.message });
            }
            appErrorLog(err, "processProjectGeneration", { startDate, endDate, months, mode, projectId: PROJECT_ID });
          })
          .processProjectGeneration(APP_DATA.token, { startDate, endDate, months, mode }, PROJECT_ID);
      });
    }

    /* ---------------------------------------------------------
    DELETE HOLIDAY
    --------------------------------------------------------- */
    function deleteHoliday(dateStr, desc) {
      showModal({
        title: "Supprimer ce congé ?",
        text: desc + " (" + dateStr + ")",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#64748b",
        confirmButtonText: "Supprimer",
        cancelButtonText: "Annuler"
      }).then(result => {
        if (!result.isConfirmed) return;

        showLoading('Suppression...');

        google.script.run
          .withSuccessHandler(() => {
            showModal({ icon: 'success', title: 'Succès', text: 'Le jour de fermeture a été supprimé.' });
            renderHolidays();
          })
          .withFailureHandler(err => {
            showModal({ icon: 'error', title: 'Erreur', text: err.message });
            appErrorLog(err, "deleteHolidayFromSheet", { dateStr, desc, projectId: PROJECT_ID });
          })
          .deleteHolidayFromSheet(APP_DATA.token, dateStr, desc, PROJECT_ID);
      });
    }

    /* ---------------------------------------------------------
    EDIT HOLIDAY MODAL
    --------------------------------------------------------- */
    function openHolidayEditModal(dateStr, desc) {
      const modal = document.getElementById("holidayModal");
      const box   = document.getElementById("holidayModalBox");

      modal.dataset.mode         = "edit";
      modal.dataset.originalDate = dateStr;
      modal.dataset.originalDesc = desc;

      document.getElementById("holidayDate").value = dateStr;
      document.getElementById("holidayDesc").value = desc;
      document.getElementById("holidayModalYear").innerText = "Modifier un jour de fermeture";

      modal.classList.remove("hidden");
      setTimeout(() => {
        box.classList.remove("scale-95", "opacity-0");
        box.classList.add("scale-100", "opacity-100");
      }, 10);
    }

    /* ---------------------------------------------------------
    TOGGLE END INPUT (date vs months)
    --------------------------------------------------------- */
    function toggleEndInput() {
      const mode      = document.querySelector('input[name="endType"]:checked').value;
      const endDate   = document.getElementById("end_date");
      const endMonths = document.getElementById("end_months");

      if (mode === "date") {
        endMonths.classList.add("hidden");
        endDate.classList.remove("hidden");
        endMonths.value = "";
      } else {
        endDate.classList.add("hidden");
        endMonths.classList.remove("hidden");
        endDate.value = "";
      }
    }

    /* ---------------------------------------------------------
TOGGLE HOLIDAY WORKING STATUS (AVEC VÉRIFICATION)
--------------------------------------------------------- */
function toggleHolidayWorkingStatus(dateStr, isChecked, checkboxElement = null) {

  // 1. Définir la logique de sauvegarde réelle (ce que vous aviez avant)
  const executeSave = () => {
    google.script.run
      .withSuccessHandler(() => {
        console.log("Status updated for " + dateStr);
        // Optionnel : Notification de succès discrète
      })
      .withFailureHandler(err => {
        showModal({ icon: 'error', title: 'Erreur', text: "Impossible de mettre à jour le statut : " + err.message });
        appErrorLog(err, "updateSingleHolidayStatus", {
          dateStr,
          newStatus: isChecked ? "Oui" : "Non",
          projectId: PROJECT_ID
        });
        // En cas d'erreur serveur, on annule visuellement la case à cocher
        if (checkboxElement) checkboxElement.checked = !isChecked;
      })
      .updateSingleHolidayStatus(APP_DATA.token, dateStr, isChecked ? "Oui" : "Non", PROJECT_ID);
  };

  // 2. Déterminer si l'action consiste à rendre le jour NON OUVRÉ
  // (Ajustez la condition selon votre logique : si isChecked === false signifie "non ouvré")
  const isBecomingNonWorkingDay = (isChecked === false); // ou true selon votre paramétrage

  if (isBecomingNonWorkingDay) {
    // 3. Lancer la vérification backend
    Swal.fire({
      title: 'Vérification...',
      text: 'Recherche de tâches planifiées sur cette date.',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    google.script.run
      .withSuccessHandler((response) => {
        if (response.hasTasks) {
          // Conflit détecté : Demander confirmation
          Swal.fire({
            title: 'Attention !',
            html: `Des tâches ou interventions sont déjà planifiées le <b>${dateStr}</b>.<br><br>Voulez-vous vraiment définir ce jour comme non ouvré ?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Oui, continuer',
            cancelButtonText: 'Annuler'
          }).then((result) => {
            if (result.isConfirmed) {
              executeSave(); // L'utilisateur force la sauvegarde
            } else {
              // L'utilisateur annule : on remet la case à cocher dans son état précédent
              if (checkboxElement) checkboxElement.checked = !isChecked;
            }
          });
        } else {
          // Aucun conflit, on sauvegarde directement
          Swal.close();
          executeSave();
        }
      })
      .withFailureHandler((error) => {
        console.error("Erreur de vérification :", error);
        Swal.fire('Erreur', 'Impossible de vérifier le planning.', 'error');
        if (checkboxElement) checkboxElement.checked = !isChecked;
      })
      .gsCheckTasksOnDates(APP_DATA.token, [dateStr]); // Appel à la fonction .gs créée précédemment

  } else {
    // Si on rend le jour OUVRE (ouvrable), aucune vérification n'est nécessaire
    executeSave();
  }
}

  </script>
