<script>
(function () {
  'use strict';

  // =========================================================
  // EDL LAYER  —  registers itself as layer id 'edl'
  // =========================================================

  let photoCache = {};
  // Staff-only "show unused too" toggle for the gallery — per-session UI
  // state, not persisted. Unused photos are always in photoCache/rendered
  // data; this just controls whether they're filtered out of the grid.
  let showUnusedPhotos = false;
  // Photo viewer state (spec section 2's "bigger view") — which room's
  // photo list is currently open in the plan-container, and which index.
  let photoViewerState = null; // { idLot, room, index } | null

  function initPhotoCache(photosArray) {
    photoCache = {};
    (photosArray || []).forEach(p => {
      if (!photoCache[p.idLot]) photoCache[p.idLot] = {};
      if (!photoCache[p.idLot][p.room]) photoCache[p.idLot][p.room] = [];
      photoCache[p.idLot][p.room].push(p);
    });
  }

  function applyStatusSelectColor(selectEl) {
    const displayEl = document.getElementById('edl-status-display');
    selectEl.classList.remove(
      'bg-blue-500', 'text-white',
      'bg-orange-400', 'text-slate-900',
      'bg-red-300',
      'bg-slate-50', 'text-slate-700'
    );
    displayEl.className = 'status-display-badge px-4 py-2 rounded-xl text-sm font-bold border border-transparent';

    const val = selectEl.value;
    displayEl.textContent = val || 'Aucun';
    if (val === 'Info') {
      selectEl.classList.add('bg-blue-500', 'text-white');
      displayEl.classList.add('bg-blue-500', 'text-white');
    } else if (val === 'Attention') {
      selectEl.classList.add('bg-orange-400', 'text-slate-900');
      displayEl.classList.add('bg-orange-400', 'text-slate-900');
    } else if (val === 'Bloquant') {
      selectEl.classList.add('bg-red-300', 'text-slate-900');
      displayEl.classList.add('bg-red-300', 'text-slate-900');
    } else {
      selectEl.classList.add('bg-slate-50', 'text-slate-700');
      displayEl.classList.add('bg-slate-50', 'text-slate-700');
    }
  }

  function updateStatusAndNotes(ctx) {
    const pubInput = document.getElementById('edl-note-pub');
    const privInput = document.getElementById('edl-note-priv');
    const statusContainer = document.getElementById('global-status-container');
    const statusSelect = document.getElementById('edl-status-select');
    const generalContainer = document.getElementById('edl-general-note-container');
    const generalPubInput = document.getElementById('edl-general-note-pub');
    const generalPrivInput = document.getElementById('edl-general-note-priv');

    pubInput.value = '';
    privInput.value = '';
    statusSelect.value = '';
    if (generalPubInput) generalPubInput.value = '';
    if (generalPrivInput) generalPrivInput.value = '';
    if (generalContainer) generalContainer.classList.add('hidden');

    document.getElementById('private-note-container').classList.toggle('hidden', ctx.isClientViewActive);
    if (!ctx.activeId) return;

    const isWholeLevel = String(ctx.activeId).startsWith('GLOBAL_');

    if (isWholeLevel) {
      statusContainer.classList.add('hidden');
      const notesRow = (rawData.edlNotes || []).find(r => String(r.ID) === String(ctx.activeId));
      if (notesRow && notesRow['Général']) {
        try {
          const parsed = JSON.parse(notesRow['Général']);
          pubInput.value = parsed.pub || '';
          privInput.value = parsed.priv || '';
        } catch (e) { console.error("Parse error:", e); }
      }
    } else if (ctx.roomName === 'all' || ctx.currentView !== 'locataires') {
      statusContainer.classList.remove('hidden');
      const planData = (rawData.planning && rawData.planning[ctx.activeId]) ? rawData.planning[ctx.activeId] : null;
      if (planData) {
        statusSelect.value = planData.status || '';
        pubInput.value = planData.note || '';
        privInput.value = planData.privateNote || '';
      }
      applyStatusSelectColor(statusSelect);

      // NEW 2026-08-26 (spec section 2): a second, EDL-specific general
      // note pair — only for "Toutes les pièces" on a normal apartment,
      // not Communs/Façades (those hit this same branch via
      // ctx.currentView !== 'locataires' but don't get this note).
      // Distinct purpose from the Planning note just above: this one is
      // specifically about the work observed for THIS EDL, reusing the
      // same 'Général' EDL Notes column whole-building entries use.
      if (ctx.currentView === 'locataires' && generalContainer) {
        generalContainer.classList.remove('hidden');
        const generalPrivContainer = document.getElementById('edl-general-note-priv-container');
        if (generalPrivContainer) generalPrivContainer.classList.toggle('hidden', ctx.isClientViewActive);
        const notesRow = (rawData.edlNotes || []).find(r => String(r.ID) === String(ctx.activeId));
        if (notesRow && notesRow['Général']) {
          try {
            const parsed = JSON.parse(notesRow['Général']);
            if (generalPubInput) generalPubInput.value = parsed.pub || '';
            if (generalPrivInput) generalPrivInput.value = parsed.priv || '';
          } catch (e) { console.error("Parse error:", e); }
        }
      }
    } else {
      statusContainer.classList.add('hidden');
      const notesRow = (rawData.edlNotes || []).find(r => String(r.ID) === String(ctx.activeId));
      if (notesRow && notesRow[ctx.roomName]) {
        try {
          const parsed = JSON.parse(notesRow[ctx.roomName]);
          pubInput.value = parsed.pub || '';
          privInput.value = parsed.priv || '';
        } catch (e) { console.error("Parse error:", e); }
      }
    }
  }

  function saveCurrentNotesInBackground(ctx) {
    if (!ctx.activeId) return;
    const roomSelect = document.getElementById('room-select');
    const isGlobal = (roomSelect.value === 'all' || roomSelect.value === '' || ctx.currentView !== 'locataires');
    const isWholeLevel = String(ctx.activeId).startsWith('GLOBAL_');

    const roomName = (isWholeLevel || isGlobal) ? 'Général' : roomSelect.value;
    const generalPubInput = document.getElementById('edl-general-note-pub');
    const generalPrivInput = document.getElementById('edl-general-note-priv');
    const hasGeneralNote = isGlobal && !isWholeLevel && ctx.currentView === 'locataires';

    const payload = {
      id: ctx.activeId,
      room: roomName,
      isGlobal: isGlobal,
      isWholeLevel: isWholeLevel,
      currentView: ctx.currentView,
      pubNote: document.getElementById('edl-note-pub').value.trim(),
      privNote: document.getElementById('edl-note-priv').value.trim(),
      status: (isGlobal && !isWholeLevel) ? document.getElementById('edl-status-select').value : null,
      edlGeneralPub: hasGeneralNote && generalPubInput ? generalPubInput.value.trim() : undefined,
      edlGeneralPriv: hasGeneralNote && generalPrivInput ? generalPrivInput.value.trim() : undefined
    };

    google.script.run
      .withSuccessHandler(() => {
        if (isGlobal && !isWholeLevel) {
          if (!rawData.planning) rawData.planning = {};
          rawData.planning[ctx.activeId] = { status: payload.status, note: payload.pubNote, privateNote: payload.privNote };

          if (hasGeneralNote) {
            let notesRow = rawData.edlNotes.find(r => String(r.ID) === String(ctx.activeId));
            if (!notesRow) {
              notesRow = { ID: ctx.activeId };
              rawData.edlNotes.push(notesRow);
            }
            notesRow['Général'] = JSON.stringify({ pub: payload.edlGeneralPub || '', priv: payload.edlGeneralPriv || '' });
          }
        } else {
          let notesRow = rawData.edlNotes.find(r => String(r.ID) === String(ctx.activeId));
          if (!notesRow) {
            notesRow = { ID: ctx.activeId };
            rawData.edlNotes.push(notesRow);
          }
          notesRow[roomName] = JSON.stringify({ pub: payload.pubNote, priv: payload.privNote });
        }
        showToast('Sauvegarde auto...', 'success', '', 1000);
      })
      .withFailureHandler((err) => {
        console.error("Auto-save failed:", err.message);
        appErrorLog(err, "saveEDLNotesData", { projectId: APP_DATA.projectId, activeId: ctx.activeId });
      })
      .saveEDLNotesData(APP_DATA.token, APP_DATA.projectId, payload);
  }

  function updatePhotos(ctx) {
    const grid = document.getElementById('photo-gallery-grid');
    if (!grid) return;
    grid.innerHTML = '';

    const toggleBtn = document.getElementById('photo-unused-toggle');
    if (toggleBtn) toggleBtn.classList.toggle('hidden', !ctx.activeId || !ctx.roomName);

    if (!ctx.activeId || !photoCache[ctx.activeId] || !photoCache[ctx.activeId][ctx.roomName]) {
      grid.innerHTML = '<p class="text-xs text-slate-400 italic col-span-full">Aucune photo pour cette sélection.</p>';
      return;
    }

    const allPhotos = photoCache[ctx.activeId][ctx.roomName];
    if (!Array.isArray(allPhotos)) return;
    const photos = showUnusedPhotos ? allPhotos : allPhotos.filter(p => !p.unused);

    let htmlContent = '';
    photos.forEach((p) => {
      if (!p || !p.driveId) return;
      const imgUrl = 'https://lh3.googleusercontent.com/d/' + p.driveId;
      // Index into allPhotos (not the filtered `photos` array) — the
      // viewer's prev/next always cycles the full list, so its indices
      // must stay stable regardless of the show/hide-unused toggle.
      const fullIndex = allPhotos.indexOf(p);
      htmlContent +=
        '<div class="relative group aspect-square bg-slate-100 rounded-lg overflow-hidden border border-slate-200' + (p.unused ? ' opacity-60' : '') + '">' +
           '<img src="' + imgUrl + '" class="w-full h-full object-cover cursor-pointer" onclick="window.__edlOpenPhotoViewer(' + fullIndex + ')" />' +
           (p.unused ? '<span class="absolute top-1 left-1 bg-slate-800/90 text-white text-[8px] font-black uppercase tracking-wide px-1.5 py-0.5 rounded">Non utilisée</span>' : '') +
           (p.caption ? '<div class="absolute bottom-0 inset-x-0 bg-black/55 text-white text-[9px] px-1.5 py-1 truncate">' + escapeHtml(p.caption) + '</div>' : '') +
           '<div class="edit-only-ui absolute top-1 right-1 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">' +
             '<button title="' + (p.unused ? 'Réactiver cette photo' : 'Marquer inutilisée') + '" onclick="event.stopPropagation(); window.__edlToggleUnusedPhoto(\'' + p.photoId + '\', ' + (!p.unused) + ')" class="bg-white/90 text-slate-600 p-1 rounded-full hover:bg-white">' +
               '<span class="material-symbols-outlined !text-[14px]">' + (p.unused ? 'visibility' : 'visibility_off') + '</span>' +
             '</button>' +
             '<button title="Déplacer cette photo" onclick="event.stopPropagation(); window.__edlMigratePhoto(\'' + p.photoId + '\')" class="bg-white/90 text-slate-600 p-1 rounded-full hover:bg-white">' +
               '<span class="material-symbols-outlined !text-[14px]">drive_file_move</span>' +
             '</button>' +
           '</div>' +
        '</div>';
    });
    grid.innerHTML = htmlContent || '<p class="text-xs text-slate-400 italic col-span-full">' + (showUnusedPhotos ? 'Aucune photo pour cette sélection.' : 'Aucune photo visible (essayez d\'afficher les photos inutilisées).') + '</p>';
  }

  function bindPhotoUpload(container) {
    const dropzone = container.querySelector('#photo-dropzone');
    const fileInput = container.querySelector('#photo-upload-input');
    if (!dropzone || !fileInput) return;

    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const scale = 800 / img.width;
          canvas.width = 800;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

          const base64Data = canvas.toDataURL('image/webp', 0.8).split(',')[1];
          const activeId = selectionState.selectedItem.id;
          const room = document.getElementById('room-select').value;
          const captionInput = document.getElementById('photo-caption-input');
          const caption = captionInput ? captionInput.value.trim() : '';

          google.script.run
            .withSuccessHandler((response) => {
              if (!photoCache[activeId]) photoCache[activeId] = {};
              if (!photoCache[activeId][room]) photoCache[activeId][room] = [];
              photoCache[activeId][room].push(response);
              if (captionInput) captionInput.value = '';

              updatePhotos(WorkspaceCore.buildContext());
              showToast('Photo ajoutée !', 'success');
              appLog('edl', activeId, 'Ajout photo', 'Private', 'Detail', { Pièce: room, Légende: caption || '(aucune)' });
            })
            .withFailureHandler((err) => {
              showModal({ icon: 'error', title: 'Erreur', text: "L'envoi de la photo a échoué." });
              appErrorLog(err, 'uploadEDLPhoto', { activeId, room });
            })
            .uploadEDLPhoto(APP_DATA.token, APP_DATA.projectId, activeId, room, file.name, base64Data, 'image/webp', caption);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // =========================================================
  // PHOTO VIEWER (spec section 2 — "bigger view")
  // =========================================================
  // Reuses the shared plan-container's zoom/pan via
  // WorkspaceCore.showImageInPlanViewer()/restorePlanViewer() (added
  // 2026-08-26 in Workspace_Core_Scripts.html) instead of a second
  // zoom system, per the spec's explicit instruction. Controls are
  // injected into .plan-container at open time and removed on close,
  // rather than added to the static shell markup, keeping this feature
  // scoped to the EDL layer's own script like every other layer-specific
  // affordance.

  function currentViewerPhotos() {
    if (!photoViewerState) return [];
    const room = (photoCache[photoViewerState.idLot] || {})[photoViewerState.room];
    return Array.isArray(room) ? room : [];
  }

  function renderPhotoViewerControls() {
    const planContainer = document.querySelector('.plan-container');
    if (!planContainer) return;
    let controls = document.getElementById('edl-photo-viewer-controls');
    if (!controls) {
      controls = document.createElement('div');
      controls.id = 'edl-photo-viewer-controls';
      // Tagged .layer-overlay so it's swept for free by the shell's
      // existing clearPlanOverlays() on every layer switch (it targets
      // '.plan-tag, .layer-overlay' document-wide, not just things inside
      // #plan-markers-overlay) — otherwise these controls would stay
      // stuck on screen if the user switches away while the viewer's open
      // without clicking "back to plan" first.
      controls.className = 'layer-overlay absolute top-4 left-4 z-30 flex flex-col gap-2 items-start';
      planContainer.appendChild(controls);
    }

    const photos = currentViewerPhotos();
    const p = photos[photoViewerState.index] || {};
    const infoOpen = !!photoViewerState.infoOpen;

    controls.innerHTML = `
      <div class="flex gap-1.5 bg-white/95 backdrop-blur-sm p-1.5 rounded-xl shadow-lg border border-slate-200">
        <button title="Retour au plan" onclick="window.__edlClosePhotoViewer()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600"><span class="material-symbols-outlined !text-[18px]">arrow_back</span></button>
        <button title="Photo précédente" onclick="window.__edlPhotoViewerNav(-1)" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600" ${photos.length < 2 ? 'disabled style="opacity:.35"' : ''}><span class="material-symbols-outlined !text-[18px]">chevron_left</span></button>
        <button title="Photo suivante" onclick="window.__edlPhotoViewerNav(1)" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600" ${photos.length < 2 ? 'disabled style="opacity:.35"' : ''}><span class="material-symbols-outlined !text-[18px]">chevron_right</span></button>
        <button title="Informations" onclick="window.__edlTogglePhotoViewerInfo()" class="p-1.5 rounded-lg ${infoOpen ? 'bg-primary-light text-primary' : 'hover:bg-slate-100 text-slate-600'}"><span class="material-symbols-outlined !text-[18px]">info</span></button>
      </div>
      ${infoOpen ? `
      <div class="bg-white/95 backdrop-blur-sm px-3 py-2 rounded-xl shadow-lg border border-slate-200 text-[11px] text-slate-600 max-w-[260px]">
        ${p.caption ? `<div class="font-bold text-slate-700 mb-1">${escapeHtml(p.caption)}</div>` : '<div class="italic text-slate-400 mb-1">Aucune légende</div>'}
        <div>Ajoutée par <b>${escapeHtml(p.uploader || 'Inconnu')}</b></div>
        <div>${escapeHtml(formatHistoryTimestamp ? formatHistoryTimestamp(p.timestamp) : String(p.timestamp || ''))}</div>
        ${p.unused ? `<div class="mt-1 pt-1 border-t border-slate-100 text-amber-600 font-bold">Non utilisée${p.unusedReason ? ' — ' + escapeHtml(p.unusedReason) : ''}</div>` : ''}
      </div>` : ''}
    `;
  }

  window.__edlOpenPhotoViewer = function (index) {
    const ctx = WorkspaceCore.buildContext();
    if (!ctx.activeId || !ctx.roomName) return;
    photoViewerState = { idLot: ctx.activeId, room: ctx.roomName, index: index, infoOpen: false };
    const photos = currentViewerPhotos();
    const p = photos[index];
    if (!p) { photoViewerState = null; return; }
    WorkspaceCore.showImageInPlanViewer('https://lh3.googleusercontent.com/d/' + p.driveId);
    renderPhotoViewerControls();
  };

  window.__edlPhotoViewerNav = function (delta) {
    if (!photoViewerState) return;
    const photos = currentViewerPhotos();
    if (!photos.length) return;
    let next = photoViewerState.index + delta;
    if (next < 0) next = photos.length - 1;
    if (next >= photos.length) next = 0;
    photoViewerState.index = next;
    const p = photos[next];
    WorkspaceCore.showImageInPlanViewer('https://lh3.googleusercontent.com/d/' + p.driveId);
    renderPhotoViewerControls();
  };

  window.__edlTogglePhotoViewerInfo = function () {
    if (!photoViewerState) return;
    photoViewerState.infoOpen = !photoViewerState.infoOpen;
    renderPhotoViewerControls();
  };

  window.__edlClosePhotoViewer = function () {
    photoViewerState = null;
    const controls = document.getElementById('edl-photo-viewer-controls');
    if (controls) controls.remove();
    WorkspaceCore.restorePlanViewer();
  };

  // =========================================================
  // MARK PHOTO UNUSED (spec section 2 — never a true delete)
  // =========================================================

  window.__edlToggleUnusedPhoto = async function (photoId, makeUnused) {
    let reason = '';
    if (makeUnused) {
      const { isConfirmed, value } = await Swal.fire({
        title: 'Marquer cette photo comme inutilisée',
        html: `<div class="text-left text-xs text-slate-500 mb-2">La photo reste visible (grisée, badge "Non utilisée") — ce n'est pas une suppression.</div>
               <textarea id="unused-reason-input" rows="2" class="w-full rounded-lg border-slate-300 shadow-sm text-sm" placeholder="Raison (optionnel)"></textarea>`,
        showCancelButton: true,
        confirmButtonText: 'Marquer inutilisée',
        cancelButtonText: 'Annuler',
        confirmButtonColor: '#0d59f2',
        focusConfirm: false,
        preConfirm: () => document.getElementById('unused-reason-input').value.trim()
      });
      if (!isConfirmed) return;
      reason = value || '';
    }

    google.script.run
      .withSuccessHandler(() => {
        Object.keys(photoCache).forEach(idLot => {
          Object.keys(photoCache[idLot] || {}).forEach(room => {
            (photoCache[idLot][room] || []).forEach(p => {
              if (p.photoId === photoId) { p.unused = makeUnused; p.unusedReason = makeUnused ? reason : ''; }
            });
          });
        });
        updatePhotos(WorkspaceCore.buildContext());
        showToast(makeUnused ? 'Photo marquée inutilisée.' : 'Photo réactivée.', 'success');
        appLog('edl', photoId, makeUnused ? 'Photo marquée inutilisée' : 'Photo réactivée', 'Private', 'Milestone', { Raison: reason || '(aucune)' });
      })
      .withFailureHandler((err) => {
        showModal({ icon: 'error', title: 'Erreur', text: "Impossible de mettre à jour la photo." });
        appErrorLog(err, 'gsSetEDLPhotoUnused', { photoId, makeUnused });
      })
      .gsSetEDLPhotoUnused(APP_DATA.token, APP_DATA.projectId, photoId, makeUnused, reason);
  };

  // =========================================================
  // MIGRATE SINGLE PHOTO (spec section 2)
  // =========================================================

  window.__edlMigratePhoto = async function (photoId) {
    const { isConfirmed, value } = await Swal.fire({
      title: 'Déplacer cette photo',
      html: `<div class="flex flex-col gap-3 mt-1 text-left">
               <div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ID appartement cible (laisser vide pour ne pas changer)</label>
               <input id="migrate-photo-id" class="w-full rounded-lg border-slate-300 shadow-sm text-sm" placeholder="ex: L-014"></div>
               <div><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Pièce cible (laisser vide pour ne pas changer)</label>
               <input id="migrate-photo-room" class="w-full rounded-lg border-slate-300 shadow-sm text-sm" placeholder="ex: Salon"></div>
             </div>`,
      showCancelButton: true,
      confirmButtonText: 'Déplacer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#0d59f2',
      focusConfirm: false,
      preConfirm: () => ({
        targetIdLot: document.getElementById('migrate-photo-id').value.trim(),
        targetRoom: document.getElementById('migrate-photo-room').value.trim()
      })
    });
    if (!isConfirmed) return;
    if (!value.targetIdLot && !value.targetRoom) return;

    google.script.run
      .withSuccessHandler(() => {
        // Simplest correct refresh: re-pull the full photo list rather than
        // patch the nested cache by hand (this photo just moved buckets).
        google.script.run
          .withSuccessHandler(photos => { initPhotoCache(photos || []); updatePhotos(WorkspaceCore.buildContext()); })
          .withFailureHandler(err => appErrorLog(err, "getEDLPhotosData (post-migrate refresh)", {}))
          .getEDLPhotosData(APP_DATA.token);
        showToast('Photo déplacée.', 'success');
        appLog('edl', photoId, 'Photo déplacée', 'Private', 'Milestone', { 'Nouvel ID': value.targetIdLot || '(inchangé)', 'Nouvelle pièce': value.targetRoom || '(inchangée)' });
      })
      .withFailureHandler((err) => {
        showModal({ icon: 'error', title: 'Erreur', text: "Impossible de déplacer la photo." });
        appErrorLog(err, 'gsMigrateEDLPhoto', { photoId, value });
      })
      .gsMigrateEDLPhoto(APP_DATA.token, APP_DATA.projectId, photoId, value.targetIdLot, value.targetRoom);
  };

  // =========================================================
  // MIGRATE ALL EDL DATA (spec section 2 — bulk apartment-to-apartment)
  // =========================================================

  window.__edlMigrateAllData = async function () {
    const ctx = WorkspaceCore.buildContext();
    if (!ctx.activeId) { showModal({ icon: 'info', title: 'Sélection requise', text: 'Sélectionnez un appartement source d\'abord.' }); return; }

    const { isConfirmed, value } = await Swal.fire({
      title: 'Migrer toutes les données EDL',
      html: `<div class="text-left text-xs text-slate-500 mb-3">Déplace toutes les photos, notes et statuts EDL de <b>${escapeHtml(ctx.activeId)}</b> vers un autre appartement. Bloqué si la cible a déjà ses propres données.</div>
             <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ID appartement cible</label>
             <input id="migrate-all-target" class="w-full rounded-lg border-slate-300 shadow-sm text-sm" placeholder="ex: L-014">`,
      showCancelButton: true,
      confirmButtonText: 'Migrer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#dc2626',
      focusConfirm: false,
      preConfirm: () => document.getElementById('migrate-all-target').value.trim()
    });
    if (!isConfirmed || !value) return;

    google.script.run
      .withSuccessHandler((result) => {
        showToast(`Migration terminée : ${result.movedPhotoCount} photo(s), ${result.movedNoteCount} note(s) EDL, statut ${result.movedPlanning ? 'déplacé' : 'inchangé'}.`, 'success', '', 4000);
        appLog('edl', ctx.activeId, 'Migration EDL complète', 'Private', 'Milestone', { Cible: value, Photos: result.movedPhotoCount, Notes: result.movedNoteCount });
        // Reload photo cache; notes/planning are refetched on next full page load —
        // acceptable here since a migration is a rare, deliberate admin action.
        google.script.run
          .withSuccessHandler(photos => { initPhotoCache(photos || []); updatePhotos(WorkspaceCore.buildContext()); })
          .getEDLPhotosData(APP_DATA.token);
      })
      .withFailureHandler((err) => {
        showModal({ icon: 'error', title: 'Migration bloquée', text: err.message || "Impossible de migrer les données." });
        appErrorLog(err, 'gsMigrateEDLData', { source: ctx.activeId, target: value });
      })

(function () {

  // TRAVAUX LAYER  —  registers itself as layer id 'travaux'

  //     updateWorkItemsChecklist read back 'General' (without it), so a
  //     whole-level item's saved value could never actually be found again.
  //     Standardized on 'Général' everywhere below.
  //
  //  4. "Détails de champ" is now parsed instead of dumped as reference
  //     text: semicolon-separated Label:Type pairs (e.g.
  //     "Couleur:Dropdown;Quantité:Nombre") render as real extra inputs
  //     alongside the row's primary field, with "Options" split the same
  //     way (one ';'-block per field, in the same order). A row with no
  //     ':' in Détails de champ, or left blank, behaves exactly as before.
  //
  //  5. NEW renderPlanPanel(ctx, wrapperEl) — populates the LEFT-side

  //     Registered via the new optional Core hook of the same name; see

  //
  //  6. NEW — the Pièce dropdown (#room-select) is now frozen while Travaux

  //     #travaux-rooms-container (#dynamic-panel-content already scrolls,

  //     A fixed "Toutes les pièces" card (storage key 'Général', same as

  // ---------------------------------------------------------
  // WORK-ITEMS CHECKLIST (driven by the "Config Travaux" sheet)
  // ---------------------------------------------------------
  let travauxConfig = [];

  // Splits a comma-separated sheet cell into a clean array, e.g.
  // "Cuisine, Sejour" -> ["Cuisine", "Sejour"]. Used for "Pieces
  // Applicables" and for each ';'-separated block of "Options".
  function splitList(str) {
    return String(str || '').split(',').map(s => s.trim()).filter(Boolean);
  }

  // Maps the sheet's "Cible" wording (Locataires / Commun / Facades) onto
  // this app's internal view keys (locataires / communs / facades), so a
  // config row written in French matches ctx.currentView directly.
  function normalizeView(cible) {
    const v = String(cible || '').trim().toLowerCase();
    if (v.startsWith('local')) return 'locataires';
    if (v.startsWith('commun')) return 'communs';
    if (v.startsWith('facade')) return 'facades';
    return v; // unrecognized value: pass through rather than silently hide the row
  }

  // "Détails de champ" mini-language (semicolon-separated Label:Type extra
  // fields) removed entirely 2026-08-26 (agents/edl-page-spec.md section 3,
  // "New: primary/secondary work items, replacing 'champs supplémentaires'")
  // — replaced by the parentId-based primary/secondary link below.
  // parseDetailsChamp()/extraFields/extraOptions no longer exist; a row's
  // Détails de champ sheet cell (column I) is simply no longer read.

  function initTravauxConfigCache(rows) {
    travauxConfig = (rows || []).map(r => {
      // "Sous catégorie" convention: "Nom|Ligne|Logo".
      //  - Nom   : box name — the LEFT-panel recap groups by this. Box-to-
      //            box order is no longer a number stored here: it just
      //            follows sheet order (whichever Nom is seen first, top
      //            to bottom), same convention groupWorkItemsByDiscipline()
      //            already uses for Discipline below. A BLANK Nom is its own
      //            convention (2026-08-26, spec section 3) — see the pinned
      //            "Aide au déplacement des mobiliers" handling further
      //            down; don't default it to 'Autres' here.
      //  - Ligne : this row's position *inside* its box in the recap (sort
      //            key only — gaps are fine, nothing needs to be
      //            contiguous; ties just fall back to sheet order).
      //  - Logo  : Material Symbols icon name shown next to this row in
      //            the recap. Consecutive rows in the same box that share
      //            a Logo are grouped under one shared icon. Optional —
      //            blank means no icon for that row.
      // Old 2-part "Nom|Ordre" rows still parse fine: that number is just
      // read as Ligne now, and Logo comes back blank.
      const scParts = String(r.sousCategorie || '').split('|');
      // A row's Options is a single flat list now that extra fields (which
      // used to occupy blocks 2+ of a ';'-separated Options string) are
      // gone — the [0] here is defensive: it strips any leftover extra-
      // field option text a pre-migration row might still have saved,
      // rather than accidentally folding it into the primary dropdown.
      const primaryOptionsBlock = String(r.options || '').split(';')[0];

      return {
        idWork: r.idWork,
        cible: normalizeView(r.cible),
        sousCategorieNom: (scParts[0] || '').trim(),
        sousCategorieLigne: scParts.length > 1 ? (parseFloat(scParts[1]) || 0) : 0,
        logo: (scParts[2] || '').trim(),
        discipline: r.discipline || 'Autres',
        typeTravail: r.typeTravail || r.idWork,
        piecesApplicables: splitList(r.piecesApplicables),
        typeChamp: String(r.typeChamp || '').trim(),
        options: splitList(primaryOptionsBlock),
        // NEW 2026-08-26 (spec section 3): parentId blank/absent = this
        // poste is a primary (or standalone); non-blank = this poste is a
        // secondary linked to the primary whose idWork matches. One level
        // only — a secondary's own parentId is never itself looked up as a
        // further chain, enforced at the admin-form level (a secondary can
        // never be offered as another row's parent), not here.
        parentId: String(r.parentId || '').trim(),
        // NEW 2026-08-26 (spec section 3): optional suffix/unit ("cm"),
        // shown right after the field's value ("Largeur: 40 cm").
        suffix: String(r.suffix || '').trim()

  }

  // header-level item" convention (spec section 3): shown at the top of
  // "Gérer les postes de travaux" and the top of the Locataires checklist,
  // excluded from any sous-catégorie box on the left recap.
  function isPinnedWorkItem(item) {
    return !item.sousCategorieNom;
  }

  // Work items that apply to the view + room currently being edited.
  // Secondary items (parentId set) are deliberately excluded from this

  function getApplicableWorkItems(ctx, roomName) {
    return travauxConfig.filter(item => {
      if (item.parentId) return false;
      if (item.cible && item.cible !== ctx.currentView) return false;
      if (item.piecesApplicables.length === 0) return true; // no restriction -> applies everywhere
      // Accepts any French "all" form written in the sheet (Tout / Toute / Tous / Toutes).
      if (item.piecesApplicables.some(p => p.toLowerCase().startsWith('tout'))) return true;
      return item.piecesApplicables.some(p => p.toLowerCase() === String(roomName || '').toLowerCase());
    });
  }

  function getSecondariesOf(primaryIdWork) {

    const index = {};
    items.forEach(item => {

      if (!index[key]) {

  //

  function ctmBuildRowHtml(row, allRows, opts) {

          '<span class="material-symbols-outlined !text-[15px]">keyboard_arrow_down</span>' +
        '</button>' +
        '<button type="button" class="ctm-indent-btn w-6 h-6 flex items-center justify-center rounded-lg transition-colors ' + (opts.canIndent ? 'text-slate-400 hover:text-primary hover:bg-primary-light' : 'text-slate-200 cursor-not-allowed') + '" title="Attacher comme secondaire du poste juste au-dessus" data-indent-target="' + escapeHtml(opts.indentTargetId || '') + '" ' + (opts.canIndent ? '' : 'disabled') + '>' +
          '<span class="material-symbols-outlined !text-[15px]">chevron_right</span>' +
        '</button>';
    }

    return (
      '<div class="flex items-center justify-between gap-3 px-4 py-2.5 hover:bg-slate-50 transition-colors' + (opts.isSecondaryRow ? ' bg-slate-50/60 pl-8' : '') + '" data-ctm-row="' + escapeHtml(row.idWork) + '">' +
        '<div class="flex items-center gap-2.5 min-w-0 flex-1">' +
          (logo ? WorkspaceCore.iconSpanHtml(logo, '!text-[16px] text-primary shrink-0') : '') +
          '<div class="min-w-0">' +
            '<p class="text-xs font-bold text-slate-700 truncate">' + escapeHtml(row.typeTravail || row.idWork) + '</p>' +
            '<p class="text-[10px] text-slate-400 truncate">' +
              subLabel + ' · ' + escapeHtml(row.typeChamp || '—') + ' · ' + escapeHtml(piecesLabel) + (row.suffix ? ' · ' + escapeHtml(row.suffix) : '') +
            '</p>' +
          '</div>' +
        '</div>' +
        '<div class="flex items-center gap-0.5 shrink-0">' +
          arrowsHtml +
          '<button type="button" class="ctm-edit-btn w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-primary hover:bg-primary-light transition-colors ml-1" title="Modifier">' +
            '<span class="material-symbols-outlined !text-[16px]">edit</span>' +
          '</button>' +
          '<button type="button" class="ctm-delete-btn w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors" title="Supprimer">' +
            '<span class="material-symbols-outlined !text-[16px]">delete</span>' +
          '</button>' +
        '</div>' +
      '</div>'
    );
  }

  // Regrouped by Sous-catégorie 2026-08-26 (spec section 3, position/
  // hierarchy management) — was grouped by Discipline before. Position
  // ("Ligne") and the indent-to-secondary gesture are both scoped to "this
  // poste's siblings within the same Sous-catégorie", which a Discipline-
  // based grouping could scatter across unrelated visual groups, making
  // "the item above" ambiguous. Pinned postes (no Sous-catégorie) get
  // their own section at the top with no position arrows (nothing to
  // order them by); secondaries render indented under their primary with
  // only a detach arrow, never their own up/down/indent (their position
  // is entirely inherited from their primary).
  function ctmBuildListHtml(rows, viewKey) {
    const filtered = (rows || []).filter(function (r) { return normalizeView(r.cible) === viewKey; });
    if (filtered.length === 0) {
      return '<p class="text-xs text-slate-400 italic text-center py-10">Aucun poste de travaux pour cette vue. Cliquez sur « Ajouter » pour en créer un.</p>';
    }

    function parseRow(row) {
      const scParts = String(row.sousCategorie || '').split('|');
      return {
        raw: row,
        idWork: row.idWork,
        sousCategorieNom: (scParts[0] || '').trim(),
        sousCategorieLigne: scParts.length > 1 ? (parseFloat(scParts[1]) || 0) : 0,
        parentId: String(row.parentId || '').trim()
      };
    }
    const parsed = filtered.map(parseRow);
    const pinned = parsed.filter(function (p) { return !p.sousCategorieNom && !p.parentId; });
    const secondariesByParent = {};
    parsed.filter(function (p) { return p.parentId; }).forEach(function (p) {
      if (!secondariesByParent[p.parentId]) secondariesByParent[p.parentId] = [];
      secondariesByParent[p.parentId].push(p);
    });
    const normals = parsed.filter(function (p) { return p.sousCategorieNom && !p.parentId; });

    const scGroups = [];
    const scIndex = {};
    normals.forEach(function (p) {
      if (!scIndex[p.sousCategorieNom]) { scIndex[p.sousCategorieNom] = { name: p.sousCategorieNom, items: [] }; scGroups.push(scIndex[p.sousCategorieNom]); }
      scIndex[p.sousCategorieNom].items.push(p);
    });
    scGroups.forEach(function (g) { g.items.sort(function (a, b) { return a.sousCategorieLigne - b.sousCategorieLigne; }); });

    function rowWithSecondariesHtml(p, opts) {
      const own = ctmBuildRowHtml(p.raw, filtered, opts);
      const secHtml = (secondariesByParent[p.idWork] || []).map(function (sec) {
        return ctmBuildRowHtml(sec.raw, filtered, { isSecondaryRow: true });
      }).join('');
      return own + secHtml;
    }

    const pinnedHtml = pinned.length
      ? '<div class="mb-4">' +
          '<h4 class="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-1.5 px-1">📌 Postes épinglés</h4>' +
          '<div class="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden bg-white">' +
            pinned.map(function (p) { return rowWithSecondariesHtml(p, {}); }).join('') +
          '</div>' +
        '</div>'
      : '';

    const groupsHtml = scGroups.map(function (g) {
      return (
        '<div class="mb-4 last:mb-0">' +
          '<h4 class="text-[10px] font-black text-primary uppercase tracking-widest mb-1.5 px-1">' + escapeHtml(g.name) + '</h4>' +
          '<div class="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden bg-white">' +
            g.items.map(function (p, idx) {
              return rowWithSecondariesHtml(p, {
                showArrows: true,
                canMoveUp: idx > 0,
                canMoveDown: idx < g.items.length - 1,
                canIndent: idx > 0,
                indentTargetId: idx > 0 ? g.items[idx - 1].idWork : null
              });
            }).join('') +
          '</div>' +
        '</div>'
      );
    }).join('');

    return pinnedHtml + groupsHtml;
  }

  function openTravauxConfigManager(initialView) {
    const validKeys = CTM_VIEWS.map(function (v) { return v.key; });
    const state = {
      view: (initialView && validKeys.indexOf(initialView) !== -1) ? initialView
          : (validKeys.indexOf(window.currentView) !== -1 ? window.currentView : 'locataires')
    };

    function currentRows() { return rawData.travauxConfig || []; }

    function bindHeaderEvents() {
      document.querySelectorAll('.ctm-view-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.view = btn.dataset.view;
          renderBody();
        });
      });
      const addBtn = document.getElementById('ctm-add-btn');
      if (addBtn) addBtn.addEventListener('click', function () {
        openTravauxConfigRowForm(null, state.view);
      });
    }

    // --- Position/hierarchy actions (2026-08-26, spec section 3) -----
    // All three reuse the existing saveTravauxConfigRow endpoint (no new
    // server surface) — a Promise wrapper just makes chaining 1-2
    // sequential saves cleaner than nested callbacks. renderBody() updates
    // the list in place afterward rather than closing/reopening the whole
    // modal (submitTravauxConfigRow's approach), since these are quick,
    // frequent clicks, not a full form submission.
    function ctmSaveRowSilently(rowData) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .saveTravauxConfigRow(APP_DATA.token, APP_DATA.projectId, rowData, false);
      });
    }

    function ctmApplyRefresh(freshRows) {
      rawData.travauxConfig = freshRows || [];
      initTravauxConfigCache(rawData.travauxConfig);
      if (WorkspaceCore.getActiveLayerId() === 'travaux') WorkspaceCore.refreshActiveLayer();
      renderBody();
    }

    function ctmHandleActionError(err, context) {
      appErrorLog(err, context, {});
      showModal({ icon: 'error', title: 'Erreur', text: "L'action a échoué : " + (err && err.message) });
      renderBody(); // re-render from the still-current rawData so a failed action doesn't leave stale arrow states on screen
    }

    // Rebuilds a row's sousCategorie composite string, changing only the
    // Nom/Ligne it's asked to change and always preserving whatever Logo
    // (3rd segment) the row already had.
    function ctmBuildSousCategorieCell(existingRaw, nom, ligne) {
      const parts = String(existingRaw || '').split('|');
      const logo = (parts[2] || '').trim();
      let out = nom || '';
      if (ligne !== undefined && ligne !== null && ligne !== '') out += '|' + ligne;
      else if (logo) out += '|0';
      if (logo) out += '|' + logo;
      return out;
    }

    function ctmMoveLigne(idWork, direction) {
      const row = currentRows().filter(function (r) { return String(r.idWork) === String(idWork); })[0];
      if (!row) return;
      const nom = String(row.sousCategorie || '').split('|')[0].trim();
      const siblings = currentRows().filter(function (r) {
        return !String(r.parentId || '').trim() && String(r.sousCategorie || '').split('|')[0].trim() === nom;
      }).map(function (r) { return { raw: r, ligne: (function () { const p = String(r.sousCategorie || '').split('|'); return p.length > 1 ? (parseFloat(p[1]) || 0) : 0; })() }; })
        .sort(function (a, b) { return a.ligne - b.ligne; });
      const idx = siblings.findIndex(function (s) { return String(s.raw.idWork) === String(idWork); });
      const swapIdx = idx + direction;
      if (idx === -1 || swapIdx < 0 || swapIdx >= siblings.length) return;

      const a = siblings[idx], b = siblings[swapIdx];
      const rowA = Object.assign({}, a.raw, { sousCategorie: ctmBuildSousCategorieCell(a.raw.sousCategorie, nom, b.ligne) });
      const rowB = Object.assign({}, b.raw, { sousCategorie: ctmBuildSousCategorieCell(b.raw.sousCategorie, nom, a.ligne) });

      ctmSaveRowSilently(rowA).then(function () { return ctmSaveRowSilently(rowB); }).then(ctmApplyRefresh).catch(function (err) { ctmHandleActionError(err, 'ctmMoveLigne'); });
    }

    function ctmIndent(idWork, targetParentId) {
      const row = currentRows().filter(function (r) { return String(r.idWork) === String(idWork); })[0];
      if (!row || !targetParentId) return;
      const updated = Object.assign({}, row, {
        parentId: targetParentId,
        sousCategorie: ctmBuildSousCategorieCell(row.sousCategorie, '', undefined) // blank Nom/Ligne, keep Logo
      });
      ctmSaveRowSilently(updated).then(ctmApplyRefresh).catch(function (err) { ctmHandleActionError(err, 'ctmIndent'); });
    }

    function ctmOutdent(idWork) {
      const row = currentRows().filter(function (r) { return String(r.idWork) === String(idWork); })[0];
      if (!row) return;
      const parentId = String(row.parentId || '').trim();
      const parentRow = parentId ? currentRows().filter(function (r) { return String(r.idWork) === parentId; })[0] : null;
      const targetNom = parentRow ? String(parentRow.sousCategorie || '').split('|')[0].trim() : '';
      if (!targetNom) {
        // Parent itself has no Sous-catégorie (shouldn't normally happen —
        // a primary always has one) — fall back to the form so the admin
        // picks one explicitly rather than guessing.
        openTravauxConfigRowForm(row, state.view);
        return;
      }
      const usedLignes = currentRows()
        .filter(function (r) { return !String(r.parentId || '').trim() && String(r.sousCategorie || '').split('|')[0].trim() === targetNom; })
        .map(function (r) { const p = String(r.sousCategorie || '').split('|'); return p.length > 1 ? (parseFloat(p[1]) || 0) : 0; });
      const nextLigne = (usedLignes.length ? Math.max.apply(null, usedLignes) : 0) + 1;
      const updated = Object.assign({}, row, {
        parentId: '',
        sousCategorie: ctmBuildSousCategorieCell(row.sousCategorie, targetNom, nextLigne)
      });
      ctmSaveRowSilently(updated).then(ctmApplyRefresh).catch(function (err) { ctmHandleActionError(err, 'ctmOutdent'); });
    }

    function bindRowEvents() {
      document.querySelectorAll('.ctm-edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const idWork = btn.closest('[data-ctm-row]').dataset.ctmRow;
          const row = currentRows().filter(function (r) { return String(r.idWork) === String(idWork); })[0];
          if (row) openTravauxConfigRowForm(row, state.view);
        });
      });
      document.querySelectorAll('.ctm-delete-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const idWork = btn.closest('[data-ctm-row]').dataset.ctmRow;
          const row = currentRows().filter(function (r) { return String(r.idWork) === String(idWork); })[0];
          if (row) confirmAndDeleteTravauxConfigRow(row, state.view);
        });
      });
      document.querySelectorAll('.ctm-moveup-btn:not([disabled])').forEach(function (btn) {
        btn.addEventListener('click', function () { ctmMoveLigne(btn.closest('[data-ctm-row]').dataset.ctmRow, -1); });
      });
      document.querySelectorAll('.ctm-movedown-btn:not([disabled])').forEach(function (btn) {
        btn.addEventListener('click', function () { ctmMoveLigne(btn.closest('[data-ctm-row]').dataset.ctmRow, 1); });
      });
      document.querySelectorAll('.ctm-indent-btn:not([disabled])').forEach(function (btn) {
        btn.addEventListener('click', function () { ctmIndent(btn.closest('[data-ctm-row]').dataset.ctmRow, btn.dataset.indentTarget); });
      });
      document.querySelectorAll('.ctm-outdent-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { ctmOutdent(btn.closest('[data-ctm-row]').dataset.ctmRow); });
      });
    }

    function renderBody() {
      const headerEl = document.getElementById('ctm-header');
      const listEl = document.getElementById('ctm-list');
      if (!headerEl || !listEl) return;
      headerEl.innerHTML = ctmBuildHeaderHtml(state.view);
      listEl.innerHTML = ctmBuildListHtml(currentRows(), state.view);
      bindHeaderEvents();
      bindRowEvents();
    }

    Swal.fire({
      title: '<div class="text-lg font-black text-slate-800 text-left">Gérer les postes de travaux</div>' +
             '<div class="text-[11px] font-medium text-slate-400 text-left mt-0.5">Config Travaux — ajoutez, modifiez ou supprimez les postes proposés dans la checklist Travaux.</div>',
      html: '<div id="ctm-header" class="text-left"></div><div id="ctm-list" class="text-left max-h-[50vh] overflow-y-auto pr-1"></div>',
      width: '640px',
      showConfirmButton: false,
      showCloseButton: true,
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' },
      didOpen: renderBody
    });
  }

  // ---- Add / edit form ---------------------------------------------------

  function openTravauxConfigRowForm(existingRow, defaultViewKey) {
    const isNew = !existingRow;
    const row = existingRow || {
      idWork: '', cible: ctmCibleForView(defaultViewKey), sousCategorie: '', discipline: '',
      typeTravail: '', piecesApplicables: '', typeChamp: 'Texte', options: '', parentId: '', suffix: ''
    };

    const scParts = String(row.sousCategorie || '').split('|');
    const scNom = (scParts[0] || '').trim();
    const scLigne = scParts.length > 1 ? scParts[1].trim() : '';
    const scLogo = scParts.length > 2 ? scParts[2].trim() : '';
    // A brand-new row's default `sousCategorie` is also '' — don't confuse
    // that with an EXISTING row deliberately left blank, which is either
    // pinned OR a secondary (both skip Sous-catégorie/Ligne, spec section
    // 3 — a secondary's placement is entirely inherited from its primary).
    // Only a genuinely-pinned existing row should pre-check "Poste
    // épinglé" itself — a secondary's blank Sous-catégorie is explained by
    // its "Secondaire de" selection instead, so the checkbox stays
    // unchecked for it even though the Sous-catégorie block still starts
    // hidden (isSkipScInitially, used for the block's visibility, not the
    // checkbox). A new row always starts unpinned/unlinked (normal case,
    // Sous-catégorie required).
    const isSkipScInitially = !isNew && !scNom;
    const isPinnedInitially = isSkipScInitially && !row.parentId;
    // What the preview actually shows on open: the real name if it
    // resolves to something (custom or Material Symbols), 'help_outline'
    // (the "?" placeholder) otherwise — same rule the live-typing preview
    // applies on every keystroke, see syncLogoPreview() in didOpen below.
    const scLogoResolved = (scLogo && WorkspaceCore.isResolvableIcon(scLogo)) ? scLogo : 'help_outline';
    // Normalized starting Ligne — lets the checks below tell "still this
    // row's own original (Sous-catégorie, Ligne) pair" apart from an
    // actually new choice (see computeUsedLignes usage further down).
    const originalLigneNum = scLigne === '' ? 0 : (parseFloat(scLigne) || 0);

    const rawTypeChamp = String(row.typeChamp || '').trim();
    const typeChampNorm = /^checkbox$/i.test(rawTypeChamp) ? 'Checkbox'
                         : /menu d.roulant/i.test(rawTypeChamp) ? 'Menu Deroulant'
                         : 'Texte';
    const primaryOptions = String(row.options || '').split(';')[0] || '';

    // Datalist suggestions only — freeform typing always still works. Pulled
    // from data already loaded client-side, no extra server round-trip.
    const knownDisciplines = [];
    travauxConfig.forEach(function (i) { if (i.discipline && knownDisciplines.indexOf(i.discipline) === -1) knownDisciplines.push(i.discipline); });
    const knownRooms = [];
    (rawData.configLogement || []).forEach(function (cfg) {
      Object.keys(cfg).forEach(function (k) { if (k !== 'configLogement' && knownRooms.indexOf(k) === -1) knownRooms.push(k); });
    });
    knownRooms.sort(function (a, b) { return a.localeCompare(b, 'fr'); });

    // Sous-catégorie is now a managed registry (see the "Sous-catégories"
    // admin manager, further below in this file) — no more freeform typing
    // via a <datalist>. Builds the <option> list for whichever Cible is
    // currently selected in the form; refreshed live on Cible change (see
    // syncSousCategorieOptions() in didOpen below), same pattern
    // syncLigneState() already uses for Ligne. If the row being edited has
    // a Nom not (yet) in the registry for its Cible — pre-migration data,
    // or the registry hasn't been seeded yet — it's injected as an extra
    // option so editing never silently corrupts the row.
    function scOptionsForCible(cibleRaw) {
      const viewKey = normalizeView(cibleRaw);
      const rows = scmRowsForView(viewKey).slice().sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
      const names = rows.map(function (r) { return r.nom; });
      if (scNom && names.indexOf(scNom) === -1 && viewKey === normalizeView(row.cible)) {
        names.push(scNom); // not-yet-defined name on the row being edited — keep it selectable
      }
      return names;
    }

    // "Pièces applicables" starting state: the "Toutes..." wildcard, or a
    // list of named rooms drawn from knownRooms (see getApplicableWorkItems
    // / resolveRecapEntries above for how each is used downstream). Both
    // Sous-catégorie and room selection are now required fields (see
    // preConfirm below), so there's no more blank/"Général" starting state
    // for a row saved through this form.
    const initialPieces = splitList(row.piecesApplicables);
    const initialPiecesWildcard = initialPieces.some(function (p) { return p.toLowerCase().startsWith('tout'); });
    const initialPiecesRooms = initialPiecesWildcard ? [] : initialPieces.filter(function (p) { return knownRooms.indexOf(p) !== -1; });

    // Rows that would land in the same recap box as whatever's currently
    // typed (same Sous-catégorie name AND same Cible — groupConfigForRecap()
    // above groups by that exact pair, so that's the scope a collision
    // actually matters in). Returns the Ligne numbers already taken among
    // them; excludes this row itself so its own saved Ligne never collides
    // with itself (req. 3).
    function computeUsedLignes(sousCategorieNomTrimmed, cibleRaw) {
      const cibleKey = normalizeView(cibleRaw);
      return travauxConfig
        .filter(function (item) {
          if (existingRow && String(item.idWork) === String(existingRow.idWork)) return false;
          if (item.cible !== cibleKey) return false;
          return item.sousCategorieNom === sousCategorieNomTrimmed;
        })
        .map(function (item) { return item.sousCategorieLigne; });
    }

    // Eligible parents for "Secondaire de": same Cible, not itself, and
    // never a row that's already a secondary (parentId set) — the one-
    // level-only enforcement lives here, not just as a validation message,
    // so a secondary is never even offered as a choice in the first place.
    function ctmEligibleParents(cibleRaw, excludeRow) {
      const cibleKey = normalizeView(cibleRaw);
      return travauxConfig.filter(function (item) {
        if (item.parentId) return false;
        if (item.cible !== cibleKey) return false;
        if (excludeRow && String(item.idWork) === String(excludeRow.idWork)) return false;
        return true;
      });
    }

    const initialScNames = scOptionsForCible(row.cible);

    const html = `
      <div class="flex flex-col gap-3 mt-1 text-left">
        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">ID Work ${isNew ? '<span class="text-red-500">*</span>' : ''}</label>
          <input id="ctm-idwork" type="text" value="${escapeHtml(row.idWork)}" ${isNew ? '' : 'readonly'} placeholder="Laisser vide pour générer automatiquement"
            class="w-full rounded-lg text-sm px-3 py-2 border ${isNew ? 'border-slate-300 focus:border-primary focus:ring focus:ring-primary/30' : 'border-slate-100 bg-slate-50 text-slate-400 cursor-not-allowed'}" />
          <p class="text-[10px] text-slate-400 mt-1">${isNew
            ? 'Cet identifiant relie ce poste aux réponses enregistrées dans « Données Travaux » — il ne sera plus modifiable une fois créé.'
            : 'Non modifiable : cet identifiant relie ce poste aux réponses déjà enregistrées dans « Données Travaux ».'}</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Cible (vue) *</label>
            <select id="ctm-cible" class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30">
              ${CTM_VIEWS.map(function (v) { return '<option value="' + v.cible + '" ' + (normalizeView(row.cible) === v.key ? 'selected' : '') + '>' + v.cible + '</option>'; }).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Discipline *</label>
            <input id="ctm-discipline" type="text" list="ctm-discipline-list" value="${escapeHtml(row.discipline)}" placeholder="ex: Peinture"
              class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
            <datalist id="ctm-discipline-list">${knownDisciplines.map(function (d) { return '<option value="' + escapeHtml(d) + '">'; }).join('')}</datalist>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Type de Travail (libellé affiché) *</label>
          <input id="ctm-typetravail" type="text" value="${escapeHtml(row.typeTravail)}" placeholder="ex: Peinture des murs"
            class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
        </div>

        <label class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 cursor-pointer">
          <input id="ctm-pinned" type="checkbox" ${isPinnedInitially ? 'checked' : ''} class="rounded border-slate-300 text-primary focus:ring-primary/30" />
          <span class="text-xs font-bold text-slate-600">Poste épinglé (en haut de la checklist, hors encadré sous-catégorie)</span>
        </label>
        <p class="text-[10px] text-slate-400 -mt-2">Un poste épinglé (Sous-catégorie vide) apparaît en tête de la checklist et de la fiche récap au lieu d'être rangé dans un encadré — ex. « Aide au déplacement des mobiliers ».</p>

        <div id="ctm-souscategorie-wrap" class="grid grid-cols-3 gap-3 ${isSkipScInitially ? 'hidden' : ''}">
          <div class="col-span-2">
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Sous-catégorie *</label>
            <select id="ctm-souscategorie-nom" class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30">
              <option value="" disabled ${scNom ? '' : 'selected'}>Sélectionnez…</option>
              ${initialScNames.map(function (n) { return '<option value="' + escapeHtml(n) + '" ' + (n === scNom ? 'selected' : '') + '>' + escapeHtml(n) + '</option>'; }).join('')}
            </select>
            <p id="ctm-souscategorie-empty-hint" class="text-[10px] text-rose-500 mt-1 ${initialScNames.length ? 'hidden' : ''}">Aucune sous-catégorie définie pour cette vue — utilisez le bouton « Sous-catégories » à côté de « Config Travaux » pour en créer une d'abord.</p>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Ligne *</label>
            <input id="ctm-souscategorie-ligne" type="number" step="1" min="1" value="${escapeHtml(scLigne)}" placeholder="1" ${scNom ? '' : 'disabled'}
              class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30 disabled:bg-slate-50 disabled:text-slate-300 disabled:cursor-not-allowed" />
          </div>
        </div>
        <p id="ctm-ligne-hint" class="text-[10px] text-slate-400 -mt-2 ${isSkipScInitially ? 'hidden' : ''}">Renseignez d'abord une Sous-catégorie pour pouvoir choisir une Ligne.</p>
        <p id="ctm-souscategorie-help" class="text-[10px] text-slate-400 -mt-2 ${isSkipScInitially ? 'hidden' : ''}">« Sous-catégorie » regroupe ce poste avec les autres du même encadré dans la fiche récap (imprimable) — la liste vient du gestionnaire « Sous-catégories » (nom, couleur, position). « Ligne » choisit la position de CE poste à l'intérieur de son encadré — un nombre entier positif (1, 2, 3…), obligatoire, et deux postes d'une même Sous-catégorie ne peuvent pas partager la même Ligne.</p>

        <div class="flex items-end gap-3">
          <div class="flex-1 relative">
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Icône (recap)</label>
            <div class="flex gap-1.5">
              <input id="ctm-souscategorie-logo" type="text" value="${escapeHtml(scLogo)}" placeholder="ex: wc, bathtub, plumbing"
                class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
              <button type="button" id="ctm-logo-custom-picker-btn" title="Icônes personnalisées" disabled
                class="shrink-0 w-9 h-9 rounded-lg border border-slate-300 text-slate-400 flex items-center justify-center hover:border-primary hover:text-primary transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:border-slate-300 disabled:hover:text-slate-400">
                <span class="material-symbols-outlined !text-[18px]">add</span>
              </button>
            </div>
            <div id="ctm-logo-custom-picker" class="hidden absolute z-10 top-full left-0 mt-1 w-64 max-h-56 overflow-y-auto rounded-lg border border-slate-200 bg-white shadow-xl py-1"></div>
          </div>
          <div id="ctm-logo-preview" class="w-10 h-10 shrink-0 rounded-lg bg-primary-light text-primary flex items-center justify-center">
            <span id="ctm-logo-preview-icon" class="!text-[20px] ${WorkspaceCore.iconFontClass(scLogoResolved)}">${escapeHtml(WorkspaceCore.iconGlyphText(scLogoResolved))}</span>
          </div>
        </div>

        <p class="text-[10px] text-slate-400 -mt-2">Optionnel — nom d'icône : d'abord recherché parmi vos <b>icônes personnalisées</b> (bouton <span class="font-bold">+</span>, dossier Drive « 04- Icons »), sinon dans <a href='https://fonts.google.com/icons?icon.set=Material+Symbols' target='_blank' rel='noopener' class='text-primary underline'>Material Symbols</a> (ex: wc, bathtub, plumbing, format_paint). Vide = pas d'icône pour ce poste dans la fiche récap. Deux postes consécutifs avec la même icône partagent un seul pictogramme dans la fiche.</p>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Pièces applicables *</label>
          <label class="flex items-center gap-2 mb-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 cursor-pointer">
            <input id="ctm-pieces-toutes" type="checkbox" ${initialPiecesWildcard ? 'checked' : ''} class="rounded border-slate-300 text-primary focus:ring-primary/30" />
            <span class="text-xs font-bold text-slate-600">Toutes les pièces (une ligne par pièce existante du logement)</span>
          </label>
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-2 mb-1">Liste des pièces</p>
          <div id="ctm-pieces-rooms" class="w-full grid grid-cols-2 gap-x-3 gap-y-1 max-h-32 overflow-y-auto border border-slate-200 rounded-lg p-2">
            ${knownRooms.length ? knownRooms.map(function (r) {
              return '<label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">' +
                '<input type="checkbox" class="ctm-piece-checkbox rounded border-slate-300 text-primary focus:ring-primary/30" value="' + escapeHtml(r) + '" ' + (initialPiecesRooms.indexOf(r) !== -1 ? 'checked' : '') + ' /> ' +
                escapeHtml(r) +
              '</label>';
            }).join('') : '<p class="text-[11px] text-slate-400 italic col-span-2">Aucune pièce connue (Config Logement vide).</p>'}
          </div>
          <p class="text-[10px] text-slate-400 mt-1">Plusieurs pièces peuvent être cochées à la fois. Cochez au moins une pièce, ou « Toutes les pièces ».</p>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Type de champ *</label>
          <select id="ctm-typechamp" class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30">
            <option value="Checkbox" ${typeChampNorm === 'Checkbox' ? 'selected' : ''}>Case à cocher</option>
            <option value="Menu Deroulant" ${typeChampNorm === 'Menu Deroulant' ? 'selected' : ''}>Menu déroulant</option>
            <option value="Texte" ${typeChampNorm === 'Texte' ? 'selected' : ''}>Texte libre</option>
          </select>
        </div>

        <div id="ctm-options-wrap" class="hidden">
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Options du menu (séparées par des virgules)</label>
          <input id="ctm-options" type="text" value="${escapeHtml(primaryOptions)}" placeholder="ex: Bon, Moyen, Mauvais"
            class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Secondaire de (optionnel)</label>
            <select id="ctm-parentid" class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30">
              <option value="">— Poste principal (aucun parent) —</option>
              ${ctmEligibleParents(row.cible, existingRow).map(function (p) {
                return '<option value="' + escapeHtml(p.idWork) + '" ' + (p.idWork === (row.parentId || '') ? 'selected' : '') + '>' + escapeHtml(p.typeTravail) + '</option>';
              }).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Suffixe / Unité (optionnel)</label>
            <input id="ctm-suffix" type="text" value="${escapeHtml(row.suffix || '')}" placeholder="ex: cm"
              class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
          </div>
        </div>
        <p class="text-[10px] text-slate-400 -mt-2">Un poste « secondaire » s'affiche en plus petit, juste après le titre de son poste principal, dans la checklist et la fiche récap — un seul niveau (un secondaire ne peut pas lui-même avoir de secondaires, la liste ci-dessus n'en propose donc jamais). Le suffixe s'affiche juste après la valeur (ex. « Largeur : 40 cm »).</p>
      </div>
    `;

    let logoPickerOutsideClickHandler = null; // wired in didOpen, torn down in willClose — see the "+" picker below

    Swal.fire({
      title: isNew ? 'Ajouter un poste de travaux' : ('Modifier « ' + escapeHtml(row.typeTravail || row.idWork) + ' »'),
      html: html,
      width: '560px',
      showCancelButton: true,
      confirmButtonText: isNew ? 'Ajouter' : 'Enregistrer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#0d59f2',
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' },
      willClose: () => {
        if (logoPickerOutsideClickHandler) {
          document.removeEventListener('click', logoPickerOutsideClickHandler);
          logoPickerOutsideClickHandler = null;
        }
      },
      didOpen: () => {
        const typeChampSelect = document.getElementById('ctm-typechamp');
        const optionsWrap = document.getElementById('ctm-options-wrap');
        function syncOptionsVisibility() {
          optionsWrap.classList.toggle('hidden', typeChampSelect.value !== 'Menu Deroulant');
        }
        typeChampSelect.addEventListener('change', syncOptionsVisibility);
        syncOptionsVisibility();

        const logoInput = document.getElementById('ctm-souscategorie-logo');
        const logoPreviewIcon = document.getElementById('ctm-logo-preview-icon');
        function syncLogoPreview() {
          const val = logoInput.value.trim();
          // Only show a real glyph once we've actually found one (custom
          // OR Material Symbols) — otherwise keep the "?" placeholder
          // instead of drawing whatever raw text was typed. See
          // isResolvableIcon() in Workspace_Core_Scripts.html.
          const display = (val && WorkspaceCore.isResolvableIcon(val)) ? val : 'help_outline';
          logoPreviewIcon.classList.remove('material-symbols-outlined', 'custom-icon-font');
          logoPreviewIcon.classList.add(WorkspaceCore.iconFontClass(display));
          logoPreviewIcon.textContent = WorkspaceCore.iconGlyphText(display);
        }
        logoInput.addEventListener('input', syncLogoPreview);

        // "+" picker for custom icon names — the Material side already has
        // Google's own site to browse; this is the equivalent for icons
        // nobody but you can see the names of otherwise. Populated in the
        // background as soon as the modal opens (below), not on click, so
        // the list is normally already there by the time anyone clicks —
        // the button stays disabled until it genuinely is, so an
        // impatient click just can't do anything prematurely.
        const logoPickerBtn = document.getElementById('ctm-logo-custom-picker-btn');
        const logoPickerPanel = document.getElementById('ctm-logo-custom-picker');

        function renderLogoPickerOptions() {
          const entries = WorkspaceCore.getCustomIconEntries();
          if (!entries.length) {
            logoPickerPanel.innerHTML = '<p class="px-3 py-2 text-xs text-slate-400">Aucune icône personnalisée trouvée dans « 04- Icons ».</p>';
            return;
          }
          logoPickerPanel.innerHTML = entries.map(function (entry) {
            return '<button type="button" class="w-full flex items-center gap-2 px-3 py-1.5 text-sm text-left hover:bg-slate-50" data-icon-name="' + escapeHtml(entry.name) + '">' +
              '<span class="custom-icon-font !text-[16px] text-primary shrink-0">' + escapeHtml(String.fromCodePoint(entry.codepoint)) + '</span>' +
              '<span class="truncate">' + escapeHtml(entry.name) + '</span>' +
            '</button>';
          }).join('');
        }

        function onCustomIconManifestSettled() {
          logoPickerBtn.disabled = false;
          renderLogoPickerOptions();
          syncLogoPreview(); // in case the field already held a custom name before the manifest arrived
        }

        if (WorkspaceCore.isCustomIconManifestReady()) onCustomIconManifestSettled();
        WorkspaceCore.refreshCustomIconManifest(onCustomIconManifestSettled); // always refresh in the background too, so icons added since page load still show up

        logoPickerBtn.addEventListener('click', function () {
          logoPickerPanel.classList.toggle('hidden');
        });
        logoPickerPanel.addEventListener('click', function (e) {
          const optBtn = e.target.closest('[data-icon-name]');
          if (!optBtn) return;
          logoInput.value = optBtn.getAttribute('data-icon-name');
          logoPickerPanel.classList.add('hidden');
          syncLogoPreview();
          logoInput.focus();
        });
        logoPickerOutsideClickHandler = function (e) {
          if (logoPickerPanel.classList.contains('hidden')) return;
          if (logoPickerPanel.contains(e.target) || logoPickerBtn.contains(e.target)) return;
          logoPickerPanel.classList.add('hidden');
        };
        document.addEventListener('click', logoPickerOutsideClickHandler);

        // "Toutes les pièces" disables the per-room checkboxes underneath —
        // they're mutually exclusive ways of filling the same underlying
        // field (see preConfirm below).
        const piecesToutesInput = document.getElementById('ctm-pieces-toutes');
        const piecesRoomsGrid = document.getElementById('ctm-pieces-rooms');
        function syncPiecesToutes() {
          const on = piecesToutesInput.checked;
          piecesRoomsGrid.classList.toggle('opacity-40', on);
          piecesRoomsGrid.classList.toggle('pointer-events-none', on);
          document.querySelectorAll('.ctm-piece-checkbox').forEach(function (cb) { cb.disabled = on; });
        }
        piecesToutesInput.addEventListener('change', syncPiecesToutes);
        syncPiecesToutes();

        // Ligne needs to know its Sous-catégorie first, so we know which
        // existing Lignes it would collide with — locked until Sous-
        // catégorie has a value, and re-locked (with its own value cleared)
        // if that's emptied back out. See computeUsedLignes() above and the
        // matching preConfirm checks below.
        const scNomInput = document.getElementById('ctm-souscategorie-nom');
        const cibleSelect = document.getElementById('ctm-cible');
        const ligneInput = document.getElementById('ctm-souscategorie-ligne');
        const scEmptyHint = document.getElementById('ctm-souscategorie-empty-hint');

        // Refreshes the Sous-catégorie <select>'s options for whichever
        // Cible is currently chosen — same "depends on Cible" relationship
        // computeUsedLignes()/syncLigneState() already have, just one step
        // earlier (which NAMES are even choosable, before which Lignes are
        // already taken for the chosen name). Keeps the current selection
        // if it's still valid for the new Cible; otherwise falls back to
        // the placeholder.
        function syncSousCategorieOptions() {
          const currentVal = scNomInput.value;
          const names = scOptionsForCible(cibleSelect.value);
          const keepCurrent = names.indexOf(currentVal) !== -1;
          scNomInput.innerHTML = '<option value="" disabled ' + (keepCurrent ? '' : 'selected') + '>Sélectionnez…</option>' +
            names.map(function (n) { return '<option value="' + escapeHtml(n) + '" ' + (n === currentVal ? 'selected' : '') + '>' + escapeHtml(n) + '</option>'; }).join('');
          scEmptyHint.classList.toggle('hidden', names.length > 0);
        }
        const ligneHint = document.getElementById('ctm-ligne-hint');

        function markLigneHint(text, isWarning) {
          ligneHint.textContent = text;
          ligneHint.classList.toggle('text-rose-500', isWarning);
          ligneHint.classList.toggle('text-slate-400', !isWarning);
        }

        function syncLigneState() {
          const nomTrimmed = scNomInput.value.trim();
          if (!nomTrimmed) {
            ligneInput.value = '';
            ligneInput.setAttribute('disabled', 'disabled');
            markLigneHint("Renseignez d'abord une Sous-catégorie pour pouvoir choisir une Ligne.", false);
            return;
          }
          ligneInput.removeAttribute('disabled');
          const rawVal = ligneInput.value.trim();
          const currentVal = rawVal === '' ? NaN : parseFloat(rawVal);
          if (rawVal === '' || isNaN(currentVal) || currentVal <= 0) {
            markLigneHint('La Ligne est obligatoire : un nombre entier positif (1, 2, 3…).', true);
            return;
          }
          const used = computeUsedLignes(nomTrimmed, cibleSelect.value);
          const pairUnchanged = !isNew && nomTrimmed === scNom && currentVal === originalLigneNum;
          const isDuplicate = !pairUnchanged && used.indexOf(currentVal) !== -1;
          if (isDuplicate) {
            markLigneHint('La ligne ' + currentVal + ' est déjà utilisée dans « ' + nomTrimmed + ' ». Choisissez-en une autre.', true);
          } else {
            markLigneHint(used.length
              ? ('Lignes déjà utilisées dans « ' + nomTrimmed + ' » : ' + used.slice().sort(function (a, b) { return a - b; }).join(', '))
              : ('Aucune ligne utilisée pour l\'instant dans « ' + nomTrimmed + ' ».'), false);
          }
        }
        scNomInput.addEventListener('change', syncLigneState);

        // Pinned poste toggle AND "Secondaire de" selection (2026-08-26,
        // spec section 3) both hide the whole Sous-catégorie/Ligne block
        // rather than just disabling it — a pinned poste has no encadré/
        // position concept at all, and a secondary's position is entirely
        // inherited from its primary (rendered inline under it in both the
        // checklist and the recap).
        const pinnedInput = document.getElementById('ctm-pinned');
        const scWrap = document.getElementById('ctm-souscategorie-wrap');
        function syncPinnedState() {
          const skip = pinnedInput.checked || !!document.getElementById('ctm-parentid').value;
          scWrap.classList.toggle('hidden', skip);
          ligneHint.classList.toggle('hidden', skip);
          scEmptyHint.classList.toggle('hidden', skip || scOptionsForCible(cibleSelect.value).length > 0);
          const helpEl = document.getElementById('ctm-souscategorie-help');
          if (helpEl) helpEl.classList.toggle('hidden', skip);
        }
        pinnedInput.addEventListener('change', syncPinnedState);

        // "Secondaire de" list depends on Cible the same way Sous-catégorie
        // does — refresh it in step.
        const parentSelect = document.getElementById('ctm-parentid');
        function syncParentOptions() {
          const currentVal = parentSelect.value;
          const eligible = ctmEligibleParents(cibleSelect.value, existingRow);
          const keepCurrent = eligible.some(function (p) { return p.idWork === currentVal; });
          parentSelect.innerHTML = '<option value="">— Poste principal (aucun parent) —</option>' +
            eligible.map(function (p) { return '<option value="' + escapeHtml(p.idWork) + '" ' + (p.idWork === currentVal ? 'selected' : '') + '>' + escapeHtml(p.typeTravail) + '</option>'; }).join('');
          if (!keepCurrent) parentSelect.value = '';
        }

        parentSelect.addEventListener('change', syncPinnedState);
        cibleSelect.addEventListener('change', function () { syncSousCategorieOptions(); syncLigneState(); syncParentOptions(); syncPinnedState(); });
        ligneInput.addEventListener('input', syncLigneState);
        syncLigneState();
        syncPinnedState();
      },
      preConfirm: () => {
        const idWorkInput = document.getElementById('ctm-idwork').value.trim();
        const typeTravail = document.getElementById('ctm-typetravail').value.trim();
        const discipline = document.getElementById('ctm-discipline').value.trim();
        const cible = document.getElementById('ctm-cible').value;
        const typeChamp = document.getElementById('ctm-typechamp').value;
        const pinned = document.getElementById('ctm-pinned').checked;
        const parentIdVal = document.getElementById('ctm-parentid').value.trim();
        // Pinned OR a secondary (parentId set) = no Sous-catégorie/Ligne at
        // all (spec section 3) — a secondary's position in the recap is
        // entirely inherited from its primary (rendered inline under it,
        // see buildRecapBoxHtml/resolveRecapEntries), so it doesn't need
        // its own placement any more than a pinned item does. Read as
        // blank regardless of whatever's left in those now-hidden fields,
        // rather than trusting their stale DOM value.
        const skipSousCategorie = pinned || !!parentIdVal;
        const scNomVal = skipSousCategorie ? '' : document.getElementById('ctm-souscategorie-nom').value.trim();
        const scLigneVal = skipSousCategorie ? '' : document.getElementById('ctm-souscategorie-ligne').value.trim();
        const scLogoVal = document.getElementById('ctm-souscategorie-logo').value.trim();
        const piecesToutes = document.getElementById('ctm-pieces-toutes').checked;
        const piecesRoomsChecked = Array.from(document.querySelectorAll('.ctm-piece-checkbox:checked')).map(function (el) { return el.value; });
        const pieces = piecesToutes ? 'Toutes' : piecesRoomsChecked.join(', ');
        const primaryOptionsVal = document.getElementById('ctm-options').value.trim();
        const suffixVal = document.getElementById('ctm-suffix').value.trim();

        if (!typeTravail) {
