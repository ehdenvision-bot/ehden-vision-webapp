          Swal.showValidationMessage("Le « Type de Travail » (libellé affiché) est obligatoire.");
          return false;
        }
        if (!discipline) {
          Swal.showValidationMessage("La « Discipline » est obligatoire.");
          return false;
        }
        let ligneNum = NaN;
        if (!skipSousCategorie) {
          if (!scNomVal) {
            Swal.showValidationMessage("La « Sous-catégorie » est obligatoire (ou cochez « Poste épinglé », ou choisissez « Secondaire de »).");
            return false;
          }
          ligneNum = scLigneVal === '' ? NaN : parseFloat(scLigneVal);
          if (scLigneVal === '' || isNaN(ligneNum) || ligneNum <= 0) {
            Swal.showValidationMessage("La « Ligne » est obligatoire : un nombre positif supérieur à 0.");
            return false;
          }
          const pairUnchanged = !isNew && scNomVal === scNom && ligneNum === originalLigneNum;
          if (!pairUnchanged && computeUsedLignes(scNomVal, cible).indexOf(ligneNum) !== -1) {
            Swal.showValidationMessage('La ligne ' + ligneNum + ' est déjà utilisée dans la sous-catégorie « ' + scNomVal + ' ». Choisissez une autre valeur.');
            return false;
          }
        }
        if (!piecesToutes && piecesRoomsChecked.length === 0) {
          Swal.showValidationMessage("Sélectionnez au moins une pièce dans « Pièces applicables », ou cochez « Toutes les pièces ».");
          return false;
        }
        if (typeChamp === 'Menu Deroulant' && !primaryOptionsVal) {
          Swal.showValidationMessage("Ajoutez au moins une option pour un menu déroulant.");
          return false;
        }

        const existingIdsLower = (rawData.travauxConfig || []).map(function (r) { return String(r.idWork).trim().toLowerCase(); });
        let idWork = idWorkInput;
        if (isNew) {
          if (!idWork) {
            let base = (discipline + '_' + typeTravail)
              .toLowerCase()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // strip accents
              .replace(/[^a-z0-9]+/g, '_')
              .replace(/^_+|_+$/g, '')
              .substring(0, 60);
            if (!base) base = 'poste';
            idWork = base;
            let suffix = 2;
            while (existingIdsLower.indexOf(idWork.toLowerCase()) !== -1) {
              idWork = base + '_' + suffix;
              suffix++;
            }
          } else if (existingIdsLower.indexOf(idWork.toLowerCase()) !== -1) {
            Swal.showValidationMessage("Cet ID Work existe déjà (\"" + idWork + "\"). Choisissez-en un autre.");
            return false;
          }
        }

        // Options is a single flat value now — no more preserving "Détails
        // de champ" extra-field option blocks (that mechanism is gone
        // entirely as of 2026-08-26, replaced by parentId below); any
        // leftover blocks a pre-migration row still had in its Options
        // cell are intentionally dropped the next time it's saved here.
        const optionsOut = primaryOptionsVal;

        // Ligne is always present when not pinned (validated above), so
        // this always appends the '|Ligne' segment in that case; the logo,
        // if any, follows it. Pinned rows get a blank Nom (isPinnedWorkItem
        // reads !sousCategorieNom), but can still carry a Logo.
        let sousCategorieOut = scNomVal;
        if (scLigneVal || scLogoVal) sousCategorieOut += '|' + (scLigneVal || '0');
        if (scLogoVal) sousCategorieOut += '|' + scLogoVal;

        return {
          idWork: idWork,
          cible: cible,
          sousCategorie: sousCategorieOut,
          discipline: discipline,
          typeTravail: typeTravail,
          piecesApplicables: pieces,
          typeChamp: typeChamp,
          options: optionsOut,
          parentId: parentIdVal,
          suffix: suffixVal
        };
      }
    }).then(function (result) {
      if (!result.isConfirmed) {
        // "Annuler" (or ESC / backdrop dismiss) -> back to the manager list
        // (same view the user was on before this form opened), instead of
        // leaving nothing open.
        openTravauxConfigManager(defaultViewKey);
        return;
      }
      submitTravauxConfigRow(result.value, isNew);
    });
  }

  // ---- Save / delete -> server ------------------------------------------

  function submitTravauxConfigRow(rowData, isNew) {
    showLoading(isNew ? 'Ajout en cours...' : 'Enregistrement en cours...', rowData.typeTravail);

    google.script.run
      .withSuccessHandler(function (freshRows) {
        rawData.travauxConfig = freshRows || [];
        initTravauxConfigCache(rawData.travauxConfig);
        if (WorkspaceCore.getActiveLayerId() === 'travaux') WorkspaceCore.refreshActiveLayer();

        if (typeof Swal !== 'undefined') Swal.close();
        showToast(isNew ? 'Poste de travaux ajouté.' : 'Poste de travaux mis à jour.', 'success');
        appLog(normalizeView(rowData.cible), rowData.idWork, isNew ? 'Ajout Config Travaux' : 'Modification Config Travaux', 'Private', 'Detail', rowData, APP_USER_EMAIL);

        openTravauxConfigManager(normalizeView(rowData.cible));
      })
      .withFailureHandler(function (err) {
        appErrorLog(err, "saveTravauxConfigRow", { rowData: rowData });
        showModal({ icon: 'error', title: 'Erreur', text: "L'enregistrement a échoué : " + err.message });
      })
      .saveTravauxConfigRow(APP_DATA.token, APP_DATA.projectId, rowData, isNew);
  }

  function confirmAndDeleteTravauxConfigRow(row, viewKeyToReturnTo) {
    Swal.fire({
      title: 'Supprimer ce poste ?',
      html: '<p class="text-xs text-slate-600 text-left">« <b>' + escapeHtml(row.typeTravail || row.idWork) + '</b> » sera retiré de la checklist Travaux pour toutes les nouvelles saisies.</p>' +
            '<p class="text-xs text-slate-500 mt-2 text-left">Les réponses déjà enregistrées pour ce poste ne sont pas effacées, mais ne seront plus visibles ni modifiables une fois ce poste supprimé.</p>',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Supprimer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#e11d48',
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' }
    }).then(function (result) {
      if (!result.isConfirmed) return;

      showLoading('Suppression en cours...', row.typeTravail);
      google.script.run
        .withSuccessHandler(function (freshRows) {
          rawData.travauxConfig = freshRows || [];
          initTravauxConfigCache(rawData.travauxConfig);
          if (WorkspaceCore.getActiveLayerId() === 'travaux') WorkspaceCore.refreshActiveLayer();

          if (typeof Swal !== 'undefined') Swal.close();
          showToast('Poste de travaux supprimé.', 'success');
          appLog(normalizeView(row.cible), row.idWork, 'Suppression Config Travaux', 'Private', 'Detail', { idWork: row.idWork, typeTravail: row.typeTravail }, APP_USER_EMAIL);

          openTravauxConfigManager(viewKeyToReturnTo);
        })
        .withFailureHandler(function (err) {
          appErrorLog(err, "deleteTravauxConfigRow", { idWork: row.idWork });
          showModal({ icon: 'error', title: 'Erreur', text: "La suppression a échoué : " + err.message });
        })
        .deleteTravauxConfigRow(APP_DATA.token, APP_DATA.projectId, row.idWork);
    });
  }

  // Entry point called by setupAdminConfigTravauxButton() in
  // Workspace_Core_Scripts.html (the button lives in the shared shell, this
  // module owns what it opens).
  window.openTravauxConfigManager = openTravauxConfigManager;

  // ---------------------------------------------------------------------
  // ADMIN — "Sous-catégories" MANAGER  (name / color / 3-column position)
  // ---------------------------------------------------------------------
  // Opened via the "Sous-catégories" button beside "Config Travaux" (admin
  // only — visibility + click wiring live in Workspace_Core_Scripts.html's
  // setupAdminSousCategoriesButton(); this file only needs to expose
  // window.openSousCategoriesManager for that button to call).
  //
  // Operates on rawData.sousCategoriesTravaux — {rowIdx, cible, nom,
  // couleur, colonne, position} rows from the new "Sous Categories Travaux"
  // sheet (EDL_Code.js). Every successful save/delete/reorder gets the
  // fresh full row list back from the server, which replaces
  // rawData.sousCategoriesTravaux — same "keep the local cache in sync"
  // pattern submitTravauxConfigRow above already uses — and the live recap
  // (groupConfigForRecap/renderPlanPanelLocataires below) re-renders
  // immediately if Travaux is the active layer.
  //
  // Reuses CTM_VIEWS/ctmCibleForView (Config Travaux manager, above) for
  // the same Locataires/Commun/Facades tab pattern, and normalizeView() /
  // escapeHtml() shared elsewhere in this file.

  function scmRowsForView(viewKey) {
    return (rawData.sousCategoriesTravaux || []).filter(function (r) { return normalizeView(r.cible) === viewKey; });
  }

  // Rows already using this Sous-catégorie in Config Travaux (this view) —
  // mirrors the server's own usage check in deleteSousCategorieTravaux;
  // used here only to warn before attempting a delete. The server re-checks
  // and is the real enforcement (never trust a client-side count alone).
  function scmUsageCount(nom, viewKey) {
    return travauxConfig.filter(function (item) { return item.cible === viewKey && item.sousCategorieNom === nom; }).length;
  }

  function scmColumnHtml(colIdx, rows) {
    const colRows = rows.filter(function (r) { return r.colonne === colIdx; }).sort(function (a, b) { return a.position - b.position; });
    const cardsHtml = colRows.map(function (r) {
      return (
        '<div class="scm-card flex items-center gap-2 px-3 py-2 bg-white border border-slate-200 rounded-xl shadow-sm cursor-move" draggable="true" data-row-idx="' + r.rowIdx + '">' +
          '<span class="w-3.5 h-3.5 rounded-full shrink-0" style="background-color:' + escapeHtml(r.couleur) + ';"></span>' +
          '<span class="flex-1 min-w-0 text-xs font-bold text-slate-700 truncate">' + escapeHtml(r.nom) + '</span>' +
          '<button type="button" class="scm-edit-btn w-6 h-6 shrink-0 flex items-center justify-center rounded-lg text-slate-400 hover:text-primary hover:bg-primary-light transition-colors" title="Modifier">' +
            '<span class="material-symbols-outlined !text-[14px]">edit</span>' +
          '</button>' +
          '<button type="button" class="scm-delete-btn w-6 h-6 shrink-0 flex items-center justify-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors" title="Supprimer">' +
            '<span class="material-symbols-outlined !text-[14px]">delete</span>' +
          '</button>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="scm-column flex flex-col gap-2 min-h-[120px] p-2 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50/50" data-colonne="' + colIdx + '">' +
        '<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest text-center mb-1">Colonne ' + colIdx + '</p>' +
        cardsHtml +
      '</div>'
    );
  }

  function scmBuildBodyHtml(viewKey) {
    const rows = scmRowsForView(viewKey);

    // "Importer les sous-catégories existantes" removed entirely 2026-08-26
    // (agents/edl-page-spec.md section 3, "New: remove sous-catégorie
    // import") — was the hasUnseeded/seedHtml branch + scmSeed* wiring
    // below + seedSousCategoriesFromExistingConfig on the server.
    const gridHtml = rows.length === 0
      ? '<p class="text-xs text-slate-400 italic text-center py-8">Aucune sous-catégorie définie pour cette vue. Cliquez sur « Ajouter » pour en créer une.</p>'
      : '<div class="grid grid-cols-3 gap-3">' + [1, 2, 3].map(function (c) { return scmColumnHtml(c, rows); }).join('') + '</div>';

    return gridHtml;
  }

  function scmBuildHeaderHtml(activeViewKey) {
    return (
      '<div class="flex items-center justify-between gap-3 mb-4">' +
        '<div class="flex bg-slate-200/50 p-1 rounded-xl w-fit shadow-inner border border-slate-300/50">' +
          CTM_VIEWS.map(function (v) {
            const isActive = (v.key === activeViewKey);
            return '<button type="button" class="scm-view-tab px-5 py-1.5 rounded-lg text-[11px] font-black transition-all ' +
                   (isActive ? 'bg-white shadow-sm text-primary' : 'text-slate-600 hover:text-primary') +
                   '" data-view="' + v.key + '">' + v.label + '</button>';
          }).join('') +
        '</div>' +
        '<button type="button" id="scm-add-btn" class="flex items-center gap-1 px-3 py-1.5 bg-primary text-white rounded-xl text-[11px] font-black uppercase hover:bg-primary-dark transition-colors shadow-sm shrink-0">' +
          '<span class="material-symbols-outlined !text-[16px]">add</span> Ajouter' +
        '</button>' +
      '</div>'
    );
  }

  function openSousCategoriesManager(initialView) {
    const validKeys = CTM_VIEWS.map(function (v) { return v.key; });
    const state = {
      view: (initialView && validKeys.indexOf(initialView) !== -1) ? initialView
          : (validKeys.indexOf(window.currentView) !== -1 ? window.currentView : 'locataires')
    };

    let dragSourceRowIdx = null;

    // Reads the grid's CURRENT on-screen order (after a drag) and commits
    // it as the new (Colonne, Position) layout for every card, renumbering
    // each column contiguously 1..N — this is what guarantees "no duplicate
    // positions" by construction (same "gaps fine, just re-derive order"
    // philosophy the codebase already applies to sousCategorieLigne).
    function commitLayout() {
      const cible = ctmCibleForView(state.view);
      const layout = [];
      document.querySelectorAll('#scm-body .scm-column').forEach(function (colEl) {
        const colonne = parseInt(colEl.dataset.colonne, 10);
        Array.from(colEl.querySelectorAll('.scm-card')).forEach(function (cardEl, idx) {
          layout.push({ rowIdx: parseInt(cardEl.dataset.rowIdx, 10), colonne: colonne, position: idx + 1 });
        });
      });
      if (layout.length === 0) return;

      google.script.run
        .withSuccessHandler(function (result) {
          if (!result || result.success === false) {
            showModal({ icon: 'error', title: 'Erreur', text: (result && result.message) || "Le nouvel agencement n'a pas pu être enregistré." });
            renderBody(); // revert the DOM to server truth
            return;
          }
          rawData.sousCategoriesTravaux = result.rows || [];
          if (WorkspaceCore.getActiveLayerId() === 'travaux') WorkspaceCore.refreshActiveLayer();
          renderBody();
        })
        .withFailureHandler(function (err) {
          appErrorLog(err, "reorderSousCategoriesTravaux", { cible: cible, layout: layout });
          showModal({ icon: 'error', title: 'Erreur', text: "L'agencement n'a pas pu être enregistré : " + err.message });
          renderBody();
        })
        .reorderSousCategoriesTravaux(APP_DATA.token, APP_DATA.projectId, cible, layout);
    }

    // Plain HTML5 drag-and-drop — no library, matching the rest of the app.
    // Rebinding on every renderBody() call is deliberate: every card is
    // rebuilt from scratch each time (see bindBodyEvents), so there's
    // nothing stale to leak.
    function bindDragEvents() {
      document.querySelectorAll('#scm-body .scm-card').forEach(function (card) {
        card.addEventListener('dragstart', function () {
          dragSourceRowIdx = card.dataset.rowIdx;
          card.classList.add('opacity-40');
        });
        card.addEventListener('dragend', function () {
          card.classList.remove('opacity-40');
        });
      });
      document.querySelectorAll('#scm-body .scm-column').forEach(function (col) {
        col.addEventListener('dragover', function (e) {
          e.preventDefault(); // required for drop to fire at all
          const dragged = document.querySelector('.scm-card[data-row-idx="' + dragSourceRowIdx + '"]');
          if (!dragged) return;
          const after = Array.from(col.querySelectorAll('.scm-card')).filter(function (c) { return c !== dragged; }).find(function (c) {
            return e.clientY <= c.getBoundingClientRect().top + c.getBoundingClientRect().height / 2;
          });
          if (after) col.insertBefore(dragged, after);
          else col.appendChild(dragged);
        });
        col.addEventListener('drop', function (e) {
          e.preventDefault();
          commitLayout();
        });
      });
    }

    function bindHeaderEvents() {
      document.querySelectorAll('.scm-view-tab').forEach(function (btn) {
        btn.addEventListener('click', function () { state.view = btn.dataset.view; renderBody(); });
      });
      const addBtn = document.getElementById('scm-add-btn');
      if (addBtn) addBtn.addEventListener('click', function () { openSousCategorieForm(null, state.view); });
    }

    function bindBodyEvents() {
      document.querySelectorAll('.scm-edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const rowIdx = parseInt(btn.closest('[data-row-idx]').dataset.rowIdx, 10);
          const row = (rawData.sousCategoriesTravaux || []).filter(function (r) { return r.rowIdx === rowIdx; })[0];
          if (row) openSousCategorieForm(row, state.view);
        });
      });
      document.querySelectorAll('.scm-delete-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const rowIdx = parseInt(btn.closest('[data-row-idx]').dataset.rowIdx, 10);
          const row = (rawData.sousCategoriesTravaux || []).filter(function (r) { return r.rowIdx === rowIdx; })[0];
          if (row) confirmAndDeleteSousCategorie(row, state.view);
        });
      });

      bindDragEvents();
    }

    function renderBody() {
      const headerEl = document.getElementById('scm-header');
      const bodyEl = document.getElementById('scm-body');
      if (!headerEl || !bodyEl) return;
      headerEl.innerHTML = scmBuildHeaderHtml(state.view);
      bodyEl.innerHTML = scmBuildBodyHtml(state.view);
      bindHeaderEvents();
      bindBodyEvents();
    }

    Swal.fire({
      title: '<div class="text-lg font-black text-slate-800 text-left">Gérer les sous-catégories</div>' +
             '<div class="text-[11px] font-medium text-slate-400 text-left mt-0.5">Nom, couleur et position dans la fiche récap (3 colonnes) — glissez-déposez une carte pour la repositionner.</div>',
      html: '<div id="scm-header" class="text-left"></div><div id="scm-body" class="text-left max-h-[55vh] overflow-y-auto pr-1"></div>',
      width: '680px',
      showConfirmButton: false,
      showCloseButton: true,
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' },
      didOpen: renderBody
    });
  }

  function openSousCategorieForm(existingRow, viewKey) {
    const isNew = !existingRow;
    const cible = ctmCibleForView(viewKey);
    const row = existingRow || { rowIdx: null, cible: cible, nom: '', couleur: '#0d59f2', colonne: null, position: null };

    const html = `
      <div class="flex flex-col gap-3 mt-1 text-left">
        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Nom *</label>
          <input id="scm-nom" type="text" value="${escapeHtml(row.nom)}" placeholder="ex: Plomberie WC"
            class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
        </div>
        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Couleur</label>
          <input id="scm-couleur" type="color" value="${escapeHtml(row.couleur || '#0d59f2')}"
            class="w-16 h-9 rounded-lg border border-slate-300 cursor-pointer" />
        </div>
        ${isNew ? '<p class="text-[10px] text-slate-400 -mt-1">La position (colonne/rang) se choisit ensuite par glisser-déposer dans la grille.</p>' : ''}
      </div>
    `;

    Swal.fire({
      title: isNew ? 'Ajouter une sous-catégorie' : ('Modifier « ' + escapeHtml(row.nom) + ' »'),
      html: html,
      width: '420px',
      showCancelButton: true,
      confirmButtonText: isNew ? 'Ajouter' : 'Enregistrer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#0d59f2',
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' },
      preConfirm: () => {
        const nom = document.getElementById('scm-nom').value.trim();
        const couleur = document.getElementById('scm-couleur').value;
        if (!nom) {
          Swal.showValidationMessage("Le nom est obligatoire.");
          return false;
        }
        return { rowIdx: row.rowIdx, nom: nom, couleur: couleur };
      }
    }).then(function (result) {
      if (!result.isConfirmed) {
        openSousCategoriesManager(viewKey);
        return;
      }
      submitSousCategorieForm(result.value, isNew, viewKey);
    });
  }

  // Appends a brand-new Sous-catégorie to the end of Colonne 1 (server-side
  // validated too, but computing here avoids a round trip just to know
  // where "the end" is) — an edit keeps its existing colonne/position
  // untouched; the drag-and-drop grid is the only way to change those.
  function submitSousCategorieForm(formValue, isNew, viewKey) {
    const cible = ctmCibleForView(viewKey);

    let colonne, position;
    if (isNew) {
      const col1Rows = scmRowsForView(viewKey).filter(function (r) { return r.colonne === 1; });
      colonne = 1;
      position = col1Rows.length ? Math.max.apply(null, col1Rows.map(function (r) { return r.position; })) + 1 : 1;
    } else {
      const existing = (rawData.sousCategoriesTravaux || []).filter(function (r) { return r.rowIdx === formValue.rowIdx; })[0];
      colonne = existing ? existing.colonne : 1;
      position = existing ? existing.position : 1;
    }

    const rowData = { rowIdx: formValue.rowIdx, cible: cible, nom: formValue.nom, couleur: formValue.couleur, colonne: colonne, position: position };

    showLoading(isNew ? 'Ajout en cours...' : 'Enregistrement en cours...', formValue.nom);

    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || result.success === false) {
          if (typeof Swal !== 'undefined') Swal.close();
          showModal({ icon: 'error', title: 'Erreur', text: (result && result.message) || "L'enregistrement a échoué." });
          openSousCategorieForm(isNew ? null : rowData, viewKey);
          return;
        }
        rawData.sousCategoriesTravaux = result.rows || [];

        if (result.renamed) {
          // Fire-and-forget cascade, same convention as
          // gsSaveDiscipline/gsCascadeDisciplineUpdate — the UI updates
          // optimistically (below) rather than waiting on this round trip.
          google.script.run
            .withFailureHandler(function (err) { appErrorLog(err, "cascadeSousCategorieRename", result.renamed); })
            .cascadeSousCategorieRename(APP_DATA.token, result.renamed.cible, result.renamed.oldName, result.renamed.newName);

          (rawData.travauxConfig || []).forEach(function (r) {
            if (normalizeView(r.cible) !== viewKey) return;
            const parts = String(r.sousCategorie || '').split('|');
            if ((parts[0] || '').trim() === result.renamed.oldName) {
              parts[0] = result.renamed.newName;
              r.sousCategorie = parts.join('|');
            }
          });
          initTravauxConfigCache(rawData.travauxConfig);
        }

        if (WorkspaceCore.getActiveLayerId() === 'travaux') WorkspaceCore.refreshActiveLayer();

        if (typeof Swal !== 'undefined') Swal.close();
        showToast(isNew ? 'Sous-catégorie ajoutée.' : 'Sous-catégorie mise à jour.', 'success');
        appLog(viewKey, formValue.nom, isNew ? 'Ajout Sous-catégorie' : 'Modification Sous-catégorie', 'Private', 'Detail', rowData, APP_USER_EMAIL);

        openSousCategoriesManager(viewKey);
      })
      .withFailureHandler(function (err) {
        appErrorLog(err, "saveSousCategorieTravaux", { rowData: rowData });
        showModal({ icon: 'error', title: 'Erreur', text: "L'enregistrement a échoué : " + err.message });
      })
      .saveSousCategorieTravaux(APP_DATA.token, APP_DATA.projectId, rowData, isNew);
  }

  function confirmAndDeleteSousCategorie(row, viewKey) {
    const usage = scmUsageCount(row.nom, viewKey);
    Swal.fire({
      title: 'Supprimer cette sous-catégorie ?',
      html: '<p class="text-xs text-slate-600 text-left">« <b>' + escapeHtml(row.nom) + '</b> » sera retirée de la liste.</p>' +
            (usage > 0
              ? '<p class="text-xs text-rose-500 mt-2 text-left font-bold">Elle est actuellement utilisée par ' + usage + ' poste(s) de travaux — la suppression sera refusée tant que ce n\'est pas le cas.</p>'
              : ''),
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Supprimer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#e11d48',
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' }
    }).then(function (result) {
      if (!result.isConfirmed) return;

      showLoading('Suppression en cours...', row.nom);
      google.script.run
        .withSuccessHandler(function (result2) {
          if (typeof Swal !== 'undefined') Swal.close();
          if (!result2 || result2.success === false) {
            showModal({ icon: 'error', title: 'Suppression impossible', text: (result2 && result2.message) || "La suppression a échoué." });
            openSousCategoriesManager(viewKey);
            return;
          }
          rawData.sousCategoriesTravaux = result2.rows || [];
          showToast('Sous-catégorie supprimée.', 'success');
          appLog(viewKey, row.nom, 'Suppression Sous-catégorie', 'Private', 'Detail', { nom: row.nom }, APP_USER_EMAIL);
          openSousCategoriesManager(viewKey);
        })
        .withFailureHandler(function (err) {
          appErrorLog(err, "deleteSousCategorieTravaux", { rowIdx: row.rowIdx });
          showModal({ icon: 'error', title: 'Erreur', text: "La suppression a échoué : " + err.message });
        })
        .deleteSousCategorieTravaux(APP_DATA.token, APP_DATA.projectId, row.rowIdx);
    });
  }

  // Entry point called by setupAdminSousCategoriesButton() in
  // Workspace_Core_Scripts.html.
  window.openSousCategoriesManager = openSousCategoriesManager;

  // ---------------------------------------------------------
  // VIEW-MODE VALUE DISPLAY
  // ---------------------------------------------------------
  // Every checklist field below now renders as a PAIR: the live control
  // (checkbox/select/text — class "status-select-input") plus a read-only
  // text sibling (class "status-display-badge") holding the same value.
  // This is the exact "editable select + read-only display badge" pattern
  // EDL's Statut Global field already uses (see Workspace.html's <style>,
  // point 5) — reused here as-is, with zero CSS changes needed, so Mode
  // Édition ON/OFF swaps between the two purely via CSS, same as
  // everywhere else that pattern is used.
  //
  // Previously these fields only carried .edit-only-ui-input, which turns
  // background/border transparent and disables pointer-events in View
  // Mode but leaves the control itself on screen. That's fine for a plain
  // text input (its value stays legible), but a checkbox's checked fill
  // and a select's chosen option can end up effectively invisible once
  // their background is stripped — which is why the user's choice wasn't
  // showing outside Mode Édition. A dedicated text sibling sidesteps that
  // entirely instead of depending on native checkbox/select rendering.
  //
  // formatChecklistFieldValue() is the single source of truth for "what
  // text represents this value" — used both when a row is first built
  // below AND by updateFieldDisplayBadge() (wired into mount()'s
  // change/focusout listeners) so the badge never goes stale: without
  // that live sync, editing a field and leaving Mode Édition right away
  // (no selection change in between to force a re-render) would still
  // show whatever the badge said at last render instead of the fresh
  // value. refreshAllFieldDisplayBadges() (below, near
  // saveAllVisibleRoomsInBackground) is the belt-and-suspenders sweep
  // that re-syncs every badge on exit, covering the same "still mid-edit"
  // edge case that function already exists to save.
  // `suffix` (NEW 2026-08-26, spec section 3) is appended after a non-empty,
  // non-checkbox value only — "Largeur: 40 cm", never "—  cm" or "Oui cm".
  function formatChecklistFieldValue(isCheckbox, rawValue, suffix) {
    if (isCheckbox) return (rawValue === true || rawValue === 'true') ? 'Oui' : '—';
    const str = (rawValue == null) ? '' : String(rawValue);
    if (!str.trim()) return '—';
    return suffix ? (str + ' ' + suffix) : str;
  }

  function updateFieldDisplayBadge(el) {
    const badge = el.parentElement ? el.parentElement.querySelector('.status-display-badge') : null;
    if (!badge) return;
    const isCheckbox = (el.type === 'checkbox');
    badge.textContent = formatChecklistFieldValue(isCheckbox, isCheckbox ? el.checked : el.value, el.dataset.suffix || '');
  }

  // Historical saved values from before the primary/secondary migration
  // (2026-08-26) may still be the old {_primary, <label>: value} shape for
  // a row that used to have "Détails de champ" extra fields — unwrap so a
  // pre-migration primary value never renders as "[object Object]". Any
  // sub-keys beyond _primary are orphaned (no UI reads them anymore,
  // per the spec's clean-removal intent) but harmless — left in the sheet
  // cell as-is until that row is next saved, at which point it's
  // overwritten with the new flat shape.
  function unwrapLegacyFieldValue(value) {
    return (value && typeof value === 'object' && '_primary' in value) ? value._primary : value;
  }

  // Renders the input for one work item (primary OR secondary — the two
  // are architecturally identical rows now, see buildWorkItemRowHtml)
  // based on "Type de Champ", plus its read-only ".status-display-badge"
  // sibling — see VIEW-MODE VALUE DISPLAY above. Anything other than
  // Checkbox / Menu Deroulant falls back to a text input, so a typo or a
  // not-yet-listed type still renders something editable instead of
  // silently disappearing. `size` controls control sizing — 'normal' for a
  // primary, 'small' for a secondary rendered inline under its primary.
  function buildWorkItemFieldHtml(item, savedValue, size) {
    const type = item.typeChamp.toLowerCase();
    const idAttr = escapeHtml(item.idWork);
    const suffixAttr = item.suffix ? ' data-suffix="' + escapeHtml(item.suffix) + '"' : '';
    const isCheckbox = (type === 'checkbox');
    const isSmall = (size === 'small');
    const ctrlSize = isSmall
      ? 'px-2 py-1 rounded-lg text-[11px]'
      : 'px-3 py-1.5 rounded-lg text-xs';
    let controlHtml;

    if (isCheckbox) {
      const checked = (savedValue === true || savedValue === 'true') ? 'checked' : '';
      controlHtml = '<input type="checkbox" data-work-id="' + idAttr + '"' + suffixAttr + ' ' + checked +
             ' class="status-select-input ' + (isSmall ? 'w-4 h-4' : 'w-5 h-5') + ' rounded border-slate-300 text-primary focus:ring-primary" />';
    } else if (type === 'menu deroulant' || type === 'menu déroulant') {
      const options = item.options.map(function (opt) {
        const sel = (savedValue === opt) ? 'selected' : '';
        return '<option value="' + escapeHtml(opt) + '" ' + sel + '>' + escapeHtml(opt) + '</option>';
      }).join('');
      controlHtml = '<select data-work-id="' + idAttr + '"' + suffixAttr + ' class="status-select-input w-full ' + ctrlSize + ' border-slate-200 font-medium text-slate-700 bg-slate-50 text-center">' +
               '<option value="">—</option>' + options +
             '</select>';
    } else {
      // "Texte" and any unrecognized type
      controlHtml = '<input type="text" data-work-id="' + idAttr + '"' + suffixAttr + ' value="' + escapeHtml(savedValue || '') + '" ' +
           'class="status-select-input w-full ' + ctrlSize + ' border-slate-200 font-medium text-slate-700 bg-slate-50 text-center" placeholder="—" />';
    }

    const badgeHtml = '<span class="status-display-badge w-full ' + ctrlSize + ' font-semibold text-slate-700 bg-slate-50 border border-slate-100 truncate text-center block">' +
      escapeHtml(formatChecklistFieldValue(isCheckbox, savedValue, item.suffix)) + '</span>';

    return controlHtml + badgeHtml;
  }

  // One work item's row — primary, with any of its secondaries (spec
  // section 3, replacing the old "Détails de champ" extra-fields
  // mechanism) rendered inline underneath, smaller, per spec: "a secondary
  // ... follow[s] inline where the primary's title ends." Each secondary
  // is a full, independent catalog row (its own idWork/typeChamp/options),
  // not a sub-field of the primary — savedValues is the WHOLE room's
  // saved-value map so each secondary looks up its own entry by its own
  // idWork, exactly like a primary does.
  function buildWorkItemRowHtml(item, savedValues) {
    const primaryValue = unwrapLegacyFieldValue(savedValues[item.idWork]);
    const secondaries = getSecondariesOf(item.idWork);

    const secondariesHtml = secondaries.length
      ? '<div class="mt-1.5 pl-3 border-l-2 border-slate-100 space-y-1.5">' +
          secondaries.map(function (sec) {
            const secValue = unwrapLegacyFieldValue(savedValues[sec.idWork]);
            return '<div class="flex items-center justify-between gap-2">' +
                     '<label class="text-[10px] font-semibold text-slate-400">' + escapeHtml(sec.typeTravail) + '</label>' +
                     '<div class="w-28 shrink-0">' + buildWorkItemFieldHtml(sec, secValue, 'small') + '</div>' +
                   '</div>';
          }).join('') +
        '</div>'
      : '';

    return (
      '<div class="flex items-center justify-between gap-3 py-2 border-b border-slate-100 last:border-b-0">' +
        '<div class="flex-1 min-w-0 pr-3">' +
          '<p class="text-xs font-bold text-slate-700">' + escapeHtml(item.typeTravail) + '</p>' +
          secondariesHtml +
        '</div>' +
        '<div class="w-36 shrink-0 text-center">' + buildWorkItemFieldHtml(item, primaryValue, 'normal') + '</div>' +
      '</div>'
    );
  }

  // Pinned (blank sous-catégorie) postes render in their own section at
  // the very top, Locataires-view only (spec section 3) — ahead of the
  // normal per-Discipline groups. A pinned poste can itself have
  // secondaries; buildWorkItemRowHtml handles that the same as any other
  // row.
  function buildWorkItemsChecklistHtml(ctx, roomName, savedValues) {
    const items = getApplicableWorkItems(ctx, roomName);
    if (items.length === 0) {
      return '<p class="text-xs text-slate-400 italic">Aucun poste de travaux applicable pour cette sélection.</p>';
    }

    const pinned = ctx.currentView === 'locataires' ? items.filter(isPinnedWorkItem) : [];
    const rest = items.filter(function (item) { return !pinned.includes(item); });

    const pinnedHtml = pinned.length
      ? '<div class="mb-4 pb-3 border-b-2 border-dashed border-slate-200">' +
          pinned.map(function (item) { return buildWorkItemRowHtml(item, savedValues); }).join('') +
        '</div>'
      : '';

    const groups = groupWorkItemsByDiscipline(rest);
    const groupsHtml = groups.map(function (group) {
      return (
        '<div class="mb-4 last:mb-0">' +
          '<h4 class="text-[10px] font-black text-primary uppercase tracking-widest mb-1">' + escapeHtml(group.discipline) + '</h4>' +
          group.items.map(function (item) { return buildWorkItemRowHtml(item, savedValues); }).join('') +
        '</div>'
      );
    }).join('');

    return pinnedHtml + groupsHtml;
  }

  // Reads every checklist input currently in the DOM *for one room's card*
  // into a flat { idWork: value } map — primaries and secondaries alike,
  // each independently keyed by its own idWork (secondaries stopped being
  // sub-fields of their primary 2026-08-26, see buildWorkItemRowHtml).
  // Scoped to a single [data-room-worklist] element since every room
  // renders (and is editable) at once, each with its own independent set
  // of data-work-id inputs.
  function collectWorkItemValues(scopeEl) {
    const values = {};
    if (!scopeEl) return values;

    scopeEl.querySelectorAll('[data-work-id]').forEach(function (el) {
      values[el.dataset.workId] = (el.type === 'checkbox') ? el.checked : el.value;
    });
    return values;
  }

  function applyStatusSelectColor(selectEl) {
    const displayEl = document.getElementById('travaux-status-display');
    selectEl.classList.remove(
      'bg-blue-500', 'text-white',
      'bg-orange-400', 'text-slate-900',
      'bg-red-300',
      'bg-slate-50', 'text-slate-700'
    );
    displayEl.className = 'status-display-badge px-4 py-2 rounded-xl text-sm font-bold border border-transparent';

    const val = selectEl.value;
    displayEl.textContent = val || 'Aucun';

    // Status colors for Travaux (can be adjusted to fit Travaux specific workflows)
    if (val === 'Info') {
      selectEl.classList.add('bg-blue-500', 'text-white');
      displayEl.classList.add('bg-blue-500', 'text-white');
    } else if (val === 'Attention') {
      selectEl.classList.add('bg-orange-400', 'text-slate-900');
      displayEl.classList.add('bg-orange-400', 'text-slate-900');
    } else if (val === 'Bloquant') {
      selectEl.classList.add('bg-red-300', 'text-slate-900');
      displayEl.classList.add('bg-red-300', 'text-slate-900');
    } else {
      selectEl.classList.add('bg-slate-50', 'text-slate-700');
      displayEl.classList.add('bg-slate-50', 'text-slate-700');
    }
  }

  // ---------------------------------------------------------
  // ROOM SCOPES — every room now renders as its own container at once
  // (the Pièce dropdown is frozen while Travaux is active, same lock the
  // Réserves layer already uses — see mount()/lockRoomDropdown() below),
  // so instead of resolving to ONE current room we build the full list of
  // scopes to render.
  // ---------------------------------------------------------

  // Specific room names to render as their own container for the currently
  // selected item, sourced straight from the already-populated #room-select
  // options so it stays in sync with whatever populateRoomOrPartie()
  // decided (configLogement lookup, etc.) without duplicating that logic
  // here. The "all"/placeholder option is filtered out — it's represented
  // by the fixed "Toutes les pièces" container instead (see
  // buildRoomScopes below).
  //
  // Whole-level selections ("GLOBAL_...") and non-"locataires" views
  // (Communs/Façades) never had a per-room breakdown to begin with (the
  // old resolveRoomKey() forced everything to 'Général' for those too), so
  // this returns [] for them and only the single "Général" container ends
  // up rendering.
  function getRoomsForCurrentSelection(ctx) {
    const isWholeLevel = String(ctx.activeId || '').startsWith('GLOBAL_');
    if (isWholeLevel || ctx.currentView !== 'locataires') return [];

    const roomSelect = document.getElementById('room-select');
    if (!roomSelect) return [];
    return Array.from(roomSelect.options)
      .map(function (o) { return o.value; })
      .filter(function (v) { return v && v !== 'all'; });
  }

  // On-screen label for the always-first "every room" container. The
  // storage key behind it stays 'Général' everywhere (matches what a
  // "Toutes les pièces" selection already saved under before this change,
  // and what renderPlanPanel/getSavedWorkValuesForRoom already expect) —
  // only the label adapts to the current view, mirroring the wording
  // populateRoomOrPartie() uses for its own "all" option.
  function getAllRoomsLabel(ctx) {
    if (ctx.currentView === 'facades') return 'Toutes les parties';
    if (ctx.currentView === 'locataires') return 'Toutes les pièces';
    return 'Général';
  }

  // Full ordered list of { key, label, isGlobal } scopes to render: "Toutes
  // les pièces" (key 'Général') always first, then one entry per specific
  // room. isGlobal just drives buildRoomCardHtml()'s styling below, so the
  // first card reads as visually distinct from the per-room ones as you
  // scroll past it.
  function buildRoomScopes(ctx) {
    const scopes = [{ key: 'Général', label: getAllRoomsLabel(ctx), isGlobal: true }];
    getRoomsForCurrentSelection(ctx).forEach(function (room) {
      scopes.push({ key: room, label: room, isGlobal: false });
    });
    return scopes;
  }

  // Looks up this ID's row in Données Travaux and pulls out, for every work
  // item column that has a value for `roomName`, just that one value —
  // returning the same { idWork: value } shape buildWorkItemsChecklistHtml
  // already expects (previously sourced from travauxNotes[...].values).
  function getSavedWorkValuesForRoom(activeId, roomName) {
    const row = (rawData.travauxDonnees || []).find(function (r) { return String(r['ID Logement']) === String(activeId); });
    const values = {};
    if (!row) return values;

    Object.keys(row).forEach(function (key) {
      if (key === 'ID Logement' || !row[key]) return;
      try {
        const parsed = JSON.parse(row[key]);
        if (Object.prototype.hasOwnProperty.call(parsed, roomName)) {
          values[key] = parsed[roomName];
        }
      } catch (e) { /* cell isn't valid JSON yet (e.g. hand-edited) -- skip it rather than break the whole checklist */ }
    });
    return values;
  }

  // Wraps one scope's checklist (buildWorkItemsChecklistHtml, unchanged)
  // in its own card, tagged with data-room-worklist so the delegated
  // change/focusout listeners in mount() know which room a given input
  // belongs to when saving.
  function buildRoomCardHtml(ctx, scope, savedValues) {
    const bodyHtml = buildWorkItemsChecklistHtml(ctx, scope.key, savedValues);
    const cardClass = scope.isGlobal
      ? 'bg-primary-light border border-primary/30 rounded-2xl p-5 shadow-sm'
      : 'bg-white border border-slate-200 rounded-2xl p-5 shadow-sm';
    const icon = scope.isGlobal ? 'apartment' : 'meeting_room';
    return (
      '<div class="' + cardClass + '" data-room="' + escapeHtml(scope.key) + '">' +
        '<h3 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2">' +
          '<span class="material-symbols-outlined text-primary !text-[18px]">' + icon + '</span> ' + escapeHtml(scope.label) +
        '</h3>' +
        '<div class="divide-y divide-slate-100" data-room-worklist="' + escapeHtml(scope.key) + '">' +
          bodyHtml +
        '</div>' +
      '</div>'
    );
  }

  function updateWorkItemsChecklist(ctx) {
    const container = document.getElementById('travaux-rooms-container');
    if (!container) return;

    if (!ctx.activeId) {
      container.innerHTML = '';
      return;
    }

    const scopes = buildRoomScopes(ctx);
    container.innerHTML = scopes.map(function (scope) {
      const savedValues = getSavedWorkValuesForRoom(ctx.activeId, scope.key);
      return buildRoomCardHtml(ctx, scope, savedValues);
    }).join('');
  }

  // Saves ONE room's checklist values to Données Travaux — every room card
  // is independent now that they're all visible/editable at once (see the
  // delegated listeners in mount() below, which figure out `roomKey` and
  // `scopeEl` from whichever card the edited input lives in). Mirrors the
  // save into rawData.travauxDonnees on success (same "keep the local
  // cache in sync" pattern saveCurrentNotesInBackground uses for
  // travauxNotes) so the print panel reflects the change immediately
  // without a full page reload.
  function saveWorkItemValuesForRoom(ctx, roomKey, scopeEl) {
    if (!ctx.activeId || !roomKey) return;
    const values = collectWorkItemValues(scopeEl);
    if (Object.keys(values).length === 0) return; // nothing applicable/rendered for this room right now

    const payload = { id: ctx.activeId, room: roomKey, values: values };

    google.script.run
      .withSuccessHandler(function () {
        if (!rawData.travauxDonnees) rawData.travauxDonnees = [];
        let row = rawData.travauxDonnees.find(function (r) { return String(r['ID Logement']) === String(ctx.activeId); });
        if (!row) {
          row = { 'ID Logement': ctx.activeId };
          rawData.travauxDonnees.push(row);
        }
        Object.keys(values).forEach(function (idWork) {
          let cellObj = {};
          try { cellObj = row[idWork] ? JSON.parse(row[idWork]) : {}; } catch (e) { cellObj = {}; }
          cellObj[roomKey] = values[idWork];
          row[idWork] = JSON.stringify(cellObj);
        });
        showToast('Sauvegarde auto (Travaux)...', 'success', '', 1000);

        // Keep the printable recap (left panel) in sync with what was just
        // saved, without waiting for the next room/ID change to refresh it.
        if (WorkspaceCore.getActiveLayerId() === 'travaux') {
          const wrapper = document.getElementById('plan-wrapper');
          if (wrapper) renderPlanPanel(WorkspaceCore.buildContext(), wrapper);
        }
      })
      .withFailureHandler(function (err) {
        console.error("Auto-save (work values) failed:", err.message);
      })
      .saveTravauxDonneesData(APP_DATA.token, APP_DATA.projectId, payload);
  }

  // Saves every room card currently on screen — used as a safety net when
  // leaving Édition mode (onExitEditMode) in case a field was mid-edit
  // (focused, not yet blurred/changed) at that moment. Every field also
  // auto-saves on its own change/focusout already (see mount()), so this
  // mostly just re-covers that one edge case across all rooms at once.
  function saveAllVisibleRoomsInBackground(ctx) {
    document.querySelectorAll('#travaux-rooms-container [data-room-worklist]').forEach(function (scopeEl) {
      saveWorkItemValuesForRoom(ctx, scopeEl.dataset.roomWorklist, scopeEl);
    });
  }

  // Re-syncs every checklist badge currently on screen (all rooms) with
  // its control's live value. Called from onExitEditMode as a final catch
  // -all alongside saveAllVisibleRoomsInBackground above, covering the
  // same "field was still mid-edit when Mode Édition was turned off" gap
  // that function's own comment already describes — the per-field
  // change/focusout listeners in mount() handle the normal case, this is
  // just the safety net.
  function refreshAllFieldDisplayBadges() {
    document.querySelectorAll('#travaux-rooms-container [data-work-id]').forEach(updateFieldDisplayBadge);
  }

  // ---------------------------------------------------------
  // LEFT PANEL — printable work-summary
  // ---------------------------------------------------------
  // Locataires gets the full PDF-style "Fiche de travaux" recap below
  // (renderPlanPanelLocataires): a header info-bar plus one box per Sous-
  // catégorie, each box always showing every configured line (Oui/Non/—),
  // grouped/ordered via sousCategorieNom/Ligne and illustrated with the
  // Logo icons — see initTravauxConfigCache()'s comment for the "Nom|
  // Ligne|Logo" convention this all reads.
  // Communs/Façades don't have those header fields (Type logement, Nom,
  // etc.), so they keep the original flat list (renderPlanPanelLegacy).

  // Turns a raw saved value into a small display object for the recap:
  // { primary: 'Oui' | 'Non' | '—' | <string> }. Always returns something
  // to show (never null/skips) — every configured line prints, OUI/NON/—
  // included, matching the paper Fiche de Travaux instead of only showing
  // lines with an actual answer. `extras` (per-item "Détails de champ" sub-
  // values) removed 2026-08-26 along with that mechanism — see
  // buildWorkItemRowHtml's secondaries handling for its replacement, which
  // the recap box renderer (buildRecapBoxHtml below) now also draws on
  // directly rather than through this function. Still unwraps the legacy
  // {_primary, ...} shape (unwrapLegacyFieldValue) so a value saved before
  // that migration doesn't render as "[object Object]".
  function formatRecapValue(item, value) {
    const unwrapped = unwrapLegacyFieldValue(value);
    if (unwrapped === undefined || unwrapped === null || unwrapped === '') return { primary: '—' };
    if (unwrapped === true) return { primary: 'Oui' };
    if (unwrapped === false) return { primary: 'Non' };
    const str = String(unwrapped);
    return { primary: item.suffix ? (str + ' ' + item.suffix) : str };
  }

  // Resolves one config item into the recap row(s) it produces:
  //  - No "Pièces applicables" (WC/Cuisine/SDB-style whole-apartment
  //    items): ONE row, label = item.typeTravail, value = the item's
  //    'Général' saved value — the scope these items are meant to be
  //    filled in under (see buildRoomScopes()'s "Toutes les pièces").
  //  - "Pièces applicables" is a literal room list (VMC/Entrées d'air/
  //    Radiateurs/Peinture/Sol-style items): one row PER named room, label
  //    = room name (the box title already states the action, so repeating
  //    it per row would be redundant — matches the PDF's "Cuisine / WC /
  //    Salle de bain" rows under "Remplacement des bouches VMC"). A room
  //    named here that doesn't actually exist for THIS apartment (per
  //    existingRooms, sourced from #room-select -> Config Logement) shows
  //    "—" instead of Oui/Non — e.g. "Chambre 3" on a T3 with 2 bedrooms.
  //  - "Pièces applicables" is a "tout*" wildcard: one row per room that
  //    actually exists for this apartment (no fixed template list to draw
  //    from, so there's nothing to mark "—").
  function resolveRecapEntries(item, activeId, existingRooms) {
    if (item.piecesApplicables.length === 0) {
      const savedGeneral = getSavedWorkValuesForRoom(activeId, 'Général')[item.idWork];
      return [{ label: item.typeTravail, value: formatRecapValue(item, savedGeneral) }];
    }

    const isWildcard = item.piecesApplicables.some(function (p) { return p.toLowerCase().startsWith('tout'); });
    const roomList = isWildcard ? existingRooms : item.piecesApplicables;

    return roomList.map(function (room) {
      if (!isWildcard && existingRooms.indexOf(room) === -1) {
        return { label: room, value: { primary: '—', extras: [] } }; // room n'existe pas pour ce logement
      }
      const saved = getSavedWorkValuesForRoom(activeId, room)[item.idWork];
      return { label: room, value: formatRecapValue(item, saved) };
    });
  }

  // Groups travauxConfig items applicable to ctx.currentView (sheet order
  // for which box comes first is no longer relevant to layout — see below
  // — but items within each box are still sorted via sousCategorieLigne).
  // Each group is stamped with its Colonne/Position/Couleur from the
  // "Sous-catégories" registry (rawData.sousCategoriesTravaux, admin-
  // managed — see openSousCategoriesManager() above) so
  // renderPlanPanelLocataires can lay out a real 3-column grid instead of
  // an auto-fit CSS accident. A group whose name has no registry entry yet
  // (shouldn't happen once a Cible's registry is seeded, but handled
  // defensively rather than silently dropping the box) defaults to Colonne
  // 1, appended after every positioned box in that column.
  function groupConfigForRecap(ctx) {
    const groups = [];
    const index = {};
    travauxConfig
      // Pinned postes (blank Sous-catégorie, spec section 3) are excluded
      // from every sous-catégorie box — they render in the header instead
      // (buildRecapHeaderHtml's AIDE_DEPLACEMENT_ID_WORK lookup) and at the
      // top of the right-panel checklist (buildWorkItemsChecklistHtml).
      // Secondaries (parentId set) are also excluded here — they render
      // inline under their primary's own row instead (buildRecapBoxHtml),
      // not as independent boxes/rows.
      .filter(function (item) { return item.cible === ctx.currentView && !isPinnedWorkItem(item) && !item.parentId; })
      .forEach(function (item) {
        const key = item.sousCategorieNom;
        if (!index[key]) { index[key] = { name: key, items: [] }; groups.push(index[key]); }
        index[key].items.push(item);
      });
    groups.forEach(function (g) { g.items.sort(function (a, b) { return a.sousCategorieLigne - b.sousCategorieLigne; }); });

    const scRows = scmRowsForView(ctx.currentView);
    let maxPositionSeen = 0;
    scRows.forEach(function (r) { if (r.position > maxPositionSeen) maxPositionSeen = r.position; });

    groups.forEach(function (g) {
      const scRow = scRows.filter(function (r) { return r.nom === g.name; })[0];
      if (scRow) {
        g.colonne = scRow.colonne;
        g.position = scRow.position;
        g.couleur = scRow.couleur;
      } else {
        maxPositionSeen++; // orphaned name — park it after every real one instead of colliding on position 1
        g.colonne = 1;
        g.position = maxPositionSeen;
        g.couleur = '#64748b';
      }
    });
    groups.sort(function (a, b) { return (a.colonne - b.colonne) || (a.position - b.position); });
    return groups;
  }

  function recapValueChipHtml(primary) {
    if (primary === 'Oui') return '<span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-primary-light text-primary whitespace-nowrap">Oui</span>';
    if (primary === 'Non') return '<span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 whitespace-nowrap">Non</span>';
    if (primary === '—') return '<span class="text-[11px] font-bold text-slate-300 whitespace-nowrap">—</span>';
    return '<span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 whitespace-nowrap">' + escapeHtml(primary) + '</span>';
  }

  // One Sous-catégorie group -> one card. Consecutive rows sharing a Logo
  // are grouped under one shared icon block (mirrors adjacent lines
  // sharing one pictogram on the paper form).
  //
  // Secondaries (2026-08-26, spec section 3) render inline under their
  // primary's row, smaller — mirroring buildWorkItemRowHtml's checklist
  // rendering. Only attached when the primary resolves to exactly ONE
  // recap row (piecesApplicables.length === 0, i.e. a whole-apartment
  // item) — a secondary is a single additional value, not a per-room one,
  // so a room-scoped primary (which resolves to one row PER ROOM) has
  // nowhere sensible to attach it; its secondaries are a known,
  // deliberately unhandled gap for now rather than guessed at.
  function buildRecapBoxHtml(group, activeId, existingRooms) {
    const rows = [];
    group.items.forEach(function (item) {
      const entries = resolveRecapEntries(item, activeId, existingRooms);
      const secondaries = (entries.length === 1) ? getSecondariesOf(item.idWork) : [];
      const secondaryRows = secondaries.map(function (sec) {
        const secSaved = getSavedWorkValuesForRoom(activeId, 'Général')[sec.idWork];
        return { label: sec.typeTravail, value: formatRecapValue(sec, secSaved) };
      });
      entries.forEach(function (entry) {
        rows.push({ label: entry.label, value: entry.value, logo: item.logo, secondaryRows: secondaryRows });
      });
    });

    const blocks = [];
    rows.forEach(function (row) {
      const last = blocks[blocks.length - 1];
      if (last && last.logo === row.logo) last.rows.push(row);
      else blocks.push({ logo: row.logo, rows: [row] });
    });

    const headerIcon = (group.items.length && group.items[0].logo) ? group.items[0].logo : 'construction';
    // Sous-catégorie's own color (registry — see groupConfigForRecap above)
    // tints the box header; falls back to the default primary tint when a
    // group has none (orphaned name, see groupConfigForRecap's comment).
    const boxColor = group.couleur || '#0d59f2';

    const bodyHtml = blocks.map(function (block) {
      // "extras" (per-item Détails de champ sub-values) removed 2026-08-26
      // along with that mechanism, replaced by secondaryRows (inline,
      // smaller, under the primary's own row — see buildRecapBoxHtml
      // above for what's attached and what's still a known gap).
      // Single-line rendering, 2026-08-26 (spec section 3): a row itself
      // never wraps into a label-above-value-below stack (no flex-wrap on
      // the row) — only the title's own span may wrap internally onto
      // multiple lines (flex-1 min-w-0, ordinary text wrap) if it's long;
      // the value chip stays pinned on the first line via shrink-0. Same
      // rule applies to each secondary's own row.
      const rowsHtml = block.rows.map(function (r) {
        const secondariesHtml = (r.secondaryRows || []).map(function (sec) {
          return (
            '<div class="flex items-baseline justify-between gap-3 pl-3 mt-0.5">' +
              '<span class="text-[10px] font-semibold text-slate-400 flex-1 min-w-0">' + escapeHtml(sec.label) + '</span>' +
              '<div class="flex items-baseline gap-2 shrink-0">' + recapValueChipHtml(sec.value.primary) + '</div>' +
            '</div>'
          );
        }).join('');
        return (
          '<div class="flex items-baseline justify-between gap-3">' +
            '<span class="text-xs font-semibold text-slate-700 flex-1 min-w-0">' + escapeHtml(r.label) + '</span>' +
            '<div class="flex items-baseline gap-2 shrink-0">' + recapValueChipHtml(r.value.primary) + '</div>' +
          '</div>' +
          secondariesHtml
        );
      }).join('<div class="h-1.5"></div>');

      const iconHtml = block.logo
        ? '<div class="w-7 h-7 rounded-lg bg-primary-light text-primary flex items-center justify-center shrink-0">' + WorkspaceCore.iconSpanHtml(block.logo, '!text-[16px]') + '</div>'
        : '<div class="w-7 h-7 shrink-0"></div>';

      return (
        '<div class="flex items-start gap-3 py-2.5 border-b border-slate-100 last:border-b-0">' +
          iconHtml +
          '<div class="flex-1 min-w-0 flex flex-col">' + rowsHtml + '</div>' +
        '</div>'
      );
    }).join('');

    // Manual note space, 2026-08-26 (spec section 3) — not a data field,
    // just a reserved blank area sized for someone to write on by hand
    // after printing. No editing UI, no save/load, no new column.
    const manualNoteSpaceHtml = '<div class="mt-2 pt-2 border-t border-dashed border-slate-200" style="min-height: 2.5rem;"></div>';

    return (
      '<div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm break-inside-avoid" style="border-top: 3px solid ' + escapeHtml(boxColor) + ';">' +
        '<h3 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-1 pb-3 border-b border-slate-100 flex items-center gap-2">' +
          '<span class="w-6 h-6 rounded-lg flex items-center justify-center shrink-0" style="background-color:' + escapeHtml(boxColor) + '1a; color:' + escapeHtml(boxColor) + ';">' + WorkspaceCore.iconSpanHtml(headerIcon, '!text-[16px]') + '</span>' +
          ' ' + escapeHtml(group.name) +
        '</h3>' +
        bodyHtml +
        manualNoteSpaceHtml +
      '</div>'
    );
  }

  // Reserved idWork identifying the ONE "Aide au déplacement des
  // mobiliers" poste, per spec section 3's own note that the header needs
  // "a stable way to identify this specific poste" — a reserved ID rather
  // than name-matching (an admin could rename the label; the ID stays
  // fixed). To wire this up, an admin must create that poste (Locataires,
  // "Poste épinglé" checked, Menu déroulant field type with Oui/Non
  // options) with this EXACT ID Work value typed into the "ID Work" field
  // — it is NOT auto-detected by label/wording. Until that poste exists,
  // the header simply shows "—" (see aideDeplacementValue below).
  const AIDE_DEPLACEMENT_ID_WORK = 'aide_deplacement_mobiliers';

  // Header redesign, 2026-08-26 (spec section 3) — 4 compact rows,
  // replacing the previous branding-strip + title-row + 7-field-grid
  // layout. "Référence" now resolves to the apartment's own ID (it didn't
  // have a source before this redesign); "Aide au déplacement" resolves
  // via the reserved-ID poste above, read the same way any other
  // no-room-restriction item's value is read elsewhere in this file
  // (getSavedWorkValuesForRoom(activeId, 'Général') — see
  // resolveRecapEntries's matching comment). "Date des travaux" still has
  // no wired source anywhere in the app's data — left as "—", not
  // guessed/hardcoded, same reasoning as before.
  function buildRecapHeaderHtml(ctx) {
    const item = ctx.activeItem || {};
    const nom = [item.nom, item.prenom].filter(Boolean).join(' ') || '—';
    const typeLogement = item.typeLog ? ('T' + item.typeLog) : '—';
    const logementLocator = [item.batiment, item.hall].filter(Boolean).join('') + (item.porte ? ('-' + item.porte) : '');

    const aideItem = travauxConfig.filter(function (i) { return i.idWork === AIDE_DEPLACEMENT_ID_WORK; })[0];
    const aideValue = aideItem
      ? formatRecapValue(aideItem, getSavedWorkValuesForRoom(ctx.activeId, 'Général')[aideItem.idWork]).primary
      : '—';

    function row(leftLabel, leftValue, rightLabel, rightValue) {
      const leftHtml = '<div><span class="text-[9px] font-black text-slate-400 uppercase tracking-wide">' + escapeHtml(leftLabel) + ' </span><span class="font-bold text-slate-800 text-xs">' + escapeHtml(leftValue) + '</span></div>';
      const rightHtml = rightLabel
        ? '<div class="text-right"><span class="text-[9px] font-black text-slate-400 uppercase tracking-wide">' + escapeHtml(rightLabel) + ' </span><span class="font-bold text-slate-800 text-xs">' + escapeHtml(rightValue) + '</span></div>'
        : '';
      return '<div class="flex items-center justify-between gap-3 py-1">' + leftHtml + rightHtml + '</div>';
    }

    return (
      '<div class="bg-white border border-slate-200 rounded-2xl px-5 py-3 shadow-sm mb-4">' +
        // Row 1: project name (capped width, wraps up to 2 lines) — "Fiche
        // Travaux" — company logo — Imprimer (kept reachable here since
        // the redesigned 4-row layout has no separate title row for it).
        '<div class="flex items-start justify-between gap-3 pb-2 mb-2 border-b-2 border-slate-800">' +
          '<span class="text-[11px] font-bold text-slate-500 max-w-[45%] line-clamp-2 leading-tight">' + escapeHtml(typeof projectName !== 'undefined' ? projectName : '') + '</span>' +
          '<span class="text-xs font-black text-slate-800 uppercase tracking-widest shrink-0">Fiche Travaux</span>' +
          '<div class="flex items-center gap-2 shrink-0">' +
            (rawData.companyLogoId
              ? '<img src="https://lh3.googleusercontent.com/d/' + encodeURIComponent(rawData.companyLogoId) + '" alt="' + escapeHtml(rawData.companyName || '') + '" class="h-5 w-auto object-contain" />'
              : (rawData.companyName ? '<span class="text-[11px] font-bold text-slate-500">' + escapeHtml(rawData.companyName) + '</span>' : '')) +
            '<button onclick="window.print()" class="flex items-center justify-center w-6 h-6 bg-primary-light text-primary rounded-lg hover:bg-primary hover:text-white transition-colors" title="Imprimer">' +
              '<span class="material-symbols-outlined !text-[14px]">print</span>' +
            '</button>' +
          '</div>' +
        '</div>' +
        // Row 2: Logement N. (bâtiment+hall-porte) | Aide au déplacement
        row('Logement N.', logementLocator || '—', 'Aide au déplacement des mobiliers', aideValue) +
        // Row 3: Type logement | Référence (the apartment's own ID)
        row('Type logement', typeLogement, 'Référence', ctx.activeId || '—') +
        // Row 4: NOM
        row('NOM', nom, '', '') +
      '</div>'
    );
  }

  // PDF-style recap — Locataires only (see registerLayer's renderPlanPanel
  // dispatcher below). Boxes are now laid out in a REAL 3-column grid
  // driven by the "Sous-catégories" registry's Colonne/Position (see
  // groupConfigForRecap) instead of the old auto-fit/minmax CSS accident:
  // one flex-column container per Colonne, each holding that column's
  // boxes stacked in Position order. Same markup on screen (~40%-wide
  // panel) and on the printed PDF (#print-root fills an A4 page — see the
  // @page rule in Workspace.html) — no separate screen/print layouts.
  // Fixed, system-added QR-code sous-catégorie, 2026-08-26 (spec section
  // 3) — always appears last on the recap. Content/purpose of the QR code
  // itself is explicitly "not defined yet" per spec — this is the reserved
  // slot only, a placeholder/TODO, not a real generated QR code.
  function buildQrPlaceholderBoxHtml() {
    return (
      '<div class="bg-white border border-dashed border-slate-300 rounded-2xl p-5 shadow-sm break-inside-avoid flex flex-col items-center justify-center text-center gap-2" style="min-height: 8rem;">' +
        '<span class="material-symbols-outlined !text-3xl text-slate-300">qr_code_2</span>' +
        '<p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">QR Code</p>' +
        '<p class="text-[9px] text-slate-400">Contenu à définir</p>' +
      '</div>'
    );
  }

  function renderPlanPanelLocataires(ctx, wrapperEl) {
    const existingRooms = getRoomsForCurrentSelection(ctx); // rooms that actually exist for THIS apartment (Config Logement, via #room-select)
    const groups = groupConfigForRecap(ctx); // already sorted by (colonne, position) — see groupConfigForRecap

    let boxesHtml;
    if (groups.length === 0) {
      boxesHtml =
        '<p class="text-xs text-slate-400 italic text-center py-8">Aucun poste de travaux configuré pour les logements.</p>' +
        '<div class="max-w-xs mx-auto">' + buildQrPlaceholderBoxHtml() + '</div>';
    } else {
      const columnsHtml = [1, 2, 3].map(function (colIdx) {
        const colGroups = groups.filter(function (g) { return g.colonne === colIdx; });
        // The QR placeholder always appears last overall — appended to
        // column 3 specifically (the last-read column in a left-to-right
        // 3-column layout), regardless of how many real boxes it holds.
        const qrHtml = (colIdx === 3) ? buildQrPlaceholderBoxHtml() : '';
        return '<div class="flex flex-col gap-4">' +
          colGroups.map(function (g) { return buildRecapBoxHtml(g, ctx.activeId, existingRooms); }).join('') +
          qrHtml +
        '</div>';
      }).join('');
      boxesHtml = '<div class="grid grid-cols-3 gap-4">' + columnsHtml + '</div>';
    }

    // A4 fixed-ratio canvas, 2026-08-26 (spec section 3) — locked to the
    // true 210:297 ratio via CSS aspect-ratio (sized to fit the available
    // space: height:100% with max-width:100% as the tie-breaker when the
    // panel is wider than it is tall relative to A4), no scroll (overflow
    // hidden — content beyond one page's worth is clipped rather than
    // scrollable, matching "what's on screen is exactly what prints on one
    // page"; multi-page print modes are a separate, explicitly deferred
    // item). Zoom/pan is the shared mechanism every other layer's plan
    // photo already uses (#apartment-plan-visual's wheel/drag listeners
    // apply a transform to this exact wrapperEl — see
    // Workspace_Core_Scripts.html's initGlobalZoomPan) — nothing new to
    // wire up here beyond un-hiding the zoom controls (renderPlanPanel
    // above) and resetting to fit-to-view on every render.
    wrapperEl.innerHTML =
      '<div class="w-full h-full flex items-center justify-center">' +
        '<div id="print-root" class="bg-white shadow-lg overflow-hidden p-6" style="aspect-ratio: 210 / 297; height: 100%; max-width: 100%;">' +
          buildRecapHeaderHtml(ctx) +
          boxesHtml +
        '</div>' +
      '</div>';
  }

  // Original flat "grouped by Sous-catégorie, Ligne-sorted, only lines with
  // an actual answer" recap — kept for Communs/Façades, which don't have
  // the Fiche's header fields (Type logement, Nom, etc.) to justify the
  // full PDF-style layout above.
  function renderPlanPanelLegacy(ctx, wrapperEl) {
    const row = (rawData.travauxDonnees || []).find(function (r) { return String(r['ID Logement']) === String(ctx.activeId); });

    const groups = {};
    const groupOrder = [];

    if (row) {
      travauxConfig.forEach(function (item) {
        const cell = row[item.idWork];
        if (!cell) return;
        let parsed;
        try { parsed = JSON.parse(cell); } catch (e) { return; }

        Object.keys(parsed).forEach(function (roomKey) {
          const formatted = formatRecapValue(item, parsed[roomKey]);
          if (formatted.primary === '—') return; // legacy behavior: skip blanks entirely

          const display = formatted.primary;

          const groupKey = item.sousCategorieNom;
          if (!groups[groupKey]) {
            groups[groupKey] = { ligne: item.sousCategorieLigne, entries: [] };
            groupOrder.push(groupKey);
          }
          groups[groupKey].entries.push({
            label: item.typeTravail,
            room: (roomKey === 'Général') ? null : roomKey,
            value: display
          });
        });
      });
    }

    groupOrder.sort(function (a, b) { return groups[a].ligne - groups[b].ligne; });

    const bodyHtml = groupOrder.length === 0
      ? '<p class="text-xs text-slate-400 italic text-center py-8">Aucun travaux renseigné pour le moment.</p>'
      : groupOrder.map(function (key) {
          const g = groups[key];
          return (
            '<div class="mb-5 last:mb-0 break-inside-avoid">' +
              '<h4 class="text-[11px] font-black text-primary uppercase tracking-widest border-b border-primary/20 pb-1 mb-2">' + escapeHtml(key) + '</h4>' +
              g.entries.map(function (e) {
                return (
                  '<div class="flex items-baseline justify-between gap-3 py-1 text-xs">' +
                    '<span class="text-slate-700 font-medium">' + escapeHtml(e.label) +
                      (e.room ? ' <span class="text-slate-400 font-normal">(' + escapeHtml(e.room) + ')</span>' : '') +
                    '</span>' +
                    '<span class="text-slate-500 font-semibold shrink-0">' + escapeHtml(e.value) + '</span>' +
                  '</div>'
                );
              }).join('') +
            '</div>'
          );
        }).join('');

    wrapperEl.innerHTML =
      '<div class="w-full h-full overflow-y-auto p-6 bg-white">' +
        '<div id="print-root">' +
          '<div class="flex items-center justify-between mb-4 pb-3 border-b-2 border-slate-800">' +
            '<div>' +
              '<p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Récapitulatif des travaux</p>' +
              '<p class="text-sm font-black text-slate-800">' + escapeHtml(ctx.activeId) + '</p>' +
            '</div>' +
            '<button onclick="window.print()" class="flex items-center gap-1 px-3 py-1.5 bg-primary-light text-primary rounded-lg text-[10px] font-black uppercase hover:bg-primary hover:text-white transition-colors">' +
              '<span class="material-symbols-outlined !text-[16px]">print</span> Imprimer' +
            '</button>' +
          '</div>' +
          bodyHtml +
        '</div>' +
      '</div>';
  }

  // Populates the shared plan-container (left side) for ctx.activeId.
  // Registered as the layer's renderPlanPanel — Core calls this instead of
  // loading a plan photo whenever Travaux is active (see the hook in
  // Workspace_Core_Scripts.html).
  function renderPlanPanel(ctx, wrapperEl) {
    const zoomControls = document.getElementById('plan-zoom-controls');
    // Zoom re-enabled for the Locataires recap 2026-08-26 (spec section 3,
    // "New: left panel becomes a fixed-ratio, zoomable A4 canvas") — it
    // used to be unconditionally hidden here ("meaningless over a text
    // summary, not a photo"). Legacy (Communs/Façades) keeps the original
    // flat scrolling list untouched, so zoom stays hidden for that case.
    const showZoom = !!(ctx.activeId && ctx.currentView === 'locataires');
    if (zoomControls) zoomControls.classList.toggle('hidden', !showZoom);
    if (showZoom) resetZoomPanState(); // fit-to-view default, not whatever zoom/pan a previous layer/photo left behind

    if (!ctx.activeId) {
      wrapperEl.innerHTML =
        '<div class="w-full h-full flex flex-col items-center justify-center text-slate-400 gap-2">' +
          '<span class="material-symbols-outlined !text-4xl opacity-50">checklist</span>' +
          '<p class="text-xs font-bold uppercase tracking-widest">Sélectionnez un élément</p>' +
        '</div>';
      return;
    }

    if (ctx.currentView === 'locataires') {
      renderPlanPanelLocataires(ctx, wrapperEl);
    } else {
      renderPlanPanelLegacy(ctx, wrapperEl);
    }
  }

  // Freezes the Pièce dropdown — copied from the Réserves layer (see
  // Réserves_Scripts.html's mount()/renderInterventionsList()). Travaux no
  // longer uses the dropdown to pick which room to show: every room renders
  // as its own container below instead. Called from mount() AND from
  // render(), because populateRoomOrPartie() (Core) re-enables #room-select
  // as a side effect any time the Bâtiment/Étage/Porte selection changes —
  // Réserves re-applies its own lock on every render() for that exact
  // reason, so this does the same.
  function lockRoomDropdown() {
    const roomDropdown = document.getElementById('room-select');
    if (roomDropdown) {
      roomDropdown.disabled = true;
      roomDropdown.classList.add('opacity-50', 'cursor-not-allowed');
      roomDropdown.title = "La sélection de pièce est désactivée dans la vue Travaux : toutes les pièces sont affichées ci-dessous.";
    }
  }

  function mount(container, ctx) {
    lockRoomDropdown();

    container.classList.add('flex', 'flex-col', 'gap-6', 'max-w-3xl', 'mx-auto', 'pb-10');
    container.innerHTML = `
      <div id="travaux-rooms-container" class="flex flex-col gap-6">
        <!-- one room-card per scope (Toutes les pièces + each Pièce), populated by updateWorkItemsChecklist() on render — see buildRoomCardHtml() -->
      </div>
    `;

    // Bind checklist inputs via delegation on the shared wrapper (every
    // room card is rebuilt on each render, so binding once here beats
    // re-binding per-row/per-card). Checkboxes/dropdowns save immediately
    // on change; text fields save on focusout, same debounce-by-blur
    // pattern as before — just resolved to whichever room card
    // (data-room-worklist) the edited input actually lives in now that all
    // rooms are visible/editable at once, instead of a single shared room.
    // These save to Données Travaux, not Travaux_Notes.
    const roomsContainer = document.getElementById('travaux-rooms-container');
    roomsContainer.addEventListener('change', function (e) {
      const el = e.target.closest('[data-work-id]');
      if (!el) return;
      updateFieldDisplayBadge(el); // keep the view-mode badge in sync immediately
      const scopeEl = el.closest('[data-room-worklist]');
      if (!scopeEl) return;
      if (el.tagName === 'SELECT' || el.type === 'checkbox') {
        saveWorkItemValuesForRoom(WorkspaceCore.buildContext(), scopeEl.dataset.roomWorklist, scopeEl);
      }
    });
    roomsContainer.addEventListener('focusout', function (e) {
      const el = e.target.closest('[data-work-id]');
      if (!el) return;
      updateFieldDisplayBadge(el); // keep the view-mode badge in sync immediately
      const scopeEl = el.closest('[data-room-worklist]');
      if (!scopeEl) return;
      if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number')) {
        saveWorkItemValuesForRoom(WorkspaceCore.buildContext(), scopeEl.dataset.roomWorklist, scopeEl);
      }
    });

    // NOTE: this used to manually call renderPlanPanel() here because
    // WorkspaceCore.activateLayer() only refreshed the plan-container on a
    // selection change, not on a plain layer switch — switching TO Travaux
    // worked, but switching AWAY from it left the recap on screen
    // indefinitely. That gap is now closed centrally in activateLayer() via
    // refreshPlanPanelForActiveLayer(), which calls this layer's own
    // renderPlanPanel() right after mount() runs — for every layer, in both
    // directions — so this file no longer needs to do it itself.
  }

  function render(ctx) {
    lockRoomDropdown(); // defensive re-lock, see lockRoomDropdown()'s comment
    updateWorkItemsChecklist(ctx);
  }

  // Register the Travaux layer with the Workspace Core
  WorkspaceCore.registerLayer('travaux', {
    label: 'Travaux',
    layoutMode: 'data-entry',
    mount: mount,
    render: render,
    renderPlanPanel: renderPlanPanel,
    onExitEditMode: function (ctx) {
      saveAllVisibleRoomsInBackground(ctx);
      refreshAllFieldDisplayBadges();
      if (window.unlockRoomDropdown) window.unlockRoomDropdown();
    },
    onBaseDataLoaded: function () {
      // Config Travaux is already part of the initial page-load payload
      // (rawData.travauxConfig, fetched once via getTravauxConfigDataHelper)
      // — no extra round-trip needed here anymore.
      initTravauxConfigCache(rawData.travauxConfig || []);
    }
  });

})();

</script>
