  <script>
    const PROJECT_ID = (typeof APP_DATA !== 'undefined') ? APP_DATA.projectId : "";

    /**
     * Updates UI with project details fetched from the server.
     */
    function updateMobileUI(project) {
      if (!project) return;

      // Update global app header (injected by HeaderMobile include)
      const topName = document.getElementById('topProjectName');
      if (topName) topName.textContent = project.name;

      // Dashboard hero section
      document.getElementById('mobProjName').textContent = project.name;
      document.getElementById('mobSub').textContent = `Projet #${project.id} • ${project.units || 0} Logements`;

      // Status indicator colour
      const dot = document.getElementById('mobStatusDot');
      const s = (project.status || '').toLowerCase();
      if (s === 'active' || s === 'en cours') {
        dot.className = "size-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]";
      }
    }

    /**
     * Role-based visibility for mobile action buttons.
     */
    function checkPermissions() {
      const user = (typeof APP_DATA !== 'undefined' && APP_DATA.user) ? APP_DATA.user : {};
      const role = (user.role || "").toLowerCase();
      if (role === 'admin' || role === 'directeur') {
        document.getElementById('adminBtn')?.classList.remove('hidden');
      }
    }

    /**
     * Initialization
     *
     * NOTE:  All navToWithParams calls automatically carry projectId forward
     *         because navToWithParams in ClientLib reads APP_DATA.projectId
     *         when the caller does not explicitly override it. No changes
     *         needed at the call sites.
     */
    window.onload = () => {
      checkPermissions();

      // Guard: redirect to portfolio if no project context
      if (!PROJECT_ID) {
        window.top.location.replace(BASE_URL + "?page=project-portfolio");
        return;
      }

      google.script.run
        .withSuccessHandler(projects => {
          const p = projects.find(item => String(item.id) === String(PROJECT_ID));
          if (p) {
            updateMobileUI(p);
          } else {
            document.getElementById('mobProjName').textContent = "Projet introuvable";
            document.getElementById('mobSub').textContent = "Retour au portfolio...";
            setTimeout(() => {
              window.top.location.replace(BASE_URL + "?page=project-portfolio");
            }, 2000);
          }
        })
        .withFailureHandler(err => {
          console.error("Erreur de chargement du projet:", err);
          document.getElementById('mobProjName').textContent = "Erreur de chargement";
          document.getElementById('mobSub').textContent = "Veuillez rafraîchir la page";

          // FIX: PROJECT_ID_FROM_SERVER replaced by PROJECT_ID (defined above)
          appErrorLog(err, "gsListProjects_Mobile", {
            requestedProjectId: PROJECT_ID,
            token: APP_DATA.token ? "present" : "missing"
          });
        })
        .gsListProjects(APP_DATA.token);
    };

  </script>
