  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Custom icon web font (Drive "04- Icons") — mirrors the base ruleset
       Google's own Material Symbols stylesheet applies, so icons from
       either font behave identically wherever an icon-name field renders
       one (recap boxes, admin list rows, previews...). The @font-face rule
       itself is injected at runtime once its base64 data arrives from the
       server — a data: URL can't live in this static block — see
       loadCustomIconAssets() / injectCustomIconFontFace() in
       Workspace_Core_Scripts.html. */
    .custom-icon-font {
      font-family: 'CustomIcons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    
    .plan-container, .details-panel {
      transition: flex-basis 0.4s cubic-bezier(0.4, 0, 0.2, 1), max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* layoutMode presets — driven by whatever the active layer declares as
       layoutMode in its WorkspaceCore.registerLayer(...) call. Only two
       presets exist today; add a third here (and use it in a layer's
       layoutMode) if a future layer needs a different split. */
    #workspace-screen[data-mode="data-entry"] .plan-container { flex-basis: 40%; max-width: 40%; }
    #workspace-screen[data-mode="data-entry"] .details-panel  { flex-basis: 60%; max-width: 60%; }

    #workspace-screen[data-mode="drawing"] .plan-container { flex-basis: 60%; max-width: 60%; }
    #workspace-screen[data-mode="drawing"] .details-panel  { flex-basis: 40%; max-width: 40%; }
    
    #workspace-screen[data-mode="drawing"] #room-dropdown-container { display: none; }

    /* Edit-only controls (buttons, containers) are fully hidden in View Mode.
       Shared by all 6 layers — see point 5/7 in the reorg notes. Any layer
       can gate a button/container this way just by adding this class.
       EXCEPTION: to make a field editable even outside Mode Édition, simply
       do NOT give it this class (or edit-only-ui-input below). */
    #workspace-screen[data-edit-state="view"] .edit-only-ui { 
      display: none !important;
    }

    /* Edit-only inputs (text fields, textareas, selects) stay visible but
       become read-only in View Mode. Same shared/exception rule as above. */
    #workspace-screen[data-edit-state="view"] .edit-only-ui-input {
      pointer-events: none;
      background-color: transparent !important;
      border-color: transparent !important;
      padding-left: 0;
      padding-right: 0;
    }
    
    .layer-btn.active {
      color: #0d59f2;
      background-color: #eef4ff;
      border-right-color: #0d59f2;
    }

    /* Styling for the cascading select elements with arrow protection */
    .cascade-select {
      background-color: transparent;
      border: none;
  
      /* 24px padding on the right creates a safe zone so text never collides with the arrow */
      padding-top: 2px;
      padding-bottom: 2px;
      padding-left: 6px;
      padding-right: 24px !important; 
  
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
  
      /* Enforce a minimum and maximum window scale */
      min-width: 90px;
      max-width: 200px;
  
      /* Smoothly adapt layout changes */
      transition: width 0.15s ease;
    }

    .cascade-select:focus { outline: none; box-shadow: none; color: #0d59f2; }
    .cascade-select:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Generic "editable select + read-only display badge" pattern (point 5).
       EDL's Statut Global select uses this today (see status-select-input /
       status-display-badge classes in EDL_Scripts.html's mount()) — any
       future layer can reuse the exact same pair of classes for its own
       status-like field and gets this same view/edit swap for free, with
       zero changes needed here. */
    #workspace-screen[data-edit-state="view"] .status-select-input {
      display: none;
    }
    #workspace-screen[data-edit-state="view"] .status-display-badge {
      display: inline-block;
    }

    #workspace-screen[data-edit-state="edit"] .status-select-input {
      display: block;
    }
    #workspace-screen[data-edit-state="edit"] .status-display-badge {
      display: none;
    }

    /* Generic "print just this element" pattern. A layer marks whatever it
       wants printed with id="print-root" (Travaux's work-summary uses this
       for its renderPlanPanel content) and calls window.print(); everything
       else on the page is hidden for the duration of the print job only —
       nothing changes on screen. Any future layer can reuse this the same
       way, just by giving its own printable content that same id. */
    @media print {
      body * { visibility: hidden; }
      #print-root, #print-root * { visibility: visible; }
      #print-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
    }

    /* A4 paper size for anything printed via #print-root (e.g. Travaux's
       "Fiche de travaux" recap). Margins here are the printable-area
       inset — #print-root's own width:100% above maps to whatever's left
       inside them, so the recap's responsive box grid (auto-fit/minmax)
       naturally resolves to the right column count for A4 without any
       print-specific column overrides. */
    @page {
      size: A4;
      margin: 12mm;
    }
  </style>
</head>
