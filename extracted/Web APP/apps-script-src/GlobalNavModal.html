<script>
  if (typeof window.selectedIdForNav === 'undefined') {
    window.selectedIdForNav = null;
  }

  function openNavModal(id) {
    window.selectedIdForNav = id;
    
    // 1. Fetch current environment constraints
    const currentPage = getCurrentPage();
    const isClientUser = (typeof APP_DATA !== 'undefined') ? APP_DATA.isClient : false;
    
    // Define an array of modules hidden from Client accounts
    const clientRestrictedPages = ['auto-controles']; 

    // 2. Loop through navigation buttons to toggle visibility
    const buttons = document.querySelectorAll('#navModalButtons button[data-page]');
    buttons.forEach(btn => {
      const targetPage = btn.getAttribute('data-page');

      // Rule 1: Hide the active page option entirely
      if (targetPage === currentPage) {
        btn.classList.add('hidden');
        return;
      }

      // Rule 2: Restrict designated screens if the client flag is active
      if (isClientUser && clientRestrictedPages.includes(targetPage)) {
        btn.classList.add('hidden');
        return;
      }

      // Default: Fallback to showing options that pass validation checks
      btn.classList.remove('hidden');
    });

    document.getElementById('desktopNavModal').classList.remove('hidden');
  }

  function closeNavModal() {
    document.getElementById('desktopNavModal').classList.add('hidden');
    window.selectedIdForNav = null;
  }

  function goToModule(page) {
    if (!window.selectedIdForNav) return;
    
    const params = { transferId: window.selectedIdForNav };
    const urlParams = new URLSearchParams(window.location.search);
    
    // Conserve le mode d'affichage (mobile vs desktop)
    if (urlParams.get('view') === 'mobile') params.view = 'mobile';
    
    if (window.currentView) {
      params.currentView = window.currentView;
    } else if (urlParams.get('currentView')) {
      params.currentView = urlParams.get('currentView');
    }
    
    navToWithParams(page, params);
    closeNavModal();
  }
</script>
