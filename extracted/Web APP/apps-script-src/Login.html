<script>
  /**
   * Update the Browser Tab Title and company name placeholders
   */
  const companyName = APP_DATA.companyName;
  document.getElementById('company-name-1').innerText = companyName;
  document.getElementById('company-name-2').innerText = companyName;

  /**
   * Password Visibility Toggle
   */
  document.getElementById('togglePwd').addEventListener('click', () => {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  });

  /**
   * Form Submission Logic
   */
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const pass     = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');

    if (!email || !pass)
      return showToast("Attention", "warning", "Merci de renseigner email et mot de passe.");

    if (pass.length < 8)
      return showToast("Attention", "warning", "Le mot de passe doit contenir au moins 8 caractères.");

    loginBtn.disabled = true;
    loginBtn.innerHTML = `
      <span>Vérification en cours…</span>
      <span class="material-symbols-outlined text-lg animate-spin">sync</span>
    `;
    loginBtn.classList.add('opacity-70', 'cursor-not-allowed');

    google.script.run
      .withSuccessHandler(r => {
        persistSessionAndGo(r.sessionToken);
      })
      .withFailureHandler(err => {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `
          <span>Se connecter</span>
          <span class="material-symbols-outlined text-lg">arrow_forward</span>
        `;
        loginBtn.classList.remove('opacity-70', 'cursor-not-allowed');

        showModal({
          icon:  'error',
          title: 'Échec de connexion',
          text:  err.message
        });

        appErrorLog(err, "gsLoginWithEmailPassword", { attemptedEmail: email });
      })
      .gsLoginWithEmailPassword(email, pass);
  });
</script>
