  <script>
    const companyName = APP_DATA.companyName;
    document.getElementById('company-name').innerText = companyName;

    /**
     * Handles the form submission for password reset requests.
     * gsRequestPasswordReset always returns { ok: true } — even for unknown emails.
     * This prevents email enumeration attacks.
     */
    document.getElementById('resetRequestForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      if (!email) return;

      // Display loading state using showLoading
      showLoading('Envoi en cours', 'Traitement de la demande...');

      // Execute server-side Apps Script function
      google.script.run
        .withSuccessHandler(() => {
          // Success: Inform the user via showModal
          showModal({
            icon: 'success',
            title: 'Demande traitée',
            text: 'Si cette adresse est enregistrée, un lien de réinitialisation a été envoyé dans votre boîte mail.'
          });
          document.getElementById('resetRequestForm').reset();
        })
        .withFailureHandler(err => {
          // Error: Show backend error message via showModal
          showModal({
            icon: 'error',
            title: 'Erreur',
            text: err.message || "Une erreur est survenue."
          });
          appErrorLog(err, "gsRequestPasswordReset", { attemptedEmail: email });
        })
        .gsRequestPasswordReset(email);
    });
  </script>
