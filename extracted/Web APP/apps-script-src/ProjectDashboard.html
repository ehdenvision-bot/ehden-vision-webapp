<script>

  const PROJECT_ID = (typeof APP_DATA !== 'undefined') ? APP_DATA.projectId : "";

  const isAuthorized = (typeof APP_DATA !== 'undefined' && APP_DATA.isAuthorized) ? APP_DATA.isAuthorized : false;
  const isClient     = (typeof APP_DATA !== 'undefined' && APP_DATA.isClient)     ? APP_DATA.isClient     : false;

  // isClientViewActive: localStorage is the source of truth for this UX preference.
  const storedClientView = localStorage.getItem('isClientViewActive');
  window.isClientViewActive = storedClientView !== null
    ? storedClientView === 'true'
    : (typeof APP_DATA !== 'undefined' && APP_DATA.isClientViewActive === true);

  /**
   * Sidebar State Management
   * sidebarCollapsed is a UX preference — correct to store in localStorage.
   */
  const sidebar   = document.getElementById('mainSidebar');
  const toggleBtn = document.getElementById('toggleSidebar');

  if (toggleBtn) {
    toggleBtn.onclick = () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    };
  }

  if (localStorage.getItem('sidebarCollapsed') === 'true' && sidebar) {
    sidebar.classList.add('collapsed');
  }

  /**
   * Data Binding: Populates the dashboard with project data
   */
  function updatePageData(project) {
    if (!project) return;

    // Header & Sidebar sync
    safeSetText('topProjectName', project.name);
    safeSetText('headerProjectName', project.name);
    safeSetText('headerId', "PROJET #" + project.id);
    safeSetText('headerDesc', project.description || "Données indisponibles.");

    // Status badge
    const stEl = document.getElementById('headerStatus');
    if (stEl) {
      const badge = getStatusBadge(project.status);
      stEl.innerHTML = `<span class="material-symbols-outlined !text-[14px]">${badge.icon}</span><span>${badge.text}</span>`;
      stEl.className = `status-pill ${badge.cls}`;
    }

    // KPI values
    safeSetText('valUnits', project.units);
    safeSetText('valStart', project.startDate || '—');
    safeSetText('valEnd',   project.endDate ? "Échéance: " + project.endDate : "");
    safeSetText('valOwner', project.owner || '—');

    // Progress bar
    const prog = project.progress || 0;
    safeSetText('valProgText', prog + "%");
    const bar = document.getElementById('valProgBar');
    if (bar) bar.style.width = prog + "%";

    document.getElementById('statsBar').classList.remove('opacity-50');
  }

  /**
   * Application Initialization
   */
  window.onload = function init() {
    const currentUser = (typeof APP_DATA !== 'undefined') ? APP_DATA.user : null;

    // Security gate — redirect to login if no session
    if (!currentUser) {
      console.warn("No user found, redirecting...");
      window.top.location.replace(BASE_URL + "?page=login");
      return;
    }

    // Inject client view toggle for authorized non-client users
    if (!isClient) {
      injectClientViewToggle();
    }

    // Role-based sidebar item visibility
    const role = (currentUser.role || '').toLowerCase();
    if (role === 'admin' || role === 'directeur') {
      document.getElementById('navSettings')?.classList.remove('hidden');
      document.getElementById('navUsers')?.classList.remove('hidden');
    }

    // Identity display
    const name = currentUser.name || "collaborateur";
    safeSetText('u_name',     name);
    safeSetText('u_role',     currentUser.role || 'Utilisateur');
    safeSetText('u_initials', name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2));

    // If projectId is missing the user somehow landed here without a valid
    // project context; redirect them back to the portfolio to pick one.
    if (!PROJECT_ID) {
      window.top.location.replace(BASE_URL + "?page=project-portfolio");
      return;
    }

    // to validate the session before returning data.
    google.script.run
      .withSuccessHandler(projects => {
        const p = projects.find(item => String(item.id) === String(PROJECT_ID));
        if (p) {
          updatePageData(p);
        } else {
          // Project not found in the list — send back to portfolio
          window.top.location.replace(BASE_URL + "?page=project-portfolio");
        }
      })
      .withFailureHandler(err => {
        showModal({
          icon:  'error',
          title: 'Erreur',
          text:  'Impossible de synchroniser les données du projet.'
        });
        appErrorLog(err, "gsListProjects_Dashboard", {
          requestedProjectId: PROJECT_ID,
          token: APP_DATA.token ? "present" : "missing"
        });
      })
      .gsListProjects(APP_DATA.token);
  };

  /**
   * Header Menu Toggle Logic
   */
  document.addEventListener('DOMContentLoaded', () => {
    const userBtn  = document.getElementById('userMenuBtn');
    const userMenu = document.getElementById('userMenu');
    const navBtn   = document.getElementById('navMenuBtn');
    const navMenu  = document.getElementById('navMenu');

    if (userBtn) userBtn.onclick = (e) => { e.stopPropagation(); userMenu.classList.toggle('hidden'); navMenu?.classList.add('hidden'); };
    if (navBtn)  navBtn.onclick  = (e) => { e.stopPropagation(); navMenu.classList.toggle('hidden'); userMenu?.classList.add('hidden'); };

    document.onclick = (e) => {
      if (userMenu && !userBtn?.contains(e.target) && !userMenu.contains(e.target)) userMenu.classList.add('hidden');
      if (navMenu  && !navBtn?.contains(e.target)  && !navMenu.contains(e.target))  navMenu.classList.add('hidden');
    };
  });


</script>
