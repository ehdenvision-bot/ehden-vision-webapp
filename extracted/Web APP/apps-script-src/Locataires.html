  <style>
    /* Scrollbars Customization */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    
    /* UI Components */
    .chip-active   { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
    .chip-blocked  { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
    .chip-ended    { background:#f1f5f9; color:#334155; border-color:#e2e8f0; }
    .chip-archived { background:#f8fafc; color:#64748b; border-color:#e2e8f0; }
    
    .status-pill { 
      display: inline-flex; align-items: center; gap: 0.375rem; border-radius: 9999px; 
      padding: 0.25rem 0.75rem; font-size: 10px; font-weight: 700; border: 1px solid transparent;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); text-transform: uppercase;
    }

    /* Table Layout & Sticky Headers */
    #dataTable thead { top: 0px !important; z-index: 80 !important; }

    #dataTable thead th {
      height: 48px; 
      padding-top: 0; 
      padding-bottom: 0; 
      vertical-align: middle;
      position: sticky; 
      top: 0; 
      z-index: 80; /* Same as thead */
      background: white;
    }

    #dataTable td, #dataTable th {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-left: 8px; padding-right: 8px; font-size: 12px; line-height: 1.25rem;
    }

    .sticky-subtitle-content {
      position: sticky;
      left: 10px;     /* Distance from the left edge of the visible area */
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      z-index: 70;    /* Above the TD background */
      pointer-events: auto;
    }

    /* Fix the Editer Column (1st column) */
    #dataTable th:nth-child(1), 
    #dataTable td:nth-child(1) {
      position: sticky;
      left: 0;
      z-index: 40;
      background-color: white; 
      border-right: 1px solid #e2e8f0;
    }

    /* Colonne 2 sticky (ID) SEULEMENT si la colonne Édition est présente */
    #dataTable.has-edit-col th:nth-child(2), 
    #dataTable.has-edit-col td:nth-child(2) {
      position: sticky;
      left: var(--sticky-col1-width, 70px);
      z-index: 40;
      background-color: white;
      border-right: 2px solid #e2e8f0;
    }

    /* Sinon : colonne 2 normale */
    #dataTable:not(.has-edit-col) th:nth-child(2),
    #dataTable:not(.has-edit-col) td:nth-child(2) {
      position: static;
      left: auto;
      z-index: auto;
      background: inherit;
      border-right: none;
    }

    /* Ensure headers stay above the fixed columns when scrolling vertically */
    #dataTable thead th:nth-child(1) {
      z-index: 90 !important;
    }
    #dataTable thead th:nth-child(2) {
      z-index: 90 !important;
    }

    /* Add this to your <style> block [cite: 5] */
    .sticky-group-label {
      position: sticky;
      left: 20px; /* Adjust this to move the text further right or left */
      display: inline-block;
      white-space: nowrap;
      z-index: 60; /* Higher than the ID/Edit columns [cite: 16] */
    }

    /* Ensure the background row stays above normal rows but below headers */
    tr.bg-indigo-50\/80 {
      z-index: 60;
    }

    tr.bg-indigo-50\/80 td {
      position: sticky;
      top: 48px;      /* Stays below the header when scrolling down */
      z-index: 60;    /* Higher than fixed columns (40) */
      background-color: rgba(238, 242, 255, 0.98) !important;
      backdrop-filter: blur(4px);
      border-y: 1px solid #e0e7ff;
      
      /* IMPORTANT: Allow the inner div to stick horizontally */
      overflow: visible !important; 
    }

    #dataTable {
      table-layout: fixed !important; margin-left: auto; margin-right: auto;
      width: 100%;
      border-collapse: separate; overflow-y: auto;
      scroll-padding-top: 48px; /* Removed the explicit height rule */
    }

    .overflow-x-auto { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #scrollContainer { scroll-padding-top: 150px; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Dropdown Multi-Select Styles */
    .dropdown-menu {
      display: none; position: absolute; top: 100%; left: 0; z-index: 120;
      min-width: 180px; max-height: 250px; overflow-y: auto; background: white;
      border: 1px solid #e2e8f0; border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); margin-top: 4px;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item { display: flex; align-items: center; padding: 8px 12px; cursor: pointer; font-size: 12px; transition: background 0.2s; }
    .dropdown-item:hover { background: #f8fafc; }
    .dropdown-item input { margin-right: 10px; border-radius: 4px; color: #0d59f2; cursor: pointer; }

    /* Scroll Area Customization */
    #scrollArea { overflow-y: scroll; scrollbar-width: thin; scrollbar-color: #0d59f2 #f1f5f9; }
    #scrollArea::-webkit-scrollbar { width: 8px; display: block; }
    #scrollArea::-webkit-scrollbar-track { background: #f8fafc; border-left: 1px solid #e2e8f0; }
    #scrollArea::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; border: 2px solid #f8fafc; }
    #scrollArea::-webkit-scrollbar-thumb:hover { background-color: #0d59f2; }

    /* The row highlight - Soft Green */
    .row-highlight td {
      background-color: #dcfce7 !important; 
    }

    /* Force the sticky/fixed columns to be green too 
     (Adjust the class name if your sticky column is named differently) */
    .row-highlight .sticky, 
    .row-highlight .sticky-col,
    .row-highlight th {
      background-color: #dcfce7 !important;
    }
  
    /* Optional: Border to make it pop more */
    .row-highlight td {
      border-top: 1px solid #22c55e !important;
      border-bottom: 1px solid #22c55e !important;
    }

  </style>
</head>
