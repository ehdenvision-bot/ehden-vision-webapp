<script>
(function () {
  'use strict';

  // =========================================================
  // EDL LAYER  —  registers itself as layer id 'edl'
  // =========================================================

  let photoCache = {};

  function initPhotoCache(photosArray) {
    photoCache = {};
    (photosArray || []).forEach(p => {
      if (!photoCache[p.idLot]) photoCache[p.idLot] = {};
      if (!photoCache[p.idLot][p.room]) photoCache[p.idLot][p.room] = [];
      photoCache[p.idLot][p.room].push(p);
    });
  }

  function applyStatusSelectColor(selectEl) {
    const displayEl = document.getElementById('edl-status-display');
    selectEl.classList.remove(
      'bg-blue-500', 'text-white',
      'bg-orange-400', 'text-slate-900',
      'bg-red-300',
      'bg-slate-50', 'text-slate-700'
    );
    displayEl.className = 'status-display-badge px-4 py-2 rounded-xl text-sm font-bold border border-transparent';

    const val = selectEl.value;
    displayEl.textContent = val || 'Aucun';
    if (val === 'Info') {
      selectEl.classList.add('bg-blue-500', 'text-white');
      displayEl.classList.add('bg-blue-500', 'text-white');
    } else if (val === 'Attention') {
      selectEl.classList.add('bg-orange-400', 'text-slate-900');
      displayEl.classList.add('bg-orange-400', 'text-slate-900');
    } else if (val === 'Bloquant') {
      selectEl.classList.add('bg-red-300', 'text-slate-900');
      displayEl.classList.add('bg-red-300', 'text-slate-900');
    } else {
      selectEl.classList.add('bg-slate-50', 'text-slate-700');
      displayEl.classList.add('bg-slate-50', 'text-slate-700');
    }
  }

  function updateStatusAndNotes(ctx) {
    const pubInput = document.getElementById('edl-note-pub');
    const privInput = document.getElementById('edl-note-priv');
    const statusContainer = document.getElementById('global-status-container');
    const statusSelect = document.getElementById('edl-status-select');

    pubInput.value = '';
    privInput.value = '';
    statusSelect.value = '';

    document.getElementById('private-note-container').classList.toggle('hidden', ctx.isClientViewActive);
    if (!ctx.activeId) return;

    const isWholeLevel = String(ctx.activeId).startsWith('GLOBAL_');

    if (isWholeLevel) {
      statusContainer.classList.add('hidden');
      const notesRow = (rawData.edlNotes || []).find(r => String(r.ID) === String(ctx.activeId));
      if (notesRow && notesRow['Général']) {
        try {
          const parsed = JSON.parse(notesRow['Général']);
          pubInput.value = parsed.pub || '';
          privInput.value = parsed.priv || '';
        } catch (e) { console.error("Parse error:", e); }
      }
    } else if (ctx.roomName === 'all' || ctx.currentView !== 'locataires') {
      statusContainer.classList.remove('hidden');
      const planData = (rawData.planning && rawData.planning[ctx.activeId]) ? rawData.planning[ctx.activeId] : null;
      if (planData) {
        statusSelect.value = planData.status || '';
        pubInput.value = planData.note || '';
        privInput.value = planData.privateNote || '';
      }
      applyStatusSelectColor(statusSelect);
    } else {
      statusContainer.classList.add('hidden');
      const notesRow = (rawData.edlNotes || []).find(r => String(r.ID) === String(ctx.activeId));
      if (notesRow && notesRow[ctx.roomName]) {
        try {
          const parsed = JSON.parse(notesRow[ctx.roomName]);
          pubInput.value = parsed.pub || '';
          privInput.value = parsed.priv || '';
        } catch (e) { console.error("Parse error:", e); }
      }
    }
  }

  function saveCurrentNotesInBackground(ctx) {
    if (!ctx.activeId) return;
    const roomSelect = document.getElementById('room-select');
    const isGlobal = (roomSelect.value === 'all' || roomSelect.value === '' || ctx.currentView !== 'locataires');
    const isWholeLevel = String(ctx.activeId).startsWith('GLOBAL_');

    const roomName = (isWholeLevel || isGlobal) ? 'Général' : roomSelect.value;
    const payload = {
      id: ctx.activeId,
      room: roomName,
      isGlobal: isGlobal,
      isWholeLevel: isWholeLevel,
      pubNote: document.getElementById('edl-note-pub').value.trim(),
      privNote: document.getElementById('edl-note-priv').value.trim(),
      status: (isGlobal && !isWholeLevel) ? document.getElementById('edl-status-select').value : null
    };

    google.script.run
      .withSuccessHandler(() => {
        if (isGlobal && !isWholeLevel) {
          if (!rawData.planning) rawData.planning = {};
          rawData.planning[ctx.activeId] = { status: payload.status, note: payload.pubNote, privateNote: payload.privNote };
        } else {
          let notesRow = rawData.edlNotes.find(r => String(r.ID) === String(ctx.activeId));
          if (!notesRow) {
            notesRow = { ID: ctx.activeId };
            rawData.edlNotes.push(notesRow);
          }
          notesRow[roomName] = JSON.stringify({ pub: payload.pubNote, priv: payload.privNote });
        }
        showToast('Sauvegarde auto...', 'success', '', 1000);
      })
      .withFailureHandler((err) => {
        console.error("Auto-save failed:", err.message);
      })
      .saveEDLNotesData(APP_DATA.token, APP_DATA.projectId, payload);
  }

  function updatePhotos(ctx) {
    const grid = document.getElementById('photo-gallery-grid');
    if (!grid) return;
    grid.innerHTML = '';

    if (!ctx.activeId || !photoCache[ctx.activeId] || !photoCache[ctx.activeId][ctx.roomName]) {
      grid.innerHTML = '<p class="text-xs text-slate-400 italic col-span-full">Aucune photo pour cette sélection.</p>';
      return;
    }

    const photos = photoCache[ctx.activeId][ctx.roomName];
    if (!Array.isArray(photos)) return;

    let htmlContent = '';
    photos.forEach(p => {
      if (!p || !p.driveId) return;
      const imgUrl = 'https://lh3.googleusercontent.com/d/' + p.driveId;
      htmlContent +=
        '<div class="relative group aspect-square bg-slate-100 rounded-lg overflow-hidden border border-slate-200">' +
           '<img src="' + imgUrl + '" class="w-full h-full object-cover" />' +
           '<button class="absolute top-1 right-1 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">' +
             '<span class="material-symbols-outlined !text-[14px]">delete</span>' +
           '</button>' +
        '</div>';
    });
    grid.innerHTML = htmlContent || '<p class="text-xs text-slate-400 italic col-span-full">Aucune photo pour cette sélection.</p>';
  }

  function bindPhotoUpload(container) {
    const dropzone = container.querySelector('#photo-dropzone');
    const fileInput = container.querySelector('#photo-upload-input');
    if (!dropzone || !fileInput) return;

    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const scale = 800 / img.width;
          canvas.width = 800;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

          const base64Data = canvas.toDataURL('image/webp', 0.8).split(',')[1];
          const activeId = selectionState.selectedItem.id;
          const room = document.getElementById('room-select').value;

          google.script.run
            .withSuccessHandler((response) => {
              if (!photoCache[activeId]) photoCache[activeId] = {};
              if (!photoCache[activeId][room]) photoCache[activeId][room] = [];
              photoCache[activeId][room].push(response);

              updatePhotos(WorkspaceCore.buildContext());
              showToast('Photo ajoutée !', 'success');
            })
            .uploadEDLPhoto(activeId, room, file.name, base64Data, 'image/webp');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function mount(container) {
    if (window.unlockRoomDropdown) window.unlockRoomDropdown();

    container.classList.add('flex', 'flex-col', 'gap-6', 'max-w-3xl', 'mx-auto', 'pb-10');
    container.innerHTML = `
      <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
        <h3 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2">
          <span class="material-symbols-outlined text-primary !text-[18px]">edit_note</span> État & Notes
        </h3>

        <div id="global-status-container" class="mb-4 pb-4 border-b border-slate-100">
          <label class="text-[10px] font-black text-slate-400 uppercase ml-1 block mb-1">Statut Global (Appartement)</label>
          <select id="edl-status-select" class="status-select-input w-full px-4 py-2 rounded-xl border-slate-200 focus:ring-primary text-sm font-bold text-slate-700 bg-slate-50 transition-colors">
            <option value="">Aucun</option>
            <option value="Info" class="bg-blue-500 text-white">Info</option>
            <option value="Attention" class="bg-orange-400 text-slate-900">Attention</option>
            <option value="Bloquant" class="bg-red-300 text-slate-900">Bloquant</option>
          </select>
          <div id="edl-status-display" class="status-display-badge hidden px-4 py-2 rounded-xl text-sm font-bold border border-transparent"></div>
        </div>

        <div class="space-y-4">
          <div>
            <label class="text-[10px] font-black text-slate-400 uppercase ml-1 block mb-1">Note</label>
            <textarea id="edl-note-pub" rows="2" class="w-full px-4 py-2 rounded-xl border-slate-200 focus:ring-primary text-xs font-medium text-slate-700 resize-none bg-slate-50 edit-only-ui-input" placeholder="Ajouter une remarque visible par le client..."></textarea>
          </div>
          <div id="private-note-container">
            <label class="text-[10px] font-black text-rose-400 uppercase ml-1 mb-1 flex items-center gap-1">
              <span class="material-symbols-outlined !text-[14px]">lock</span> Note Privée
            </label>
            <textarea id="edl-note-priv" rows="2" class="w-full px-4 py-2 rounded-xl border-rose-200 focus:ring-rose-500 bg-rose-50/30 text-xs font-medium text-slate-700 resize-none edit-only-ui-input" placeholder="Remarque à usage interne uniquement..."></textarea>
          </div>
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
        <h3 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2">
          <span class="material-symbols-outlined text-primary !text-[18px]">photo_library</span> Photos
        </h3>

        <div id="photo-dropzone" class="edit-only-ui border-2 border-dashed border-slate-300 rounded-xl p-6 flex flex-col items-center justify-center text-slate-400 bg-slate-50 hover:bg-primary-light hover:border-primary hover:text-primary transition-colors cursor-pointer mb-4">
          <span class="material-symbols-outlined !text-3xl mb-1">add_a_photo</span>
          <p class="text-[11px] font-bold uppercase tracking-widest text-center">Ajouter une photo</p>
          <p class="text-[10px] mt-1 font-medium">Glisser-déposer ou cliquer (PNG, JPG, WEBP)</p>
        </div>

        <input type="file" id="photo-upload-input" class="hidden" accept="image/png, image/jpeg, image/webp" />

        <div id="photo-gallery-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-3">
          <p class="text-xs text-slate-400 italic col-span-full">Aucune photo pour cette sélection.</p>
        </div>
      </div>
    `;

    document.getElementById('edl-status-select').addEventListener('change', function (e) {
      applyStatusSelectColor(e.target);
      saveCurrentNotesInBackground(WorkspaceCore.buildContext());
    });
    document.getElementById('edl-note-pub').addEventListener('blur', () => saveCurrentNotesInBackground(WorkspaceCore.buildContext()));
    document.getElementById('edl-note-priv').addEventListener('blur', () => saveCurrentNotesInBackground(WorkspaceCore.buildContext()));

    bindPhotoUpload(container);
  }

  function render(ctx) {
    updateStatusAndNotes(ctx);
    updatePhotos(ctx);
  }

  WorkspaceCore.registerLayer('edl', {
    label: 'EDL',
    layoutMode: 'data-entry',
    mount: mount,
    render: render,
    onExitEditMode: function (ctx) {
      saveCurrentNotesInBackground(ctx);
    },
    onBaseDataLoaded: function () {
      google.script.run
        .withSuccessHandler(photos => initPhotoCache(photos || []))
        .withFailureHandler(err => {
          appErrorLog(err, "getEDLPhotosData", { projectId: APP_DATA.projectId });
        })
        .getEDLPhotosData();
    }
  });

})();


(function () {
  'use strict';

  // =========================================================
  // TRAVAUX LAYER  —  registers itself as layer id 'travaux'
  // =========================================================
  // Extracted out of EDL_Layer_Scripts.html into its own file, matching the
  // one-file-per-layer convention the other layer scaffolds already use.
  //
  // CHANGES vs. the embedded version, see chat for the full why:
  //
  //  1. onBaseDataLoaded no longer makes its own getTravauxConfigData() call
  //     (the old 'Travaux_Config'/row-1 sheet). It now reads rawData.travauxConfig
  //     directly — already fetched once at page load via getTravauxConfigDataHelper
  //     ('Config Travaux', row 6 / column B) — so the checklist config now
  //     actually comes from the sheet you described, with no extra round-trip.
  //
  //  2. The checklist's saved values now come from rawData.travauxDonnees
  //     ('Données Travaux') via saveWorkItemValuesForRoom/
  //     getSavedWorkValuesForRoom, instead of being folded into
  //     Travaux_Notes' payload.values. Travaux_Notes goes back to being just
  //     the public/private note + global status — saveCurrentNotesInBackground
  //     is otherwise untouched.
  //
  //  3. FIXED a pre-existing bug while touching this code: the whole-level/
  //     "Général" room key was inconsistent — saveCurrentNotesInBackground
  //     and updateStatusAndNotes both used 'Général' (with the accent), but
  //     updateWorkItemsChecklist read back 'General' (without it), so a
  //     whole-level item's saved value could never actually be found again.
  //     Standardized on 'Général' everywhere below.
  //
  //  4. "Détails de champ" is now parsed instead of dumped as reference
  //     text: semicolon-separated Label:Type pairs (e.g.
  //     "Couleur:Dropdown;Quantité:Nombre") render as real extra inputs
  //     alongside the row's primary field, with "Options" split the same
  //     way (one ';'-block per field, in the same order). A row with no
  //     ':' in Détails de champ, or left blank, behaves exactly as before.
  //
  //  5. NEW renderPlanPanel(ctx, wrapperEl) — populates the LEFT-side
  //     plan-container with a live, printable recap of every saved work
  //     item for the current ID, grouped by "Sous catégorie" (parsed as
  //     "Nom|Ordre" — the format that column was already reserved for).
  //     Registered via the new optional Core hook of the same name; see
  //     Workspace_Core_Scripts.html. Includes an "Imprimer" button using
  //     the #print-root convention added to Workspace.html's stylesheet.
  //
  //  6. NEW — the Pièce dropdown (#room-select) is now frozen while Travaux
  //     is active, exactly like the Réserves layer already does it (see
  //     lockRoomDropdown(), copied from Réserves_Scripts.html's mount()/
  //     renderInterventionsList()). Instead of picking one room at a time
  //     from that dropdown, EVERY room for the current selection renders as
  //     its own scrollable card, stacked top to bottom inside
  //     #travaux-rooms-container (#dynamic-panel-content already scrolls,
  //     nothing new needed there) — see buildRoomScopes()/buildRoomCardHtml().
  //     A fixed "Toutes les pièces" card (storage key 'Général', same as
  //     before) always renders first, followed by one card per specific
  //     room (sourced from #room-select's own options so the room list stays
  //     in sync with populateRoomOrPartie()'s configLogement lookup).
  //     collectWorkItemValues()/saveWorkItemValuesForRoom() are now scoped
  //     per-card (via each card's [data-room-worklist] attribute) instead of
  //     reading/saving one shared container under whatever room happened to
  //     be selected in the dropdown.

  // ---------------------------------------------------------
  // WORK-ITEMS CHECKLIST (driven by the "Config Travaux" sheet)
  // ---------------------------------------------------------
  let travauxConfig = [];

  // Splits a comma-separated sheet cell into a clean array, e.g.
  // "Cuisine, Sejour" -> ["Cuisine", "Sejour"]. Used for "Pieces
  // Applicables" and for each ';'-separated block of "Options".
  function splitList(str) {
    return String(str || '').split(',').map(s => s.trim()).filter(Boolean);
  }

  // Maps the sheet's "Cible" wording (Locataires / Commun / Facades) onto
  // this app's internal view keys (locataires / communs / facades), so a
  // config row written in French matches ctx.currentView directly.
  function normalizeView(cible) {
    const v = String(cible || '').trim().toLowerCase();
    if (v.startsWith('local')) return 'locataires';
    if (v.startsWith('commun')) return 'communs';
    if (v.startsWith('facade')) return 'facades';
    return v; // unrecognized value: pass through rather than silently hide the row
  }

  // "Détails de champ" convention: semicolon-separated Label:Type pairs
  // describing EXTRA inputs beyond the row's primary "Type de Champ" field,
  // e.g. "Couleur:Dropdown;Quantité:Nombre". Blank -> no extra fields. A
  // segment with no ':' becomes a plain "texte" field labeled with whatever
  // text is there (covers old free-text rows without crashing on them).
  function parseDetailsChamp(raw) {
    const str = String(raw || '').trim();
    if (!str) return [];
    return str.split(';').map(function (part) {
      const idx = part.indexOf(':');
      if (idx === -1) return { label: part.trim(), type: 'texte' };
      return { label: part.slice(0, idx).trim(), type: part.slice(idx + 1).trim().toLowerCase() };
    }).filter(function (f) { return f.label; });
  }

  function initTravauxConfigCache(rows) {
    travauxConfig = (rows || []).map(r => {
      // "Sous catégorie" convention: "Nom|Ligne|Logo".
      //  - Nom   : box name — the LEFT-panel recap groups by this. Box-to-
      //            box order is no longer a number stored here: it just
      //            follows sheet order (whichever Nom is seen first, top
      //            to bottom), same convention groupWorkItemsByDiscipline()
      //            already uses for Discipline below.
      //  - Ligne : this row's position *inside* its box in the recap (sort
      //            key only — gaps are fine, nothing needs to be
      //            contiguous; ties just fall back to sheet order).
      //  - Logo  : Material Symbols icon name shown next to this row in
      //            the recap. Consecutive rows in the same box that share
      //            a Logo are grouped under one shared icon. Optional —
      //            blank means no icon for that row.
      // Old 2-part "Nom|Ordre" rows still parse fine: that number is just
      // read as Ligne now, and Logo comes back blank.
      const scParts = String(r.sousCategorie || '').split('|');
      const extraFields = parseDetailsChamp(r.detailsChamp);
      // First ';'-block of Options belongs to the primary field (exactly
      // what a plain splitList(r.options) would have given before this
      // change, for any row with no ';' in Options); each block after that
      // aligns positionally with extraFields.
      const optionBlocks = String(r.options || '').split(';').map(splitList);

      return {
        idWork: r.idWork,
        cible: normalizeView(r.cible),
        sousCategorieNom: (scParts[0] || 'Autres').trim() || 'Autres',
        sousCategorieLigne: scParts.length > 1 ? (parseFloat(scParts[1]) || 0) : 0,
        logo: (scParts[2] || '').trim(),
        discipline: r.discipline || 'Autres',
        typeTravail: r.typeTravail || r.idWork,
        piecesApplicables: splitList(r.piecesApplicables),
        typeChamp: String(r.typeChamp || '').trim(),
        extraFields: extraFields,
        options: optionBlocks[0] || [],
        extraOptions: optionBlocks.slice(1)
      };
    });
  }

  // Work items that apply to the view + room currently being edited.
  function getApplicableWorkItems(ctx, roomName) {
    return travauxConfig.filter(item => {
      if (item.cible && item.cible !== ctx.currentView) return false;
      if (item.piecesApplicables.length === 0) return true; // no restriction -> applies everywhere
      // Accepts any French "all" form written in the sheet (Tout / Toute / Tous / Toutes).
      if (item.piecesApplicables.some(p => p.toLowerCase().startsWith('tout'))) return true;
      return item.piecesApplicables.some(p => p.toLowerCase() === String(roomName || '').toLowerCase());
    });
  }

  // Groups items by Discipline, preserving the sheet's row order (both
  // across groups and within each group) instead of sorting alphabetically.
  // Used for the RIGHT-side checklist.
  function groupWorkItemsByDiscipline(items) {
    const groups = [];
    const index = {};
    items.forEach(item => {
      const key = item.discipline || 'Autres';
      if (!index[key]) {
        index[key] = { discipline: key, items: [] };
        groups.push(index[key]);
      }
      index[key].items.push(item);
    });
    return groups;
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------------------------------------------------------------------
  // ADMIN — "Config Travaux" CRUD MANAGER  (list / add / edit / delete)
  // ---------------------------------------------------------------------
  // Opened via the "Config Travaux" button beside "Mode Édition" (admin
  // only — visibility + click wiring live in Workspace_Core_Scripts.html's
  // setupAdminConfigTravauxButton(); this file only needs to expose
  // window.openTravauxConfigManager for that button to call).
  //
  // Operates on rawData.travauxConfig — the RAW sheet-shaped rows
  // (idWork/cible/sousCategorie/discipline/typeTravail/piecesApplicables/
  // typeChamp/detailsChamp/options, exactly Config Travaux's columns B..J)
  // — NOT the already-parsed `travauxConfig` array above (that one's
  // shaped for rendering the checklist, not for round-tripping back to the
  // sheet). Every successful save/delete gets the fresh full row list back
  // from the server, which both replaces rawData.travauxConfig AND re-runs
  // initTravauxConfigCache() on it, so the checklist (right panel, if
  // Travaux is the active layer) updates immediately with no page reload —
  // same "keep the local cache in sync" pattern saveWorkItemValuesForRoom
  // already uses above.
  //
  // The view selector (Locataires / Commun / Facades) at the top of the
  // popup only filters what THIS manager shows — it's independent of
  // window.currentView (the app's own tab), though it defaults to whatever
  // that currently is, since that's almost always what an admin sitting on
  // a given tab wants to manage first.

  const CTM_VIEWS = [
    { key: 'locataires', label: 'LOCATAIRES', cible: 'Locataires' },
    { key: 'communs',    label: 'COMMUNS',    cible: 'Commun' },
    { key: 'facades',    label: 'FACADES',    cible: 'Facades' }
  ];

  function ctmCibleForView(viewKey) {
    const v = CTM_VIEWS.filter(function (v) { return v.key === viewKey; })[0];
    return v ? v.cible : 'Locataires';
  }

  // ---- List view -------------------------------------------------------

  function ctmBuildHeaderHtml(activeViewKey) {
    return (
      '<div class="flex items-center justify-between gap-3 mb-4">' +
        '<div class="flex bg-slate-200/50 p-1 rounded-xl w-fit shadow-inner border border-slate-300/50">' +
          CTM_VIEWS.map(function (v) {
            const isActive = (v.key === activeViewKey);
            return '<button type="button" class="ctm-view-tab px-5 py-1.5 rounded-lg text-[11px] font-black transition-all ' +
                   (isActive ? 'bg-white shadow-sm text-primary' : 'text-slate-600 hover:text-primary') +
                   '" data-view="' + v.key + '">' + v.label + '</button>';
          }).join('') +
        '</div>' +
        '<button type="button" id="ctm-add-btn" class="flex items-center gap-1 px-3 py-1.5 bg-primary text-white rounded-xl text-[11px] font-black uppercase hover:bg-primary-dark transition-colors shadow-sm shrink-0">' +
          '<span class="material-symbols-outlined !text-[16px]">add</span> Ajouter' +
        '</button>' +
      '</div>'
    );
  }

  function ctmBuildRowHtml(row) {
    const scParts = String(row.sousCategorie || '').split('|');
    const sub = (scParts[0] || '').trim();
    const logo = (scParts[2] || '').trim();
    const pieces = splitList(row.piecesApplicables);
    const piecesLabel = pieces.length ? pieces.join(', ') : 'Toutes les pièces';
    return (
      '<div class="flex items-center justify-between gap-3 px-4 py-2.5 hover:bg-slate-50 transition-colors" data-ctm-row="' + escapeHtml(row.idWork) + '">' +
        '<div class="flex items-center gap-2.5 min-w-0 flex-1">' +
          (logo ? '<span class="material-symbols-outlined !text-[16px] text-primary shrink-0">' + escapeHtml(logo) + '</span>' : '') +
          '<div class="min-w-0">' +
            '<p class="text-xs font-bold text-slate-700 truncate">' + escapeHtml(row.typeTravail || row.idWork) + '</p>' +
            '<p class="text-[10px] text-slate-400 truncate">' +
              (sub ? escapeHtml(sub) + ' · ' : '') + escapeHtml(row.typeChamp || '—') + ' · ' + escapeHtml(piecesLabel) +
            '</p>' +
          '</div>' +
        '</div>' +
        '<div class="flex items-center gap-1 shrink-0">' +
          '<button type="button" class="ctm-edit-btn w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-primary hover:bg-primary-light transition-colors" title="Modifier">' +
            '<span class="material-symbols-outlined !text-[16px]">edit</span>' +
          '</button>' +
          '<button type="button" class="ctm-delete-btn w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors" title="Supprimer">' +
            '<span class="material-symbols-outlined !text-[16px]">delete</span>' +
          '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function ctmBuildListHtml(rows, viewKey) {
    const filtered = (rows || []).filter(function (r) { return normalizeView(r.cible) === viewKey; });
    if (filtered.length === 0) {
      return '<p class="text-xs text-slate-400 italic text-center py-10">Aucun poste de travaux pour cette vue. Cliquez sur « Ajouter » pour en créer un.</p>';
    }

    // Grouped by Discipline, sheet order preserved — same convention as
    // groupWorkItemsByDiscipline() above (the checklist itself).
    const groups = [];
    const index = {};
    filtered.forEach(function (row) {
      const key = row.discipline || 'Autres';
      if (!index[key]) { index[key] = { discipline: key, rows: [] }; groups.push(index[key]); }
      index[key].rows.push(row);
    });

    return groups.map(function (g) {
      return (
        '<div class="mb-4 last:mb-0">' +
          '<h4 class="text-[10px] font-black text-primary uppercase tracking-widest mb-1.5 px-1">' + escapeHtml(g.discipline) + '</h4>' +
          '<div class="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden bg-white">' +
            g.rows.map(ctmBuildRowHtml).join('') +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function openTravauxConfigManager(initialView) {
    const validKeys = CTM_VIEWS.map(function (v) { return v.key; });
    const state = {
      view: (initialView && validKeys.indexOf(initialView) !== -1) ? initialView
          : (validKeys.indexOf(window.currentView) !== -1 ? window.currentView : 'locataires')
    };

    function currentRows() { return rawData.travauxConfig || []; }

    function bindHeaderEvents() {
      document.querySelectorAll('.ctm-view-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.view = btn.dataset.view;
          renderBody();
        });
      });
      const addBtn = document.getElementById('ctm-add-btn');
      if (addBtn) addBtn.addEventListener('click', function () {
        openTravauxConfigRowForm(null, state.view);
      });
    }

    function bindRowEvents() {
      document.querySelectorAll('.ctm-edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const idWork = btn.closest('[data-ctm-row]').dataset.ctmRow;
          const row = currentRows().filter(function (r) { return String(r.idWork) === String(idWork); })[0];
          if (row) openTravauxConfigRowForm(row, state.view);
        });
      });
      document.querySelectorAll('.ctm-delete-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const idWork = btn.closest('[data-ctm-row]').dataset.ctmRow;
          const row = currentRows().filter(function (r) { return String(r.idWork) === String(idWork); })[0];
          if (row) confirmAndDeleteTravauxConfigRow(row, state.view);
        });
      });
    }

    function renderBody() {
      const headerEl = document.getElementById('ctm-header');
      const listEl = document.getElementById('ctm-list');
      if (!headerEl || !listEl) return;
      headerEl.innerHTML = ctmBuildHeaderHtml(state.view);
      listEl.innerHTML = ctmBuildListHtml(currentRows(), state.view);
      bindHeaderEvents();
      bindRowEvents();
    }

    Swal.fire({
      title: '<div class="text-lg font-black text-slate-800 text-left">Gérer les postes de travaux</div>' +
             '<div class="text-[11px] font-medium text-slate-400 text-left mt-0.5">Config Travaux — ajoutez, modifiez ou supprimez les postes proposés dans la checklist Travaux.</div>',
      html: '<div id="ctm-header" class="text-left"></div><div id="ctm-list" class="text-left max-h-[50vh] overflow-y-auto pr-1"></div>',
      width: '640px',
      showConfirmButton: false,
      showCloseButton: true,
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' },
      didOpen: renderBody
    });
  }

  // ---- Add / edit form ---------------------------------------------------

  function openTravauxConfigRowForm(existingRow, defaultViewKey) {
    const isNew = !existingRow;
    const row = existingRow || {
      idWork: '', cible: ctmCibleForView(defaultViewKey), sousCategorie: '', discipline: '',
      typeTravail: '', piecesApplicables: '', typeChamp: 'Texte', detailsChamp: '', options: ''
    };

    const scParts = String(row.sousCategorie || '').split('|');
    const scNom = (scParts[0] || '').trim();
    const scLigne = scParts.length > 1 ? scParts[1].trim() : '';
    const scLogo = scParts.length > 2 ? scParts[2].trim() : '';
    // Normalized starting Ligne — lets the checks below tell "still this
    // row's own original (Sous-catégorie, Ligne) pair" apart from an
    // actually new choice (see computeUsedLignes usage further down).
    const originalLigneNum = scLigne === '' ? 0 : (parseFloat(scLigne) || 0);

    const rawTypeChamp = String(row.typeChamp || '').trim();
    const typeChampNorm = /^checkbox$/i.test(rawTypeChamp) ? 'Checkbox'
                         : /menu d.roulant/i.test(rawTypeChamp) ? 'Menu Deroulant'
                         : 'Texte';
    const primaryOptions = String(row.options || '').split(';')[0] || '';

    // Datalist suggestions only — freeform typing always still works. Pulled
    // from data already loaded client-side, no extra server round-trip.
    const knownDisciplines = [];
    travauxConfig.forEach(function (i) { if (i.discipline && knownDisciplines.indexOf(i.discipline) === -1) knownDisciplines.push(i.discipline); });
    const knownRooms = [];
    (rawData.configLogement || []).forEach(function (cfg) {
      Object.keys(cfg).forEach(function (k) { if (k !== 'configLogement' && knownRooms.indexOf(k) === -1) knownRooms.push(k); });
    });
    knownRooms.sort(function (a, b) { return a.localeCompare(b, 'fr'); });
    // Same "suggestions, not a hard list" convention as knownDisciplines
    // above — existing Sous-catégorie box names show up as suggestions, but
    // typing a genuinely new one still works fine (req. 1).
    const knownSousCategories = [];
    travauxConfig.forEach(function (i) { if (i.sousCategorieNom && knownSousCategories.indexOf(i.sousCategorieNom) === -1) knownSousCategories.push(i.sousCategorieNom); });

    // "Pièces applicables" starting state: the "Toutes..." wildcard, or a
    // list of named rooms drawn from knownRooms (see getApplicableWorkItems
    // / resolveRecapEntries above for how each is used downstream). Both
    // Sous-catégorie and room selection are now required fields (see
    // preConfirm below), so there's no more blank/"Général" starting state
    // for a row saved through this form.
    const initialPieces = splitList(row.piecesApplicables);
    const initialPiecesWildcard = initialPieces.some(function (p) { return p.toLowerCase().startsWith('tout'); });
    const initialPiecesRooms = initialPiecesWildcard ? [] : initialPieces.filter(function (p) { return knownRooms.indexOf(p) !== -1; });

    // Rows that would land in the same recap box as whatever's currently
    // typed (same Sous-catégorie name AND same Cible — groupConfigForRecap()
    // above groups by that exact pair, so that's the scope a collision
    // actually matters in). Returns the Ligne numbers already taken among
    // them; excludes this row itself so its own saved Ligne never collides
    // with itself (req. 3).
    function computeUsedLignes(sousCategorieNomTrimmed, cibleRaw) {
      const cibleKey = normalizeView(cibleRaw);
      return travauxConfig
        .filter(function (item) {
          if (existingRow && String(item.idWork) === String(existingRow.idWork)) return false;
          if (item.cible !== cibleKey) return false;
          return item.sousCategorieNom === sousCategorieNomTrimmed;
        })
        .map(function (item) { return item.sousCategorieLigne; });
    }

    const html = `
      <div class="flex flex-col gap-3 mt-1 text-left">
        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">ID Work ${isNew ? '<span class="text-red-500">*</span>' : ''}</label>
          <input id="ctm-idwork" type="text" value="${escapeHtml(row.idWork)}" ${isNew ? '' : 'readonly'} placeholder="Laisser vide pour générer automatiquement"
            class="w-full rounded-lg text-sm px-3 py-2 border ${isNew ? 'border-slate-300 focus:border-primary focus:ring focus:ring-primary/30' : 'border-slate-100 bg-slate-50 text-slate-400 cursor-not-allowed'}" />
          <p class="text-[10px] text-slate-400 mt-1">${isNew
            ? 'Cet identifiant relie ce poste aux réponses enregistrées dans « Données Travaux » — il ne sera plus modifiable une fois créé.'
            : 'Non modifiable : cet identifiant relie ce poste aux réponses déjà enregistrées dans « Données Travaux ».'}</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Cible (vue) *</label>
            <select id="ctm-cible" class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30">
              ${CTM_VIEWS.map(function (v) { return '<option value="' + v.cible + '" ' + (normalizeView(row.cible) === v.key ? 'selected' : '') + '>' + v.cible + '</option>'; }).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Discipline *</label>
            <input id="ctm-discipline" type="text" list="ctm-discipline-list" value="${escapeHtml(row.discipline)}" placeholder="ex: Peinture"
              class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
            <datalist id="ctm-discipline-list">${knownDisciplines.map(function (d) { return '<option value="' + escapeHtml(d) + '">'; }).join('')}</datalist>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Type de Travail (libellé affiché) *</label>
          <input id="ctm-typetravail" type="text" value="${escapeHtml(row.typeTravail)}" placeholder="ex: Peinture des murs"
            class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Sous-catégorie *</label>
            <input id="ctm-souscategorie-nom" type="text" list="ctm-souscategorie-list" value="${escapeHtml(scNom)}" placeholder="ex: Plomberie WC"
              class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
            <datalist id="ctm-souscategorie-list">${knownSousCategories.map(function (s) { return '<option value="' + escapeHtml(s) + '">'; }).join('')}</datalist>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Ligne *</label>
            <input id="ctm-souscategorie-ligne" type="number" step="1" min="1" value="${escapeHtml(scLigne)}" placeholder="1" ${scNom ? '' : 'disabled'}
              class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30 disabled:bg-slate-50 disabled:text-slate-300 disabled:cursor-not-allowed" />
          </div>
        </div>
        <p id="ctm-ligne-hint" class="text-[10px] text-slate-400 -mt-2">Renseignez d'abord une Sous-catégorie pour pouvoir choisir une Ligne.</p>
        <p class="text-[10px] text-slate-400 -mt-2">« Sous-catégorie » regroupe ce poste avec les autres du même encadré dans la fiche récap (imprimable) ; les encadrés eux-mêmes suivent l'ordre des lignes dans la feuille. « Ligne » choisit la position de CE poste à l'intérieur de son encadré — un nombre entier positif (1, 2, 3…), obligatoire, et deux postes d'une même Sous-catégorie ne peuvent pas partager la même Ligne.</p>

        <div class="flex items-end gap-3">
          <div class="flex-1">
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Icône (recap)</label>
            <input id="ctm-souscategorie-logo" type="text" value="${escapeHtml(scLogo)}" placeholder="ex: wc, bathtub, plumbing"
              class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
          </div>
          <div id="ctm-logo-preview" class="w-10 h-10 shrink-0 rounded-lg bg-primary-light text-primary flex items-center justify-center">
            <span class="material-symbols-outlined !text-[20px]">${escapeHtml(scLogo || 'help_outline')}</span>
          </div>
        </div>

        <p class="text-[10px] text-slate-400 -mt-2">Optionnel — nom d'icône <a href='https://fonts.google.com/icons?icon.set=Material+Symbols' target='_blank' rel='noopener' class='text-primary underline'>Material Symbols</a> (ex: wc, bathtub, plumbing, format_paint). Vide = pas d'icône pour ce poste dans la fiche récap. Deux postes consécutifs avec la même icône partagent un seul pictogramme dans la fiche.</p>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Pièces applicables *</label>
          <label class="flex items-center gap-2 mb-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 cursor-pointer">
            <input id="ctm-pieces-toutes" type="checkbox" ${initialPiecesWildcard ? 'checked' : ''} class="rounded border-slate-300 text-primary focus:ring-primary/30" />
            <span class="text-xs font-bold text-slate-600">Toutes les pièces (une ligne par pièce existante du logement)</span>
          </label>
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-2 mb-1">Liste des pièces</p>
          <div id="ctm-pieces-rooms" class="w-full grid grid-cols-2 gap-x-3 gap-y-1 max-h-32 overflow-y-auto border border-slate-200 rounded-lg p-2">
            ${knownRooms.length ? knownRooms.map(function (r) {
              return '<label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">' +
                '<input type="checkbox" class="ctm-piece-checkbox rounded border-slate-300 text-primary focus:ring-primary/30" value="' + escapeHtml(r) + '" ' + (initialPiecesRooms.indexOf(r) !== -1 ? 'checked' : '') + ' /> ' +
                escapeHtml(r) +
              '</label>';
            }).join('') : '<p class="text-[11px] text-slate-400 italic col-span-2">Aucune pièce connue (Config Logement vide).</p>'}
          </div>
          <p class="text-[10px] text-slate-400 mt-1">Plusieurs pièces peuvent être cochées à la fois. Cochez au moins une pièce, ou « Toutes les pièces ».</p>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Type de champ *</label>
          <select id="ctm-typechamp" class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30">
            <option value="Checkbox" ${typeChampNorm === 'Checkbox' ? 'selected' : ''}>Case à cocher</option>
            <option value="Menu Deroulant" ${typeChampNorm === 'Menu Deroulant' ? 'selected' : ''}>Menu déroulant</option>
            <option value="Texte" ${typeChampNorm === 'Texte' ? 'selected' : ''}>Texte libre</option>
          </select>
        </div>

        <div id="ctm-options-wrap" class="hidden">
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Options du menu (séparées par des virgules)</label>
          <input id="ctm-options" type="text" value="${escapeHtml(primaryOptions)}" placeholder="ex: Bon, Moyen, Mauvais"
            class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
        </div>

        <details class="mt-1">
          <summary class="text-[10px] font-black text-slate-400 uppercase tracking-wider cursor-pointer select-none">Champs supplémentaires (avancé)</summary>
          <div class="mt-2">
            <input id="ctm-detailschamp" type="text" value="${escapeHtml(row.detailsChamp)}" placeholder="ex: Couleur:Dropdown;Quantité:Nombre"
              class="w-full rounded-lg text-sm px-3 py-2 border border-slate-300 focus:border-primary focus:ring focus:ring-primary/30" />
            <p class="text-[10px] text-slate-400 mt-1">Format : Libellé:Type, plusieurs champs séparés par « ; ». Laisser vide s'il n'y a pas de champ supplémentaire.</p>
          </div>
        </details>
      </div>
    `;

    Swal.fire({
      title: isNew ? 'Ajouter un poste de travaux' : ('Modifier « ' + escapeHtml(row.typeTravail || row.idWork) + ' »'),
      html: html,
      width: '560px',
      showCancelButton: true,
      confirmButtonText: isNew ? 'Ajouter' : 'Enregistrer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#0d59f2',
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' },
      didOpen: () => {
        const typeChampSelect = document.getElementById('ctm-typechamp');
        const optionsWrap = document.getElementById('ctm-options-wrap');
        function syncOptionsVisibility() {
          optionsWrap.classList.toggle('hidden', typeChampSelect.value !== 'Menu Deroulant');
        }
        typeChampSelect.addEventListener('change', syncOptionsVisibility);
        syncOptionsVisibility();

        const logoInput = document.getElementById('ctm-souscategorie-logo');
        const logoPreviewIcon = document.querySelector('#ctm-logo-preview .material-symbols-outlined');
        logoInput.addEventListener('input', function () {
          logoPreviewIcon.textContent = logoInput.value.trim() || 'help_outline';
        });

        // "Toutes les pièces" disables the per-room checkboxes underneath —
        // they're mutually exclusive ways of filling the same underlying
        // field (see preConfirm below).
        const piecesToutesInput = document.getElementById('ctm-pieces-toutes');
        const piecesRoomsGrid = document.getElementById('ctm-pieces-rooms');
        function syncPiecesToutes() {
          const on = piecesToutesInput.checked;
          piecesRoomsGrid.classList.toggle('opacity-40', on);
          piecesRoomsGrid.classList.toggle('pointer-events-none', on);
          document.querySelectorAll('.ctm-piece-checkbox').forEach(function (cb) { cb.disabled = on; });
        }
        piecesToutesInput.addEventListener('change', syncPiecesToutes);
        syncPiecesToutes();

        // Ligne needs to know its Sous-catégorie first, so we know which
        // existing Lignes it would collide with — locked until Sous-
        // catégorie has a value, and re-locked (with its own value cleared)
        // if that's emptied back out. See computeUsedLignes() above and the
        // matching preConfirm checks below.
        const scNomInput = document.getElementById('ctm-souscategorie-nom');
        const cibleSelect = document.getElementById('ctm-cible');
        const ligneInput = document.getElementById('ctm-souscategorie-ligne');
        const ligneHint = document.getElementById('ctm-ligne-hint');

        function markLigneHint(text, isWarning) {
          ligneHint.textContent = text;
          ligneHint.classList.toggle('text-rose-500', isWarning);
          ligneHint.classList.toggle('text-slate-400', !isWarning);
        }

        function syncLigneState() {
          const nomTrimmed = scNomInput.value.trim();
          if (!nomTrimmed) {
            ligneInput.value = '';
            ligneInput.setAttribute('disabled', 'disabled');
            markLigneHint("Renseignez d'abord une Sous-catégorie pour pouvoir choisir une Ligne.", false);
            return;
          }
          ligneInput.removeAttribute('disabled');
          const rawVal = ligneInput.value.trim();
          const currentVal = rawVal === '' ? NaN : parseFloat(rawVal);
          if (rawVal === '' || isNaN(currentVal) || currentVal <= 0) {
            markLigneHint('La Ligne est obligatoire : un nombre entier positif (1, 2, 3…).', true);
            return;
          }
          const used = computeUsedLignes(nomTrimmed, cibleSelect.value);
          const pairUnchanged = !isNew && nomTrimmed === scNom && currentVal === originalLigneNum;
          const isDuplicate = !pairUnchanged && used.indexOf(currentVal) !== -1;
          if (isDuplicate) {
            markLigneHint('La ligne ' + currentVal + ' est déjà utilisée dans « ' + nomTrimmed + ' ». Choisissez-en une autre.', true);
          } else {
            markLigneHint(used.length
              ? ('Lignes déjà utilisées dans « ' + nomTrimmed + ' » : ' + used.slice().sort(function (a, b) { return a - b; }).join(', '))
              : ('Aucune ligne utilisée pour l\'instant dans « ' + nomTrimmed + ' ».'), false);
          }
        }
        scNomInput.addEventListener('input', syncLigneState);
        cibleSelect.addEventListener('change', syncLigneState);
        ligneInput.addEventListener('input', syncLigneState);
        syncLigneState();
      },
      preConfirm: () => {
        const idWorkInput = document.getElementById('ctm-idwork').value.trim();
        const typeTravail = document.getElementById('ctm-typetravail').value.trim();
        const discipline = document.getElementById('ctm-discipline').value.trim();
        const cible = document.getElementById('ctm-cible').value;
        const typeChamp = document.getElementById('ctm-typechamp').value;
        const scNomVal = document.getElementById('ctm-souscategorie-nom').value.trim();
        const scLigneVal = document.getElementById('ctm-souscategorie-ligne').value.trim();
        const scLogoVal = document.getElementById('ctm-souscategorie-logo').value.trim();
        const piecesToutes = document.getElementById('ctm-pieces-toutes').checked;
        const piecesRoomsChecked = Array.from(document.querySelectorAll('.ctm-piece-checkbox:checked')).map(function (el) { return el.value; });
        const pieces = piecesToutes ? 'Toutes' : piecesRoomsChecked.join(', ');
        const primaryOptionsVal = document.getElementById('ctm-options').value.trim();
        const detailsChampVal = document.getElementById('ctm-detailschamp').value.trim();

        if (!typeTravail) {
          Swal.showValidationMessage("Le « Type de Travail » (libellé affiché) est obligatoire.");
          return false;
        }
        if (!discipline) {
          Swal.showValidationMessage("La « Discipline » est obligatoire.");
          return false;
        }
        if (!scNomVal) {
          Swal.showValidationMessage("La « Sous-catégorie » est obligatoire.");
          return false;
        }
        const ligneNum = scLigneVal === '' ? NaN : parseFloat(scLigneVal);
        if (scLigneVal === '' || isNaN(ligneNum) || ligneNum <= 0) {
          Swal.showValidationMessage("La « Ligne » est obligatoire : un nombre positif supérieur à 0.");
          return false;
        }
        const pairUnchanged = !isNew && scNomVal === scNom && ligneNum === originalLigneNum;
        if (!pairUnchanged && computeUsedLignes(scNomVal, cible).indexOf(ligneNum) !== -1) {
          Swal.showValidationMessage('La ligne ' + ligneNum + ' est déjà utilisée dans la sous-catégorie « ' + scNomVal + ' ». Choisissez une autre valeur.');
          return false;
        }
        if (!piecesToutes && piecesRoomsChecked.length === 0) {
          Swal.showValidationMessage("Sélectionnez au moins une pièce dans « Pièces applicables », ou cochez « Toutes les pièces ».");
          return false;
        }
        if (typeChamp === 'Menu Deroulant' && !primaryOptionsVal) {
          Swal.showValidationMessage("Ajoutez au moins une option pour un menu déroulant.");
          return false;
        }

        const existingIdsLower = (rawData.travauxConfig || []).map(function (r) { return String(r.idWork).trim().toLowerCase(); });
        let idWork = idWorkInput;
        if (isNew) {
          if (!idWork) {
            let base = (discipline + '_' + typeTravail)
              .toLowerCase()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // strip accents
              .replace(/[^a-z0-9]+/g, '_')
              .replace(/^_+|_+$/g, '')
              .substring(0, 60);
            if (!base) base = 'poste';
            idWork = base;
            let suffix = 2;
            while (existingIdsLower.indexOf(idWork.toLowerCase()) !== -1) {
              idWork = base + '_' + suffix;
              suffix++;
            }
          } else if (existingIdsLower.indexOf(idWork.toLowerCase()) !== -1) {
            Swal.showValidationMessage("Cet ID Work existe déjà (\"" + idWork + "\"). Choisissez-en un autre.");
            return false;
          }
        }

        // This form only edits the PRIMARY field's options — preserve any
        // extra-field option blocks ("Détails de champ") the row already
        // had, untouched, rather than silently dropping them.
        const existingOptionBlocks = String((existingRow && existingRow.options) || '').split(';');
        const extraOptionBlocks = existingOptionBlocks.slice(1);
        const optionsOut = [primaryOptionsVal].concat(extraOptionBlocks).join(';');

        // Ligne is always present now (validated above), so this always
        // appends the '|Ligne' segment; the logo, if any, follows it.
        let sousCategorieOut = scNomVal;
        if (scLigneVal || scLogoVal) sousCategorieOut += '|' + (scLigneVal || '0');
        if (scLogoVal) sousCategorieOut += '|' + scLogoVal;

        return {
          idWork: idWork,
          cible: cible,
          sousCategorie: sousCategorieOut,
          discipline: discipline,
          typeTravail: typeTravail,
          piecesApplicables: pieces,
          typeChamp: typeChamp,
          detailsChamp: detailsChampVal,
          options: optionsOut
        };
      }
    }).then(function (result) {
      if (!result.isConfirmed) {
        // "Annuler" (or ESC / backdrop dismiss) -> back to the manager list
        // (same view the user was on before this form opened), instead of
        // leaving nothing open.
        openTravauxConfigManager(defaultViewKey);
        return;
      }
      submitTravauxConfigRow(result.value, isNew);
    });
  }

  // ---- Save / delete -> server ------------------------------------------

  function submitTravauxConfigRow(rowData, isNew) {
    showLoading(isNew ? 'Ajout en cours...' : 'Enregistrement en cours...', rowData.typeTravail);

    google.script.run
      .withSuccessHandler(function (freshRows) {
        rawData.travauxConfig = freshRows || [];
        initTravauxConfigCache(rawData.travauxConfig);
        if (WorkspaceCore.getActiveLayerId() === 'travaux') WorkspaceCore.refreshActiveLayer();

        if (typeof Swal !== 'undefined') Swal.close();
        showToast(isNew ? 'Poste de travaux ajouté.' : 'Poste de travaux mis à jour.', 'success');
        appLog(normalizeView(rowData.cible), rowData.idWork, isNew ? 'Ajout Config Travaux' : 'Modification Config Travaux', 'Private', 'Detail', rowData, APP_USER_EMAIL);

        openTravauxConfigManager(normalizeView(rowData.cible));
      })
      .withFailureHandler(function (err) {
        appErrorLog(err, "saveTravauxConfigRow", { rowData: rowData });
        showModal({ icon: 'error', title: 'Erreur', text: "L'enregistrement a échoué : " + err.message });
      })
      .saveTravauxConfigRow(APP_DATA.token, APP_DATA.projectId, rowData, isNew);
  }

  function confirmAndDeleteTravauxConfigRow(row, viewKeyToReturnTo) {
    Swal.fire({
      title: 'Supprimer ce poste ?',
      html: '<p class="text-xs text-slate-600 text-left">« <b>' + escapeHtml(row.typeTravail || row.idWork) + '</b> » sera retiré de la checklist Travaux pour toutes les nouvelles saisies.</p>' +
            '<p class="text-xs text-slate-500 mt-2 text-left">Les réponses déjà enregistrées pour ce poste ne sont pas effacées, mais ne seront plus visibles ni modifiables une fois ce poste supprimé.</p>',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Supprimer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#e11d48',
      customClass: { popup: 'rounded-2xl border border-slate-200 shadow-2xl' }
    }).then(function (result) {
      if (!result.isConfirmed) return;

      showLoading('Suppression en cours...', row.typeTravail);
      google.script.run
        .withSuccessHandler(function (freshRows) {
          rawData.travauxConfig = freshRows || [];
          initTravauxConfigCache(rawData.travauxConfig);
          if (WorkspaceCore.getActiveLayerId() === 'travaux') WorkspaceCore.refreshActiveLayer();

          if (typeof Swal !== 'undefined') Swal.close();
          showToast('Poste de travaux supprimé.', 'success');
          appLog(normalizeView(row.cible), row.idWork, 'Suppression Config Travaux', 'Private', 'Detail', { idWork: row.idWork, typeTravail: row.typeTravail }, APP_USER_EMAIL);

          openTravauxConfigManager(viewKeyToReturnTo);
        })
        .withFailureHandler(function (err) {
          appErrorLog(err, "deleteTravauxConfigRow", { idWork: row.idWork });
          showModal({ icon: 'error', title: 'Erreur', text: "La suppression a échoué : " + err.message });
        })
        .deleteTravauxConfigRow(APP_DATA.token, APP_DATA.projectId, row.idWork);
    });
  }

  // Entry point called by setupAdminConfigTravauxButton() in
  // Workspace_Core_Scripts.html (the button lives in the shared shell, this
  // module owns what it opens).
  window.openTravauxConfigManager = openTravauxConfigManager;

  // ---------------------------------------------------------
  // VIEW-MODE VALUE DISPLAY
  // ---------------------------------------------------------
  // Every checklist field below now renders as a PAIR: the live control
  // (checkbox/select/text — class "status-select-input") plus a read-only
  // text sibling (class "status-display-badge") holding the same value.
  // This is the exact "editable select + read-only display badge" pattern
  // EDL's Statut Global field already uses (see Workspace.html's <style>,
  // point 5) — reused here as-is, with zero CSS changes needed, so Mode
  // Édition ON/OFF swaps between the two purely via CSS, same as
  // everywhere else that pattern is used.
  //
  // Previously these fields only carried .edit-only-ui-input, which turns
  // background/border transparent and disables pointer-events in View
  // Mode but leaves the control itself on screen. That's fine for a plain
  // text input (its value stays legible), but a checkbox's checked fill
  // and a select's chosen option can end up effectively invisible once
  // their background is stripped — which is why the user's choice wasn't
  // showing outside Mode Édition. A dedicated text sibling sidesteps that
  // entirely instead of depending on native checkbox/select rendering.
  //
  // formatChecklistFieldValue() is the single source of truth for "what
  // text represents this value" — used both when a row is first built
  // below AND by updateFieldDisplayBadge() (wired into mount()'s
  // change/focusout listeners) so the badge never goes stale: without
  // that live sync, editing a field and leaving Mode Édition right away
  // (no selection change in between to force a re-render) would still
  // show whatever the badge said at last render instead of the fresh
  // value. refreshAllFieldDisplayBadges() (below, near
  // saveAllVisibleRoomsInBackground) is the belt-and-suspenders sweep
  // that re-syncs every badge on exit, covering the same "still mid-edit"
  // edge case that function already exists to save.
  function formatChecklistFieldValue(isCheckbox, rawValue) {
    if (isCheckbox) return (rawValue === true || rawValue === 'true') ? 'Oui' : '—';
    const str = (rawValue == null) ? '' : String(rawValue);
    return str.trim() ? str : '—';
  }

  function updateFieldDisplayBadge(el) {
    const badge = el.parentElement ? el.parentElement.querySelector('.status-display-badge') : null;
    if (!badge) return;
    const isCheckbox = (el.type === 'checkbox');
    badge.textContent = formatChecklistFieldValue(isCheckbox, isCheckbox ? el.checked : el.value);
  }

  // Renders the PRIMARY input for one work item based on "Type de Champ",
  // plus its read-only ".status-display-badge" sibling — see VIEW-MODE
  // VALUE DISPLAY above. Anything other than Checkbox / Menu Deroulant
  // falls back to a text input, so a typo or a not-yet-listed type still
  // renders something editable instead of silently disappearing.
  // `savedValue` here is always already-unwrapped (see
  // buildWorkItemRowHtml) — just the primary value, never the
  // {_primary, ...} object.
  function buildWorkItemFieldHtml(item, savedValue) {
    const type = item.typeChamp.toLowerCase();
    const idAttr = escapeHtml(item.idWork);
    const isCheckbox = (type === 'checkbox');
    let controlHtml;

    if (isCheckbox) {
      const checked = (savedValue === true || savedValue === 'true') ? 'checked' : '';
      controlHtml = '<input type="checkbox" data-work-id="' + idAttr + '" ' + checked +
             ' class="status-select-input w-5 h-5 rounded border-slate-300 text-primary focus:ring-primary" />';
    } else if (type === 'menu deroulant' || type === 'menu déroulant') {
      const options = item.options.map(function (opt) {
        const sel = (savedValue === opt) ? 'selected' : '';
        return '<option value="' + escapeHtml(opt) + '" ' + sel + '>' + escapeHtml(opt) + '</option>';
      }).join('');
      controlHtml = '<select data-work-id="' + idAttr + '" class="status-select-input w-full px-3 py-1.5 rounded-lg border-slate-200 text-xs font-medium text-slate-700 bg-slate-50 text-center">' +
               '<option value="">—</option>' + options +
             '</select>';
    } else {
      // "Texte" and any unrecognized type
      controlHtml = '<input type="text" data-work-id="' + idAttr + '" value="' + escapeHtml(savedValue || '') + '" ' +
           'class="status-select-input w-full px-3 py-1.5 rounded-lg border-slate-200 text-xs font-medium text-slate-700 bg-slate-50 text-center" placeholder="—" />';
    }

    const badgeHtml = '<span class="status-display-badge w-full px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-700 bg-slate-50 border border-slate-100 truncate text-center block">' +
      escapeHtml(formatChecklistFieldValue(isCheckbox, savedValue)) + '</span>';

    return controlHtml + badgeHtml;
  }

  // Renders ONE extra field (from "Détails de champ"), plus its
  // ".status-display-badge" sibling — same pairing as
  // buildWorkItemFieldHtml above, just at the smaller size the extra-field
  // row already used. Mirrors buildWorkItemFieldHtml's checkbox/dropdown/
  // text branching, and is tagged with data-field-key so
  // collectWorkItemValues() knows this input belongs to item.idWork's
  // sub-object rather than being its own top-level value.
  function buildExtraFieldHtml(item, field, index, savedValue) {
    const idAttr = escapeHtml(item.idWork);
    const keyAttr = escapeHtml(field.label);
    const type = field.type;
    const isCheckbox = (type === 'checkbox');
    let controlHtml;

    if (isCheckbox) {
      const checked = (savedValue === true || savedValue === 'true') ? 'checked' : '';
      controlHtml = '<input type="checkbox" data-work-id="' + idAttr + '" data-field-key="' + keyAttr + '" ' + checked +
             ' class="status-select-input w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary" />';
    } else if (type === 'dropdown' || type === 'menu deroulant' || type === 'menu déroulant') {
      const opts = (item.extraOptions[index] || []).map(function (opt) {
        const sel = (savedValue === opt) ? 'selected' : '';
        return '<option value="' + escapeHtml(opt) + '" ' + sel + '>' + escapeHtml(opt) + '</option>';
      }).join('');
      controlHtml = '<select data-work-id="' + idAttr + '" data-field-key="' + keyAttr + '" class="status-select-input w-full px-2 py-1 rounded-lg border-slate-200 text-[11px] font-medium text-slate-700 bg-slate-50">' +
               '<option value="">—</option>' + opts +
             '</select>';
    } else {
      const inputType = (type === 'nombre') ? 'number' : 'text';
      controlHtml = '<input type="' + inputType + '" data-work-id="' + idAttr + '" data-field-key="' + keyAttr + '" value="' + escapeHtml(savedValue == null ? '' : savedValue) + '" ' +
           'class="status-select-input w-full px-2 py-1 rounded-lg border-slate-200 text-[11px] font-medium text-slate-700 bg-slate-50" placeholder="—" />';
    }

    const badgeHtml = '<span class="status-display-badge w-full px-2 py-1 rounded-lg text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-100 truncate">' +
      escapeHtml(formatChecklistFieldValue(isCheckbox, savedValue)) + '</span>';

    return controlHtml + badgeHtml;
  }

  function buildWorkItemRowHtml(item, savedValue) {
    const hasExtra = item.extraFields.length > 0;
    const savedIsObject = savedValue && typeof savedValue === 'object';
    // When a row has extra fields, a saved value (once anything's been
    // entered) is the {_primary, <label>: value, ...} object collectWorkItemValues()
    // produces below — unwrap the primary here so buildWorkItemFieldHtml
    // always just sees "the primary value" either way.
    const primaryValue = hasExtra && savedIsObject ? savedValue._primary : savedValue;

    const extraHtml = hasExtra
      ? '<div class="mt-2 pl-3 border-l-2 border-slate-100 space-y-1.5">' +
          item.extraFields.map(function (field, i) {
            const fv = savedIsObject ? savedValue[field.label] : undefined;
            return '<div class="flex items-center justify-between gap-2">' +
                     '<label class="text-[10px] font-semibold text-slate-400">' + escapeHtml(field.label) + '</label>' +
                     '<div class="w-28 shrink-0">' + buildExtraFieldHtml(item, field, i, fv) + '</div>' +
                   '</div>';
          }).join('') +
        '</div>'
      : '';

    return (
      '<div class="flex items-center justify-between gap-3 py-2 border-b border-slate-100 last:border-b-0">' +
        '<div class="flex-1 min-w-0 pr-3">' +
          '<p class="text-xs font-bold text-slate-700">' + escapeHtml(item.typeTravail) + '</p>' +
          extraHtml +
        '</div>' +
        '<div class="w-36 shrink-0 text-center">' + buildWorkItemFieldHtml(item, primaryValue) + '</div>' +
      '</div>'
    );
  }

  function buildWorkItemsChecklistHtml(ctx, roomName, savedValues) {
    const items = getApplicableWorkItems(ctx, roomName);
    if (items.length === 0) {
      return '<p class="text-xs text-slate-400 italic">Aucun poste de travaux applicable pour cette sélection.</p>';
    }

    const groups = groupWorkItemsByDiscipline(items);
    return groups.map(function (group) {
      return (
        '<div class="mb-4 last:mb-0">' +
          '<h4 class="text-[10px] font-black text-primary uppercase tracking-widest mb-1">' + escapeHtml(group.discipline) + '</h4>' +
          group.items.map(function (item) { return buildWorkItemRowHtml(item, savedValues[item.idWork]); }).join('') +
        '</div>'
      );
    }).join('');
  }

  // Reads every checklist input currently in the DOM *for one room's card*
  // into a { idWork: value } map, folding any data-field-key inputs into
  // that work item's {_primary, <label>: value, ...} object instead of
  // overwriting the primary value. Order-independent: works whether the
  // primary or an extra field is encountered first in DOM order. Scoped to
  // a single [data-room-worklist] element now that every room renders (and
  // is editable) at once — each room card has its own independent set of
  // data-work-id inputs, so this can no longer just read the whole panel.
  function collectWorkItemValues(scopeEl) {
    const values = {};
    if (!scopeEl) return values;

    scopeEl.querySelectorAll('[data-work-id]').forEach(function (el) {
      const id = el.dataset.workId;
      const raw = (el.type === 'checkbox') ? el.checked : el.value;

      if (el.dataset.fieldKey) {
        if (typeof values[id] !== 'object' || values[id] === null) {
          values[id] = { _primary: values[id] !== undefined ? values[id] : null };
        }
        values[id][el.dataset.fieldKey] = raw;
      } else if (typeof values[id] === 'object' && values[id] !== null) {
        values[id]._primary = raw; // an extra field for this id was already processed first
      } else {
        values[id] = raw;
      }
    });
    return values;
  }

  function applyStatusSelectColor(selectEl) {
    const displayEl = document.getElementById('travaux-status-display');
    selectEl.classList.remove(
      'bg-blue-500', 'text-white',
      'bg-orange-400', 'text-slate-900',
      'bg-red-300',
      'bg-slate-50', 'text-slate-700'
    );
    displayEl.className = 'status-display-badge px-4 py-2 rounded-xl text-sm font-bold border border-transparent';

    const val = selectEl.value;
    displayEl.textContent = val || 'Aucun';

    // Status colors for Travaux (can be adjusted to fit Travaux specific workflows)
    if (val === 'Info') {
      selectEl.classList.add('bg-blue-500', 'text-white');
      displayEl.classList.add('bg-blue-500', 'text-white');
    } else if (val === 'Attention') {
      selectEl.classList.add('bg-orange-400', 'text-slate-900');
      displayEl.classList.add('bg-orange-400', 'text-slate-900');
    } else if (val === 'Bloquant') {
      selectEl.classList.add('bg-red-300', 'text-slate-900');
      displayEl.classList.add('bg-red-300', 'text-slate-900');
    } else {
      selectEl.classList.add('bg-slate-50', 'text-slate-700');
      displayEl.classList.add('bg-slate-50', 'text-slate-700');
    }
  }

  // ---------------------------------------------------------
  // ROOM SCOPES — every room now renders as its own container at once
  // (the Pièce dropdown is frozen while Travaux is active, same lock the
  // Réserves layer already uses — see mount()/lockRoomDropdown() below),
  // so instead of resolving to ONE current room we build the full list of
  // scopes to render.
  // ---------------------------------------------------------

  // Specific room names to render as their own container for the currently
  // selected item, sourced straight from the already-populated #room-select
  // options so it stays in sync with whatever populateRoomOrPartie()
  // decided (configLogement lookup, etc.) without duplicating that logic
  // here. The "all"/placeholder option is filtered out — it's represented
  // by the fixed "Toutes les pièces" container instead (see
  // buildRoomScopes below).
  //
  // Whole-level selections ("GLOBAL_...") and non-"locataires" views
  // (Communs/Façades) never had a per-room breakdown to begin with (the
  // old resolveRoomKey() forced everything to 'Général' for those too), so
  // this returns [] for them and only the single "Général" container ends
  // up rendering.
  function getRoomsForCurrentSelection(ctx) {
    const isWholeLevel = String(ctx.activeId || '').startsWith('GLOBAL_');
    if (isWholeLevel || ctx.currentView !== 'locataires') return [];

    const roomSelect = document.getElementById('room-select');
    if (!roomSelect) return [];
    return Array.from(roomSelect.options)
      .map(function (o) { return o.value; })
      .filter(function (v) { return v && v !== 'all'; });
  }

  // On-screen label for the always-first "every room" container. The
  // storage key behind it stays 'Général' everywhere (matches what a
  // "Toutes les pièces" selection already saved under before this change,
  // and what renderPlanPanel/getSavedWorkValuesForRoom already expect) —
  // only the label adapts to the current view, mirroring the wording
  // populateRoomOrPartie() uses for its own "all" option.
  function getAllRoomsLabel(ctx) {
    if (ctx.currentView === 'facades') return 'Toutes les parties';
    if (ctx.currentView === 'locataires') return 'Toutes les pièces';
    return 'Général';
  }

  // Full ordered list of { key, label, isGlobal } scopes to render: "Toutes
  // les pièces" (key 'Général') always first, then one entry per specific
  // room. isGlobal just drives buildRoomCardHtml()'s styling below, so the
  // first card reads as visually distinct from the per-room ones as you
  // scroll past it.
  function buildRoomScopes(ctx) {
    const scopes = [{ key: 'Général', label: getAllRoomsLabel(ctx), isGlobal: true }];
    getRoomsForCurrentSelection(ctx).forEach(function (room) {
      scopes.push({ key: room, label: room, isGlobal: false });
    });
    return scopes;
  }

  // Looks up this ID's row in Données Travaux and pulls out, for every work
  // item column that has a value for `roomName`, just that one value —
  // returning the same { idWork: value } shape buildWorkItemsChecklistHtml
  // already expects (previously sourced from travauxNotes[...].values).
  function getSavedWorkValuesForRoom(activeId, roomName) {
    const row = (rawData.travauxDonnees || []).find(function (r) { return String(r['ID Logement']) === String(activeId); });
    const values = {};
    if (!row) return values;

    Object.keys(row).forEach(function (key) {
      if (key === 'ID Logement' || !row[key]) return;
      try {
        const parsed = JSON.parse(row[key]);
        if (Object.prototype.hasOwnProperty.call(parsed, roomName)) {
          values[key] = parsed[roomName];
        }
      } catch (e) { /* cell isn't valid JSON yet (e.g. hand-edited) -- skip it rather than break the whole checklist */ }
    });
    return values;
  }

  // Wraps one scope's checklist (buildWorkItemsChecklistHtml, unchanged)
  // in its own card, tagged with data-room-worklist so the delegated
  // change/focusout listeners in mount() know which room a given input
  // belongs to when saving.
  function buildRoomCardHtml(ctx, scope, savedValues) {
    const bodyHtml = buildWorkItemsChecklistHtml(ctx, scope.key, savedValues);
    const cardClass = scope.isGlobal
      ? 'bg-primary-light border border-primary/30 rounded-2xl p-5 shadow-sm'
      : 'bg-white border border-slate-200 rounded-2xl p-5 shadow-sm';
    const icon = scope.isGlobal ? 'apartment' : 'meeting_room';
    return (
      '<div class="' + cardClass + '" data-room="' + escapeHtml(scope.key) + '">' +
        '<h3 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2">' +
          '<span class="material-symbols-outlined text-primary !text-[18px]">' + icon + '</span> ' + escapeHtml(scope.label) +
        '</h3>' +
        '<div class="divide-y divide-slate-100" data-room-worklist="' + escapeHtml(scope.key) + '">' +
          bodyHtml +
        '</div>' +
      '</div>'
    );
  }

  function updateWorkItemsChecklist(ctx) {
    const container = document.getElementById('travaux-rooms-container');
    if (!container) return;

    if (!ctx.activeId) {
      container.innerHTML = '';
      return;
    }

    const scopes = buildRoomScopes(ctx);
    container.innerHTML = scopes.map(function (scope) {
      const savedValues = getSavedWorkValuesForRoom(ctx.activeId, scope.key);
      return buildRoomCardHtml(ctx, scope, savedValues);
    }).join('');
  }

  // Saves ONE room's checklist values to Données Travaux — every room card
  // is independent now that they're all visible/editable at once (see the
  // delegated listeners in mount() below, which figure out `roomKey` and
  // `scopeEl` from whichever card the edited input lives in). Mirrors the
  // save into rawData.travauxDonnees on success (same "keep the local
  // cache in sync" pattern saveCurrentNotesInBackground uses for
  // travauxNotes) so the print panel reflects the change immediately
  // without a full page reload.
  function saveWorkItemValuesForRoom(ctx, roomKey, scopeEl) {
    if (!ctx.activeId || !roomKey) return;
    const values = collectWorkItemValues(scopeEl);
    if (Object.keys(values).length === 0) return; // nothing applicable/rendered for this room right now

    const payload = { id: ctx.activeId, room: roomKey, values: values };

    google.script.run
      .withSuccessHandler(function () {
        if (!rawData.travauxDonnees) rawData.travauxDonnees = [];
        let row = rawData.travauxDonnees.find(function (r) { return String(r['ID Logement']) === String(ctx.activeId); });
        if (!row) {
          row = { 'ID Logement': ctx.activeId };
          rawData.travauxDonnees.push(row);
        }
        Object.keys(values).forEach(function (idWork) {
          let cellObj = {};
          try { cellObj = row[idWork] ? JSON.parse(row[idWork]) : {}; } catch (e) { cellObj = {}; }
          cellObj[roomKey] = values[idWork];
          row[idWork] = JSON.stringify(cellObj);
        });
        showToast('Sauvegarde auto (Travaux)...', 'success', '', 1000);

        // Keep the printable recap (left panel) in sync with what was just
        // saved, without waiting for the next room/ID change to refresh it.
        if (WorkspaceCore.getActiveLayerId() === 'travaux') {
          const wrapper = document.getElementById('plan-wrapper');
          if (wrapper) renderPlanPanel(WorkspaceCore.buildContext(), wrapper);
        }
      })
      .withFailureHandler(function (err) {
        console.error("Auto-save (work values) failed:", err.message);
      })
      .saveTravauxDonneesData(APP_DATA.token, APP_DATA.projectId, payload);
  }

  // Saves every room card currently on screen — used as a safety net when
  // leaving Édition mode (onExitEditMode) in case a field was mid-edit
  // (focused, not yet blurred/changed) at that moment. Every field also
  // auto-saves on its own change/focusout already (see mount()), so this
  // mostly just re-covers that one edge case across all rooms at once.
  function saveAllVisibleRoomsInBackground(ctx) {
    document.querySelectorAll('#travaux-rooms-container [data-room-worklist]').forEach(function (scopeEl) {
      saveWorkItemValuesForRoom(ctx, scopeEl.dataset.roomWorklist, scopeEl);
    });
  }

  // Re-syncs every checklist badge currently on screen (all rooms) with
  // its control's live value. Called from onExitEditMode as a final catch
  // -all alongside saveAllVisibleRoomsInBackground above, covering the
  // same "field was still mid-edit when Mode Édition was turned off" gap
  // that function's own comment already describes — the per-field
  // change/focusout listeners in mount() handle the normal case, this is
  // just the safety net.
  function refreshAllFieldDisplayBadges() {
    document.querySelectorAll('#travaux-rooms-container [data-work-id]').forEach(updateFieldDisplayBadge);
  }

  // ---------------------------------------------------------
  // LEFT PANEL — printable work-summary
  // ---------------------------------------------------------
  // Locataires gets the full PDF-style "Fiche de travaux" recap below
  // (renderPlanPanelLocataires): a header info-bar plus one box per Sous-
  // catégorie, each box always showing every configured line (Oui/Non/—),
  // grouped/ordered via sousCategorieNom/Ligne and illustrated with the
  // Logo icons — see initTravauxConfigCache()'s comment for the "Nom|
  // Ligne|Logo" convention this all reads.
  // Communs/Façades don't have those header fields (Type logement, Nom,
  // etc.), so they keep the original flat list (renderPlanPanelLegacy).

  // Turns a raw saved value into a small display object for the recap:
  // { primary: 'Oui' | 'Non' | '—' | <string>, extras: [{label, value}] }.
  // Always returns something to show (never null/skips) — every configured
  // line prints, OUI/NON/— included, matching the paper Fiche de Travaux
  // instead of only showing lines with an actual answer.
  function formatRecapValue(item, value) {
    if (value === undefined || value === null || value === '') return { primary: '—', extras: [] };
    if (value === true) return { primary: 'Oui', extras: [] };
    if (value === false) return { primary: 'Non', extras: [] };
    if (typeof value === 'object') {
      const p = value._primary;
      const primary = p === true ? 'Oui' : p === false ? 'Non' : (p || p === 0) ? String(p) : '—';
      const extras = (item.extraFields || [])
        .filter(function (f) { return value[f.label] !== undefined && value[f.label] !== null && value[f.label] !== ''; })
