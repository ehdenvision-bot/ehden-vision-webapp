<script>

  // =========================================================
  // 1. DUAL SELECTION ENGINE (BULK VS GRANULAR) & ACCESSIBILITY
  // =========================================================
  document.addEventListener('DOMContentLoaded', () => {
    const tbody = document.querySelector(".gantt-table tbody");
    if (!tbody) return;

    tbody.addEventListener('click', function(e) {
      
      // ---------------------------------------------------------
      // 1. DROPDOWN PROTECTION LOGIC
      // ---------------------------------------------------------
      // Si des menus sont ouverts et qu'on clique dans le tableau, 
      // on bloque l'action de sélection pour laisser le script global fermer le menu.
      const openMenus = document.querySelectorAll('div[id^="list-"]:not(.hidden), #detailsMenu:not(.hidden), #settingsMenu:not(.hidden), #userMenu:not(.hidden), #navMenu:not(.hidden)');
      
      if (openMenus.length > 0) {
        let isInsideMenuOrTrigger = false;
        
        // Vérifie si le clic provient du menu lui-même ou de son bouton d'ouverture
        if (e.target.closest('div[id^="list-"]') || e.target.closest('button[onclick^="toggleFilterDropdown"]')) isInsideMenuOrTrigger = true;
        if (e.target.closest('#detailsMenu') || e.target.closest('button[onclick*="detailsMenu"]')) isInsideMenuOrTrigger = true;
        if (e.target.closest('#settingsMenu') || e.target.closest('button[onclick*="toggleSettingsMenu"]')) isInsideMenuOrTrigger = true;
        if (e.target.closest('#userMenu') || e.target.closest('#userMenuBtn')) isInsideMenuOrTrigger = true;
        if (e.target.closest('#navMenu') || e.target.closest('#navMenuBtn')) isInsideMenuOrTrigger = true;

        if (!isInsideMenuOrTrigger) {
          // Clic à l'extérieur : on stoppe le script pour ne pas surligner la ligne
          return; 
        }
      }

      if (window.isEditModeActive) {
        // --- GRANULAR EDIT MODE (PRESERVED) ---
        const taskPill = e.target.closest('.task-pill');
        const dot = e.target.closest('.greedy-dot');
        const stickyCell = e.target.closest('.sticky-col');

        let clickedElement = null;

        if (taskPill) {
           clickedElement = taskPill;
           handleGranularSelection('task', taskPill);
        } else if (dot) {
           clickedElement = dot;
           handleGranularSelection('dot', dot);
        } else if (stickyCell) {
           const tr = stickyCell.closest('tr');
           const idCell = tr.querySelector('.sticky-id');
           if (idCell) {
             clickedElement = idCell;
             handleGranularSelection('id', idCell);
           }
        }
        
        // --- Apply Highlight ---
        if (clickedElement) {
           document.querySelectorAll('.active-edit-item').forEach(el => {
               el.classList.remove('active-edit-item', 'active-edit-sticky', 'active-edit-grid');
           });

           clickedElement.classList.add('active-edit-item');
           if (stickyCell) {
               clickedElement.classList.add('active-edit-sticky');
           } else {
               clickedElement.classList.add('active-edit-grid');
           }

           if (taskPill) {
            const dateISO = taskPill.closest('td').getAttribute('data-date');
            window.currentSelectionId = `task|${taskPill.dataset.logid}|${taskPill.dataset.task}|${dateISO}`;
          } else if (dot) {
            window.currentSelectionId = `dot|${dot.getAttribute('data-inter-id')}`;
          } else if (stickyCell) {
            const tr = clickedElement.closest('tr');
            window.currentSelectionId = `id|${tr.getAttribute('data-id')}`;
          }
        }
        return;
      } else {
        // --- DEFAULT BULK MODE ---
        const td = e.target.closest('td.cell-day');
        const stickyCellNormal = e.target.closest('.sticky-col');
        
        // ---------------------------------------------------------
        // 2. TABLE ROW HIGHLIGHT LOGIC (With Multi-Select)
        // ---------------------------------------------------------
        if (stickyCellNormal) {
          const tr = stickyCellNormal.closest('tr');
          if (tr) {
            const isMultiSelect = e.ctrlKey || e.metaKey; // Windows(Ctrl) ou Mac(Cmd)
            
            if (isMultiSelect) {
              // Mode multi-sélection : on bascule juste cette ligne
              tr.classList.toggle('row-highlight');
            } else {
              // Mode standard : sélection unique
              const allHighlighted = document.querySelectorAll('tr.row-highlight');
              if (tr.classList.contains('row-highlight') && allHighlighted.length === 1) {
                tr.classList.remove('row-highlight');
              } else {
                allHighlighted.forEach(row => row.classList.remove('row-highlight'));
                tr.classList.add('row-highlight');
              }
            }
          }
        }
    
        // ---------------------------------------------------------
        // SELECTION DES CELLULES DE DATES (MODIFIED)
        // ---------------------------------------------------------
        if (!td) return;
        if (e.ctrlKey || e.metaKey) {
          td.classList.toggle('selected-cell');
        } else {
          const currentlySelected = document.querySelectorAll('.selected-cell');
          const isAlreadySelected = td.classList.contains('selected-cell');

          if (isAlreadySelected && currentlySelected.length === 1) {
            // Deselect if it's the exact same single cell being clicked again
            td.classList.remove('selected-cell');
          } else {
            // Otherwise, clear the board and select the clicked cell
            currentlySelected.forEach(c => c.classList.remove('selected-cell'));
            td.classList.add('selected-cell');
          }
        }
      }
    });
  });

  // Fonction utilitaire pour récupérer les cellules sélectionnées (EXISTING)
  function getSelectedCellsData() {
    const selected = document.querySelectorAll('.selected-cell');
    let data = [];
    selected.forEach(td => {
      const tr = td.closest('tr');
      data.push({
        logementId: tr.getAttribute('data-id'),
        date: td.getAttribute('data-date'),
        isWorking: td.getAttribute('data-working') === "1"
      });
    });
    return data;
  }

  // ---------------------------------------------------------
  // 3. KEYBOARD ACCESSIBILITY (ESC KEY LOGIC)
  // ---------------------------------------------------------
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      
      // 1. Fermer tous les menus déroulants
      const openMenus = document.querySelectorAll('div[id^="list-"]:not(.hidden), #detailsMenu:not(.hidden), #settingsMenu:not(.hidden)');
      openMenus.forEach(menu => {
          menu.classList.add('hidden');
      });

      // Si on a fermé des filtres, on s'assure de réinitialiser l'état verrouillé/déverrouillé
      if (openMenus.length > 0) {
         populateFilterOptions(true);
      }

      // 2. Retirer les surlignages de lignes (Row highlight)
      document.querySelectorAll('.row-highlight').forEach(row => {
        row.classList.remove('row-highlight');
      });

      // 3. Retirer les sélections des pastilles du calendrier (Cell highlight)
      document.querySelectorAll('.selected-cell').forEach(cell => {
        cell.classList.remove('selected-cell');
      });
    }
  });


  // =========================================================
  // 2. APPLICATION TÂCHE / CYCLE
  // =========================================================

  function handleSelectChange(source) {
  const selectId = source === 'top' ? 'add-component-select' : 'add-component-select-sidebar';
  const containerId = source === 'top' ? 'ampm-container-top' : 'ampm-container-sidebar';
  const radioName = source === 'top' ? 'ampm-top' : 'ampm-sidebar';
  const durationInputId = source === 'top' ? 'custom-duration-top' : 'custom-duration-sidebar';

  const select = document.getElementById(selectId);
  const container = document.getElementById(containerId);
  const durationInput = document.getElementById(durationInputId);

  if (!select || !container) return;

  const selectedValue = select.value;
  const radios = container.querySelectorAll(`input[name="${radioName}"]`);

  // Block menus if a cycle is selected or if nothing is selected
  if (!selectedValue || selectedValue.startsWith('CYCLE|')) {
    container.classList.add('opacity-50', 'pointer-events-none');
    radios.forEach(r => r.disabled = true);
    if (durationInput) {
      durationInput.disabled = true;
      durationInput.value = "";
    }
    return;
  }

  // It's a Task: Allow duration editing and auto-fill
  const abbr = selectedValue.split('|')[1];
  const task = window.currentTasksData.find(t => t.abbr === abbr);

  if (task) {
    if (durationInput) {
      durationInput.disabled = false;
      durationInput.value = task.duree || 1;
    }
    
    // Unlock AM/PM only if the task unit is AM/PM
    if (task.unite === 'AM/PM') {
      container.classList.remove('opacity-50', 'pointer-events-none');
      radios.forEach(r => r.disabled = false);
    } else {
      container.classList.add('opacity-50', 'pointer-events-none');
      radios.forEach(r => r.disabled = true);
    }
  }
}

  function applyIntervention(source) {
    const selectId = source === 'top' ? 'add-component-select' : 'add-component-select-sidebar';
    const radioName = source === 'top' ? 'ampm-top' : 'ampm-sidebar';
    const select = document.getElementById(selectId);
    if (!select) return;

    const selectedValue = select.value;
    if (!selectedValue) {
      showModal({
        icon: 'warning',
        title: 'Attention',
        text: 'Veuillez sélectionner une Tâche ou un Cycle à ajouter.'
      });
    }

    const selectedCells = getSelectedCellsData();
    if (selectedCells.length === 0) {
      return;
    }

    // --- VÉRIFICATION DES JOURS NON OUVRÉS ---
    const hasNonWorking = selectedCells.some(cell => !cell.isWorking);
    if (hasNonWorking) {
      return showModal({
        icon: 'warning',
        title: 'Jour non ouvré sélectionné',
        html: 'Vous avez cliqué sur un jour non ouvré (ex: week-end). Veuillez sélectionner uniquement des jours travaillés.'
      });
    }

    const isTask = selectedValue.startsWith('TASK|');
    let itemName = selectedValue.split('|')[1];
    let customDuree = null;

    if (isTask) {
      const durationInput = document.getElementById(source === 'top' ? 'custom-duration-top' : 'custom-duration-sidebar');
      if (durationInput && durationInput.value) {
        customDuree = parseInt(durationInput.value, 10);
      }

      const task = window.currentTasksData.find(t => t.abbr === itemName);
      if (task && task.unite === 'AM/PM') {
        const checkedRadio = document.querySelector(`input[name="${radioName}"]:checked`);
        if (checkedRadio) {
          itemName += "@" + checkedRadio.value;
        }
      }
    }

    // Préparation du paquet de données
    const payload = {
      type: isTask ? 'task' : 'cycle',
      itemName: itemName, // C'est ici que "PLOMB@AM" ou juste "PLOMB" est envoyé au serveur
      cells: selectedCells,
      currentView: window.currentView,
      customDuree: customDuree
    };

    showLoading('Analyse en cours...');

    google.script.run
      .withSuccessHandler(handleInterventionAnalysis)
      .withFailureHandler(err => {
        showModal({
          icon: 'error',
          title: 'Erreur Système',
          text: err.message
        });
        appErrorLog(err, "applyIntervention", {
          source: source,
          payloadSent: payload,
          projectId: PROJECT_ID || "Inconnu"
        });
      })
      .gsAnalyzeIntervention(APP_DATA.token, payload);
  }

  async function handleInterventionAnalysis(response) {
    if (!response || !response.success) {
      showModal({
        icon: 'error',
        title: 'Réponse invalide',
        text: response && response.error ? response.error : 'Erreur Backend'
      });
    }

    let actionsToExecute = response.validActions || [];
    // Par défaut, les actions valides sont en mode 'replace'
    actionsToExecute.forEach(a => a.mode = 'replace');

    const conflicts = response.conflicts || [];

    if (conflicts.length > 0) {
      for (const conflict of conflicts) {
        let htmlContent = `
          <div class="text-left text-sm mb-3">La tâche <b>${conflict.baseTask}</b> est déjà planifiée pour le logement <b>${conflict.logementId}</b>.</div>
          <div class="bg-slate-50 p-2 rounded border border-slate-200 mb-3 text-left">
            <div class="text-xs text-slate-500 font-bold uppercase">Dates au récap :</div>
            <div class="text-sm text-primary font-mono">${conflict.oldValue || "Aucune"}</div>
            <div class="text-xs text-slate-500 font-bold uppercase mt-2">Statut actuel :</div>
            <div class="text-sm text-amber-600">${conflict.status}</div>`;

        if (conflict.note) {
          htmlContent += `
            <div class="text-xs text-slate-500 font-bold uppercase mt-2">Note actuelle :</div>
            <div class="text-sm text-blue-600">${conflict.note}</div>
          </div>
          <div class="text-left text-sm font-bold text-slate-700 mb-2">Que voulez-vous faire ?</div>
          <div class="text-left space-y-2 text-sm">
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="swal-action" value="replace_clear" checked> Remplacer (Effacer la note)</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="swal-action" value="replace_keep"> Remplacer (Garder la note)</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="swal-action" value="keep_both"> Garder les deux planifications</label>
          </div>`;
        } else {
          htmlContent += `
          </div>
          <div class="text-left text-sm font-bold text-slate-700 mb-2">Que voulez-vous faire ?</div>
          <div class="text-left space-y-2 text-sm">
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="swal-action" value="replace_clear" checked> Remplacer</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="swal-action" value="keep_both"> Garder les deux</label>
          </div>`;
        }

        const result = await showModal({
          icon: 'warning',
          title: 'Tâche déjà présente',
          html: htmlContent,
          showCancelButton: true,
          confirmButtonText: 'Valider',
          cancelButtonText: 'Annuler',
          preConfirm: () => {
            const checked = document.querySelector('input[name="swal-action"]:checked');
            return checked ? checked.value : 'replace_clear';
          }
        });

        if (result.isConfirmed) {
          const actionType = result.value;
          if (actionType === 'replace_clear') {
            conflict.mode = 'replace';
            conflict.noteAction = 'clear';
          } else if (actionType === 'replace_keep') {
            conflict.mode = 'replace';
            conflict.noteAction = 'keep';
          } else if (actionType === 'keep_both') {
            conflict.mode = 'keep';
            conflict.noteAction = 'keep';
          }
          actionsToExecute.push(conflict);
        }
      }
    }

    if (actionsToExecute.length === 0) return;

    const affectedLogIds = [...new Set(actionsToExecute.map(a => a.logementId))];

    showLoading('Planification...');

    google.script.run
      .withSuccessHandler(() => {
        updateLocalCacheAfterAddition(actionsToExecute);
        
        affectedLogIds.forEach(logId => {
          refreshSingleRowDOM(logId);
        });
        
        document.querySelectorAll('.selected-cell').forEach(c => c.classList.remove('selected-cell'));
        showToast('Planifié');

        appLog(
          window.currentView,
          "bulk-apply",
          "APPLICATION_EN_MASSE",
          "Private",
          "Detail",
          {
            nombreActions: actionsToExecute.length,
            nombreLogements: affectedLogIds.length,
            logementsAffectes: affectedLogIds
          }
        );
      })
      .withFailureHandler(err => {
        showModal({
          icon: 'error',
          title: 'Erreur',
          text: err.message
        });
        appErrorLog(err, "gsExecuteIntervention", {
          response: response,
          actionsCount: actionsToExecute.length,
          affectedLogIds: affectedLogIds,
          currentview : window.currentView,
          projectId: PROJECT_ID || "Inconnu"
        });
      })
      .gsExecuteIntervention(APP_DATA.token, actionsToExecute, window.currentView);
  }

  function updateLocalCacheAfterAddition(actions) {
    if (!window.lastPlanningData || !window.lastPlanningData.planning) return;
    const dates = window.lastPlanningData.headers.dates;

    actions.forEach(action => {
      const row = window.lastPlanningData.planning.find(p => String(p.id).trim() === String(action.logementId).trim());
      if (!row) return;

      if (action.mode === 'replace') {
        for (let i = 0; i < row.tasks.length; i++) {
          if (row.tasks[i]) {
            let cellTasks = String(row.tasks[i]).split('|').map(t => t.trim()).filter(t => t.length > 0);
            cellTasks = cellTasks.filter(t => t.split('@')[0].trim() !== action.baseTask);
            row.tasks[i] = cellTasks.join(' | ');
          }
        }
      }

      let validDates = (action.allDates && Array.isArray(action.allDates)) ? action.allDates : [action.newDate];
      validDates.forEach(dateStr => {
        // SÉCURITÉ "OUT OF BOUNDS" : On cherche l'index de la date
        const dateIdx = dates.indexOf(dateStr);
      
        // Si dateIdx === -1, la date est HORS de la fenêtre de 50 jours.
        // Le code ignore simplement l'ajout visuel. Pas de crash !
        if (dateIdx !== -1) {
          let cellTasks = row.tasks[dateIdx] ? String(row.tasks[dateIdx]).split('|').map(t => t.trim()).filter(t => t.length > 0) : [];
          if (!cellTasks.some(t => t.split('@')[0].trim() === action.baseTask)) {
            cellTasks.push(action.task);
            row.tasks[dateIdx] = cellTasks.join(' | ');
          }
        }
      });

      if (action.noteAction === 'clear' && window.lastPlanningData.notes && window.lastPlanningData.notes[action.logementId]) {
        delete window.lastPlanningData.notes[action.logementId][action.baseTask];
      }
    });
  }


  // =========================================================
  // 3. Export to XLSX file
  // =========================================================

  async function exportToExcel() {
    if (!window.projectStart || !window.projectEnd) {
      showModal({
        icon: 'error',
        title: 'Erreur',
        text: 'Dates du projet introuvables.'
      });
      return;
    }

    // Lazy-load ExcelJS only when the user triggers export
    if (typeof ExcelJS === 'undefined') {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Impossible de charger ExcelJS.'));
        document.head.appendChild(s);
      });
    }

    showToast('Préparation du fichier Excel...', 'info', 'Export en arrière-plan, vous pouvez continuer à travailler.', 4000);

    google.script.run
      .withSuccessHandler(async (fullData) => {
        try {
          const workbook = new ExcelJS.Workbook();
          const worksheet = workbook.addWorksheet('Planning');
          const currentCols = window.viewConfigs[window.currentView] || [];
          
          // 1. Define Excel Columns dynamically based on view
          let excelCols = [];
          currentCols.forEach(col => {
            if (window.currentView === 'communs' && col.id === 'description') {
              excelCols.push({ header: 'Description', key: 'description_part1', width: 20 });
              excelCols.push({ header: 'Référence', key: 'description_part2', width: 15 });
            } 
            else if (window.currentView === 'locataires' && col.id === 'type') {
              excelCols.push({ header: 'Type', key: 'type1', width: 8 });
            } 
            else if (window.currentView === 'facades' && col.id === 'trame') {
              excelCols.push({ header: 'Trame', key: 'trame_part1', width: 10 });
            } 
            else if (window.currentView === 'locataires' && col.id === 'nom') {
              excelCols.push({ header: 'Nom', key: 'nom', width: 15 });
              excelCols.push({ header: 'Prénom', key: 'prenom', width: 15 });
            } 
            else {
              excelCols.push({ header: col.label, key: col.id, width: col.width / 7 });
            }
          });

          const dates = fullData.headers.dates || [];
          dates.forEach(d => excelCols.push({ header: d, key: d, width: 6 }));
          worksheet.columns = excelCols;

          // 2. Populate Rows
          fullData.planning.forEach(rowData => {
            const meta = fullData.logements[rowData.id] || {};
            const rowValue = {};
            
            excelCols.forEach(col => {
              if (meta[col.key] !== undefined) {
                rowValue[col.key] = meta[col.key];
              } else {
                // Map tasks to dates
                const dateIdx = dates.indexOf(col.key);
                if (dateIdx !== -1) {
                  let rawTasks = String(rowData.tasks[dateIdx] || "");
                  
                  if (rawTasks) {
                    // --- MODIFICATION 2 : Nettoyage pour ne garder que la Tâche + AM/PM ---
                    let cleanedTasks = rawTasks.split('|').map(taskStr => {
                      let parts = taskStr.split('@');
                      let baseAbbr = parts[0].trim();
                      // Garde uniquement le modificateur s'il s'agit de "AM" ou "PM"
                      let ampm = (parts.length >= 2 && (parts[1] === "AM" || parts[1] === "PM")) ? `@${parts[1]}` : "";
                      return baseAbbr + ampm;
                    }).filter(t => t !== "").join(' | ');
                    
                    rowValue[col.key] = cleanedTasks;
                  } else {
                    rowValue[col.key] = "";
                  }
                }
              }
            });

            const row = worksheet.addRow(rowValue);
            
            // 3. Centering Logic
            row.eachCell((cell, colNumber) => {
              const colDef = excelCols[colNumber - 1];
              if (colDef.key !== 'id') {
                cell.alignment = { horizontal: 'center', vertical: 'middle' };
              }
            });
          });

          // 4. Header Styling (Blue background, White text, Centered)
          const headerRow = worksheet.getRow(1);
          headerRow.height = 25;
          headerRow.eachCell((cell) => {
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0D59F2' } };
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
          });

          worksheet.views = [{ state: 'frozen', xSplit: excelCols.length - dates.length, ySplit: 1 }];

          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const link = document.createElement('a');
          const today = new Date().toISOString().split('T')[0];
          link.href = URL.createObjectURL(blob);
          link.download = `Planning_${window.currentView}_${today}.xlsx`;
          link.click();
          
          // Toast de succès final
          showToast('Export terminé !');

        } catch (e) {
          showModal({
            icon: 'error',
            title: 'Erreur',
            text: e.message
          });
          appErrorLog(e, "exportToExcel_ClientBuild", { 
            context: "Crash durant la construction du Blob ExcelJS in planning page",
            view: window.currentView,
            projectId: PROJECT_ID || "Inconnu"
          });
        }
      })
      .withFailureHandler((err) => {
        showModal({
          icon: 'error',
          title: 'Erreur',
          text: 'L\'export a échoué.'
        });
        appErrorLog(err, "exportToExcel", {
          context: "Exportation en fichier Excel in planning page",
          projectId: PROJECT_ID || "Inconnu"
        });
      })
      .gsGetPlanningWindow(APP_DATA.token, APP_DATA.projectId, toYMD(window.projectStart), toYMD(window.projectEnd), window.currentView, window.currentFilter || "", isClient);
  }

  // =========================================================
  // 5. IMPRESSION
  // =========================================================

  function printPlanning() {
    const projectName =
      (typeof APP_DATA !== 'undefined' && APP_DATA.projectName)
        ? APP_DATA.projectName
        : 'Planning de Chantier';

    const viewName = window.currentView || 'Standard';
    const printDate = new Date().toLocaleDateString('fr-FR', {
      day: '2-digit', month: '2-digit', year: 'numeric'
    });

    // Put final text into CSS variables (must include quotes)
    const headerText = `${projectName} — ${viewName.toUpperCase()} — Imprimé le : ${printDate}`;
    document.documentElement.style.setProperty('--print-header', `"${headerText}"`);
    document.documentElement.style.setProperty('--print-footer', `""`); // or `"Confidentiel"` etc.

    window.print();
  }

  // =========================================================
  // 6. GESTION DES EQUIPES (Frontend)
  // =========================================================

  let currentEquipes = [];

  function openEquipeListModal() {
    document.getElementById('settingsMenu').classList.add('hidden');
    resetEquipeUI();
    document.getElementById('equipeModal').classList.remove('hidden');
    loadEquipes();
  }

  function resetEquipeUI() {
    const input = document.getElementById('new-equipe-input');
    const indexHidden = document.getElementById('edit-equipe-index');
    const saveBtn = document.querySelector('#equipeModal button[onclick="saveEquipe()"]');
    const cancelBtn = document.getElementById('btn-cancel-equipe');

    if (input) input.value = '';
    if (indexHidden) indexHidden.value = '';
    if (saveBtn) saveBtn.textContent = "Ajouter";
    if (cancelBtn) cancelBtn.classList.add('hidden');
  }

  function closeEquipeModal() {

  async function deleteSelectedTasks() {
    const selectedCells = document.querySelectorAll('.selected-cell');
    if (selectedCells.length === 0) {
      showModal({
        icon: 'warning',
        title: 'Erreur',
        text: "Veuillez sélectionner au moins une cellule."
      });
      return;
    }
  
    // 🔍 On transforme chaque cellule en un tableau d'objets (1 objet par tâche)
    const cellsData = Array.from(selectedCells).flatMap(cell => {
      const id = cell.getAttribute('data-id') || cell.parentElement.getAttribute('data-id');
      const rawContent = cell.innerText || "";
    
      const tasks = rawContent.split('|')
        .map(t => t.trim())
        .filter(t => t !== "");

      return tasks.map(task => ({
        logementId: id,
        cellContent: task,
        date: cell.getAttribute('data-date')
      }));
    });

    // Filtrage de sécurité pour les IDs corrompus
    const cleanCellsData = cellsData.filter(d => d.logementId && d.logementId !== "null");

    if (cleanCellsData.length === 0) {
      showModal({
        icon: 'error',
        title: 'Erreur technique',
        text: "L'identifiant du logement est introuvable sur la cellule. Vérifiez la structure HTML."
      });
    }

    showLoading('Analyse...','Vérification de l\'avancement...');

    google.script.run
      .withSuccessHandler(handleDeletionAnalysis)
      .withFailureHandler((err) => {
        showModal({
          icon: 'error',
          title: 'Erreur serveur',
          text: err.message
        });
        appErrorLog(err, "deleteSelectedTasks", {
          view: window.currentView, 
          totalCellsSelected: selectedCells.length, // Use .length (selectedCells is a NodeList)
          cleanCellsDataCount: cleanCellsData.length, // Count instead of full array
          sampleData: cleanCellsData.slice(0, 2), // Small sample for debugging
          projectId: PROJECT_ID || "Inconnu"
        });
      })
      .gsAnalyzeDeletion(APP_DATA.token, cleanCellsData, window.currentView);
  }

  async function handleDeletionAnalysis(response) {
    if (!response || !response.success) {
      showModal({
        icon: 'error',
        title: 'Erreur Backend',
        text: response ? response.error : 'Réponse invalide'
      });
    }

    let actionsToExecute = response.validActions || [];
    actionsToExecute.forEach(a => a.mode = 'full');

    const conflicts = response.conflicts || [];

    if (conflicts.length > 0) {
    
      // CORRECTION 2 : Regrouper les conflits par Logement + Tâche
      let conflictsByTask = {};
      for (const conflict of conflicts) {
        let key = conflict.logementId + '_' + conflict.baseTask;
        if (!conflictsByTask[key]) {
          conflictsByTask[key] = [];
        }
        conflictsByTask[key].push(conflict);
      }

      // On itère sur les groupes uniques plutôt que sur chaque cellule
      for (const key in conflictsByTask) {
        const group = conflictsByTask[key];
        const mainConflict = group[0]; // On utilise le premier pour afficher les infos
        const hasNote = !!mainConflict.note;
        
        // 1. Décodage et séparation propre des notes JSON
        let noteHtml = '';
        if (hasNote) {
            let pubNote = "";
            let privNote = "";

            try {
              const parsed = typeof mainConflict.note === 'string' && mainConflict.note.trim().startsWith('{')
                ? JSON.parse(mainConflict.note)
                : { pub: mainConflict.note, priv: "" };
              pubNote = parsed.pub || "";
              privNote = parsed.int || parsed.priv || "";
            } catch (e) {
              pubNote = mainConflict.note;
            }

            if (pubNote) {
              noteHtml += `
                <div class="text-xs text-slate-500 font-bold uppercase mt-2">Note :</div>
                <div class="text-sm text-blue-600">${pubNote}</div>
              `;
            }
            if (privNote) {
              noteHtml += `
                <div class="text-xs text-slate-500 font-bold uppercase mt-2">Note Privée :</div>
                <div class="text-sm text-indigo-600">${privNote}</div>
              `;
            }
        }

        const confirmText = hasNote ? 'Planning + Avancement + Note' : 'Planning + Avancement';

        // 2. Vérification si TOUTES les pastilles sont supprimées ou seulement une partie
        let totalDatesInRecap = 0;
        if (mainConflict.recapDates && mainConflict.recapDates !== "Aucune date") {
            // Nettoie l'apostrophe ajoutée par Sheets et sépare par " | "
            totalDatesInRecap = mainConflict.recapDates.replace(/^'/, '').split('|').filter(d => d.trim() !== '').length;
        }
        const isDeletingAllPills = group.length >= totalDatesInRecap;

        // 3. Adapter le texte et les boutons selon si la suppression est totale ou partielle
        const infoText = !isDeletingAllPills
          ? `<div class="mt-3 text-xs text-orange-600 font-bold bg-orange-50 p-2 rounded border border-orange-200">
               ⚠️ Vous ne supprimez qu'une partie de la tâche. Le statut et les notes (Avancement) seront automatiquement conservés.
             </div>`
          : `<div class="text-left text-sm font-bold text-slate-700 mt-3">Que souhaitez-vous supprimer ?</div>`;

        const result = await showModal({
          title: 'Données détectées',
          icon: 'warning',
          html: `
            <div class="text-left text-sm mb-3">La tâche <b>${mainConflict.baseTask}</b> pour le logement <b>${mainConflict.logementId}</b> possède déjà des données associées.</div>
            <div class="bg-slate-50 p-2 rounded border border-slate-200 mb-3 text-left">
              <div class="text-xs text-slate-500 font-bold uppercase">Dates au récap :</div>
              <div class="text-sm text-primary font-mono">${mainConflict.recapDates}</div>
              <div class="text-xs text-slate-500 font-bold uppercase mt-2">Statut actuel :</div>
              <div class="text-sm text-amber-600 font-bold">${mainConflict.status}</div>
              ${noteHtml}
            </div>
            ${infoText}
            `,
          showConfirmButton: isDeletingAllPills,
          showDenyButton: true,
          showCancelButton: true,
          confirmButtonColor: '#d33', // Overrides the default blue
          denyButtonColor: isDeletingAllPills ? '#0d59f2' : '#d33',
          cancelButtonColor: '#64748b',
          confirmButtonText: confirmText,
          denyButtonText: 'Planning uniquement',
          cancelButtonText: 'Annuler'
        });

        // On applique la décision à TOUTES les cellules de ce groupe
        if (result.isConfirmed) {
          group.forEach(c => { c.mode = 'full'; actionsToExecute.push(c); });
        } else if (result.isDenied) {
          group.forEach(c => { c.mode = 'planningOnly'; actionsToExecute.push(c); });
        }
      }
    }

    // ... (début de la fonction inchangé)
    if (actionsToExecute.length === 0) return;

    // 1. Extraire les IDs uniques des logements affectés
    const affectedLogIds = [...new Set(actionsToExecute.map(a => a.logementId))];

    showLoading('Suppression...');

    google.script.run
      .withSuccessHandler(() => {
        // 1. Mise à jour de la mémoire du navigateur sans appeler le backend
        updateLocalCacheAfterDeletion(actionsToExecute);
        
        // 2. Redessin instantané uniquement des lignes modifiées
        affectedLogIds.forEach(logId => {
          refreshSingleRowDOM(logId);
        });
        
        // 3. Nettoyage de l'interface
        document.querySelectorAll('.selected-cell').forEach(c => c.classList.remove('selected-cell'));
        showToast('Terminé');

        appLog(
          window.currentView,
          "bulk-delete",
          "SUPPRESSION_EN_MASSE",
          "Private",
          "Detail",
          {
            nombreActions: actionsToExecute.length,
            nombreLogements: affectedLogIds.length,
            logementsNettoyes: affectedLogIds
          }
        );
      })
      .withFailureHandler((err) => {
        showModal({
          icon: 'error',
          title: 'Erreur',
          text: err.message
        });
        appErrorLog(err, "handleDeletionAnalysis", {
          response: response,
          actionsCount: actionsToExecute.length,
          currentView: window.currentView
        });
      })
      .gsExecuteDeletion(APP_DATA.token, actionsToExecute, window.currentView);
  }

  // Fonction utilitaire pour vider les cellules supprimées de la mémoire locale
  function updateLocalCacheAfterDeletion(actions) {
    if (!window.lastPlanningData || !window.lastPlanningData.planning) return;

    const dates = window.lastPlanningData.headers.dates;

    actions.forEach(action => {
      // Trouver la ligne du logement
      const row = window.lastPlanningData.planning.find(p => String(p.id).trim() === String(action.logementId).trim());
      if (!row) return;

      // Retirer la tâche de la cellule de date correspondante
      const dateIdx = dates.indexOf(action.date);
      if (dateIdx !== -1 && row.tasks[dateIdx]) {
        let cellTasks = String(row.tasks[dateIdx]).split('|').map(t => t.trim()).filter(t => t.length > 0);
        // On retire la tâche ciblée
        cellTasks = cellTasks.filter(t => t.split('@')[0].trim() !== action.baseTask);
        row.tasks[dateIdx] = cellTasks.join(' | ');
      }

      // Nettoyage des Notes si c'est une suppression "complète" (Planning + Avancement)
      if (action.mode === 'full' && window.lastPlanningData.notes && window.lastPlanningData.notes[action.logementId]) {
        // Vérifier si cette tâche n'existe vraiment plus du tout sur toute la ligne
        const stillExists = row.tasks.some(taskStr => {
          if (!taskStr) return false;
          return String(taskStr).split('|').some(t => t.split('@')[0].trim() === action.baseTask);
        });
      
        // Si elle n'est plus planifiée, on supprime ses notes du cache
        if (!stillExists) {
          delete window.lastPlanningData.notes[action.logementId][action.baseTask];
        }
      }
    });
  }

  function saveIdNotes(logId, btnElement) {
    // 1. Récupération des valeurs depuis les bons éléments HTML
    const pubNote = document.getElementById('input-id-pub-note')?.value || "";
    const privNote = document.getElementById('input-id-priv-note')?.value || "";

    // 2. Formatage en JSON pour correspondre au système de lecture
    const notesJSON = JSON.stringify({ pub: pubNote, priv: privNote });

    // FIX E5: Resolve sheet row index from local cache to skip server-side column-A scan.
    const planRow = window.lastPlanningData?.planning?.find(p => String(p.id).trim() === String(logId).trim());
    const rowHint = planRow?.sheetRowIdx || null;

    // --- NOUVELLE LOGIQUE : Mise à jour conditionnelle du Statut Global ---
    const statusSelect = document.getElementById('input-id-status');
    const currentStatus = statusSelect ? statusSelect.value : "";
    
    // Condition A : Au moins l'une des deux notes n'est pas vide
    const hasNotes = (pubNote.trim() !== "" || privNote.trim() !== "");

    if (hasNotes && (!currentStatus || currentStatus === "")) {
      // S'il y a une note et aucun statut -> Basculer sur "Info"
      if (statusSelect) {
        statusSelect.value = "Info";
        updateSelectColor(statusSelect);
      }
      autoSaveGlobalStatus(logId, "Info");
      
    } else if (!hasNotes && currentStatus === "Info") {
      // Si les deux notes sont vides et que le statut est "Info" -> Effacer le statut
      if (statusSelect) {
        statusSelect.value = "";
        updateSelectColor(statusSelect);
      }
      autoSaveGlobalStatus(logId, "");
    }

    showLoading('Sauvegarde de la note...', '', true);

    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success === false && res.isUserNotice) {
          showModal({ icon: 'warning', title: 'Action impossible', text: res.message });
          return;
        }

        showToast('Note du logement enregistrée');

        refreshSingleRowDOM(logId);

        appLog(
          window.currentView,
          logId,
          "MODIFICATION_NOTES_LOGEMENT",
          "Public",
          "Detail",
          { notes: notesJSON }
        );

        // 3. Mise à jour du cache local pour la réouverture de la sidebar
        if (window.lastPlanningData && window.lastPlanningData.planning) {
          const rowIndex = window.lastPlanningData.planning.findIndex(p => String(p.id).trim() === String(logId).trim());
          if (rowIndex !== -1) {
            window.lastPlanningData.planning[rowIndex].comment = notesJSON;
          }
        }
      })
      .withFailureHandler((err) => {
        showModal({
          icon: 'error',
          title: 'Erreur',
          text: err.message
        });
        appErrorLog(err, "saveIdNotes", {
          logId: logId,
          notesJSON: notesJSON,
          currentView: window.currentView,
          projectId: PROJECT_ID || "Inconnu"
        });
      })
      .gsUpdateIdNotes(APP_DATA.token, logId, notesJSON, window.currentView, rowHint);
  }

  /**
  * Sauvegarde automatiquement le statut global lors du changement
  */
  function autoSaveGlobalStatus(logId, newStatus) {
    const selectEl = document.getElementById('input-id-status');
    if (selectEl) {
      selectEl.disabled = true;
      selectEl.classList.add('opacity-50'); 
    }

    const planRow = window.lastPlanningData?.planning?.find(p => String(p.id).trim() === String(logId).trim());
    const rowHint = planRow?.sheetRowIdx || null;
  
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success === false && res.isUserNotice) {
          if (selectEl) {
            selectEl.disabled = false;
            selectEl.classList.remove('opacity-50');
          }
          showModal({ icon: 'warning', title: 'Action impossible', text: res.message });
          return;
        }

        if (selectEl) {
          selectEl.disabled = false;
          selectEl.classList.remove('opacity-50');
        }
      
        showToast('Statut mis à jour');

        appLog(
          window.currentView,
          logId,
          "MODIFICATION_STATUT_GLOBAL",
          "Private",
          "Detail",
          { nouveauStatut: newStatus }
        );
      
        if (window.lastPlanningData && window.lastPlanningData.planning) {
          const rowIndex = window.lastPlanningData.planning.findIndex(p => String(p.id).trim() === String(logId).trim());
          if (rowIndex !== -1) {
            window.lastPlanningData.planning[rowIndex].status = newStatus;

          }
        }
      })
      .withFailureHandler((err) => {
        if (selectEl) {
          selectEl.disabled = false;
          selectEl.classList.remove('opacity-50');
        }
        showModal({
          icon: 'error',
          title: 'Erreur',
          text: 'Impossible de sauvegarder le statut'
        });

        appErrorLog(err, "autoSaveGlobalStatus", {
          logId: logId,
          newStatus: newStatus,
          currentView: window.currentView,
          projectId: PROJECT_ID || "Inconnu"
        });
      })
      .gsUpdateGlobalStatus(APP_DATA.token, logId, newStatus, window.currentView, rowHint);
  }

  // --- AIDE : Met à jour uniquement la ligne modifiée dans le DOM pour éviter le scroll jump ---
  function refreshSingleRowDOM(logId) {
    if (!window.lastPlanningData || !window.lastPlanningData.planning) return;
    const rowData = window.lastPlanningData.planning.find(p => String(p.id).trim() === String(logId).trim());
    if (!rowData) return;

    const oldTr = document.querySelector(`tr.planning-row[data-id="${logId}"]`);
    if (!oldTr) return;

    // Récupération des paramètres pour la reconstruction de la ligne
    const dates = window.lastPlanningData.headers.dates;
    const repairs = window.lastPlanningData.repairs || {};
    const notes = window.lastPlanningData.notes || {};
    const workingDays = window.lastPlanningData.headers.workingDays;
    const config = window.viewConfigs[window.currentView];
    // FIX E6: Compute todayIndex with a simple string comparison instead of
    // allocating two Date objects + toLocaleDateString per call.
    const todayStr   = new Date().toLocaleDateString('fr-CA');
    const todayIndex = dates.findIndex(d => d === todayStr);

    // Ajout des métadonnées comme le fait renderPlanningRows
    const rowWithMeta = { ...rowData, meta: window.lastPlanningData.logements[logId] || {} };

    // Reconstruction de la ligne avec votre fonction existante
    const newTr = buildRowElement(rowWithMeta, dates, repairs, notes, todayIndex, workingDays, config);

    // Préservation du surlignage de la ligne (Mode Normal)
    if (oldTr.classList.contains('row-highlight')) {
      newTr.classList.add('row-highlight');
    }

    // Remplacement de la ligne dans le DOM
    oldTr.parentNode.replaceChild(newTr, oldTr);

    // Réapplication des styles de sélection (Mode Édition)
    if (window.isEditModeActive && window.currentSelectionId) {
      const parts = window.currentSelectionId.split('|');
      let target = null;
      
      // CORRECTION : Traitement séparé pour les points d'intervention
      // parts[1] correspond à l'ID de l'intervention (ex: R-1234), et non au logId
      if (parts[0] === 'dot') {
        target = newTr.querySelector(`.greedy-dot[data-inter-id="${parts[1]}"]`);
      } 
      // Pour les tâches et le logement, parts[1] correspond bien au logId
      else if (parts[1] === String(logId)) {
        if (parts[0] === 'task' && parts[3]) {
          target = newTr.querySelector(`td[data-date="${parts[3]}"] .task-pill[data-task="${parts[2]}"]`);
        } else if (parts[0] === 'id') {
          target = newTr.querySelector('.sticky-id');
        }
      }
      
      if (target) {
        target.classList.add('active-edit-item');
        if (parts[0] === 'id') target.classList.add('active-edit-sticky');
        else target.classList.add('active-edit-grid');
      }
    }
  }

  // --- AIDE : Met à jour la tâche en cache local pour éviter les rechargements serveurs complets ---
  function updateTaskCacheLocally(logId, dateStr, taskAbbr, ampmMod, status, notesJSON) {
    if (!window.lastPlanningData || !window.lastPlanningData.planning) return;

    // 1. Mise à jour de la tâche dans la chaîne du planning (Format : ABBR@AMPM@STATUS@NOTE)
    let row = window.lastPlanningData.planning.find(r => String(r.id).trim() === String(logId).trim());
    if (row && row.tasks) {
      // CORRECTION : On boucle sur TOUTES les dates de la ligne pour synchroniser toutes les pastilles identiques
      for (let i = 0; i < row.tasks.length; i++) {
        if (row.tasks[i]) {
          let cellTasks = String(row.tasks[i]).split('|').map(t => t.trim()).filter(t => t.length > 0);
          
          let hasChanged = false;
          let updatedTasks = cellTasks.map(t => {
            let parts = t.split('@');
            if (parts[0].trim() === taskAbbr) {
              hasChanged = true;
              let res = taskAbbr;
              if (ampmMod) res += `@${ampmMod}`;
              if (status || notesJSON) res += `@${status || ""}`; // Inclut le statut même vide si une note suit
              if (notesJSON) res += `@${notesJSON}`;
              return res;
            }
            return t;
          });

          // N'appliquer la mise à jour que si on a trouvé la tâche dans cette cellule
          if (hasChanged) {
            row.tasks[i] = updatedTasks.join('|');
          }
        }
      }
    }

    // 2. Mise à jour du dictionnaire des notes (Gère l'apparition/disparition du point vert)
    if (!window.lastPlanningData.notes) window.lastPlanningData.notes = {};
    if (!window.lastPlanningData.notes[logId]) window.lastPlanningData.notes[logId] = {};
    
    // Si la note est vide (ou qu'elle contient un JSON vide)
    const isNoteEmpty = !notesJSON || notesJSON === '{"pub":"","int":""}' || notesJSON === '{"pub":"","priv":""}';
    
    if (!isNoteEmpty) {
      window.lastPlanningData.notes[logId][taskAbbr] = notesJSON;
    } else {
      delete window.lastPlanningData.notes[logId][taskAbbr];
    }
  }

          showModal({ icon: 'warning', title: 'Action impossible', text: res.message });

          dateStr: dateStr,

  // =========================================================
  // TASK EDITOR LOGIC (SAVE & DOMINO MODAL)
  // =========================================================
  
  function triggerDominoEffect(logId, taskAbbr, oldDateStr, newDateStr) {
    if (!newDateStr || oldDateStr === newDateStr) return;
    
    // --- DEMANDE 1 : VÉRIFICATION JOURS NON OUVRÉS ---
    if (window.lastPlanningData && window.lastPlanningData.headers) {
      const dates = window.lastPlanningData.headers.dates;
      const workingDays = window.lastPlanningData.headers.workingDays;
      const targetDateIdx = dates.indexOf(newDateStr);

      if (targetDateIdx !== -1 && workingDays[targetDateIdx] == 0) {
        // Alerte si l'utilisateur choisit un jour non ouvré
        showModal({
          icon: 'warning',
          title: 'Date non valide',
          text: "Vous avez sélectionné un jour non ouvré. Veuillez choisir une autre date."
        });
        // Réinitialisation de la valeur du calendrier à la date initiale
        const inputTaskDate = document.getElementById('input-task-date');
        if (inputTaskDate) inputTaskDate.value = oldDateStr;
        return;
      }
    }

    // --- DEMANDE 2 : VÉRIFICATION DE L'AVANCEMENT (Comme pour la suppression) ---
    // Préparation des données au format attendu par le moteur d'analyse backend
    const cleanCellsData = [{
      logementId: String(logId),
      cellContent: String(taskAbbr),
      date: String(oldDateStr)
    }];

    showLoading('Analyse...', "Vérification de l'avancement avant déplacement...");

    // Appel du moteur d'analyse existant côté serveur
    google.script.run
      .withSuccessHandler(async (response) => {
        if (!response || !response.success) {
          showModal({
            icon: 'error',
            title: 'Erreur Backend',
            text: response ? response.error : 'Réponse invalide'
          });
          resetCalendarInput(oldDateStr);
          return;
        }

        // NOUVEAU : On filtre les conflits pour ignorer "Planifié" (s'il n'y a pas de note)
        const conflicts = (response.conflicts || []).filter(c => {
          const hasNote = c.note && c.note.trim() !== "";
          const isJustPlanned = c.status === "Planifié";
          return hasNote || !isJustPlanned;
        });
        
        // S'il y a un avancement saisi (conflit détecté)
        if (conflicts.length > 0) {
          const mainConflict = conflicts[0];
          const hasNote = !!mainConflict.note;

          let statutActuel = (mainConflict.status && mainConflict.status !== "Vide") 
                              ? mainConflict.status 
                              : "Non spécifié";
          
          let noteHtml = '';
          if (hasNote) {
            let pubNote = "";
            let privNote = "";
            
            try {
              // Parse le JSON de la note en toute sécurité
              const parsed = typeof mainConflict.note === 'string' && mainConflict.note.trim().startsWith('{')
                ? JSON.parse(mainConflict.note)
                : { pub: mainConflict.note, priv: "" };
                
              pubNote = parsed.pub || "";
              privNote = parsed.int || parsed.priv || ""; // Gère les deux clés d'anciennes/nouvelles notes
            } catch (e) {
              pubNote = mainConflict.note; // Fallback texte brut
            }

            // Génération de l'affichage HTML séparé
            if (pubNote) {
              noteHtml += `
                <div class="text-xs text-slate-500 font-bold uppercase mt-2">Note :</div>
                <div class="text-sm text-blue-600">${pubNote}</div>
              `;
            }
            if (privNote) {
              noteHtml += `
                <div class="text-xs text-slate-500 font-bold uppercase mt-2">Note Privée :</div>
                <div class="text-sm text-indigo-600">${privNote}</div>
              `;
            }
          }

          // Demander la confirmation à l'utilisateur
          const resultConfirm = await showModal({
            title: "Données détectées",
            icon: "warning",
            html: `
              <div class="text-left text-sm mb-3">La tâche <b>${taskAbbr}</b> pour le logement <b>${logId}</b> possède déjà des données associées.</div>
              <div class="bg-slate-50 p-2 rounded border border-slate-200 mb-3 text-left">
                <div class="text-xs text-slate-500 font-bold uppercase">Dates au récap :</div>
                <div class="text-sm text-primary font-mono">${mainConflict.recapDates || "Aucune"}</div>
                <div class="text-xs text-slate-500 font-bold uppercase mt-2">Statut actuel :</div>
                <div class="text-sm text-amber-600 font-bold">${statutActuel}</div>
                ${noteHtml}
              </div>
              <div class="text-left text-sm font-bold text-slate-700">Voulez-vous tout de même déplacer cette tâche ?</div>
            `,
            showCancelButton: true,
            confirmButtonText: "Oui, déplacer",
            cancelButtonText: "Annuler",
            confirmButtonColor: "#d33",
            cancelButtonColor: "#3085d6"
          });

          if (!resultConfirm.isConfirmed) {
            resetCalendarInput(oldDateStr);
            return; // Annulation complète par l'utilisateur
          }
        }

        // Si aucun conflit ou si l'utilisateur a validé le forçage, on passe à l'analyse de contiguïté
        proceedWithContiguityRadar(logId, taskAbbr, oldDateStr, newDateStr);
      })
      .withFailureHandler((err) => {
        showModal({
          icon: 'error',
          title: 'Erreur serveur',
          text: err.message
        });
        resetCalendarInput(oldDateStr);
        appErrorLog(err, "triggerDominoEffect_analyze", {
          logId: logId,
          taskAbbr: taskAbbr,
          oldDateStr: oldDateStr,
          newDateStr: newDateStr,
          cleanCellsData: cleanCellsData,
          currentview: window.currentView,
          projectId: PROJECT_ID || "Inconnu"
        });
      })
      .gsAnalyzeDeletion(APP_DATA.token, cleanCellsData, window.currentView);
  }

  // Fonction utilitaire pour réinitialiser le calendrier visuel
  function resetCalendarInput(oldDateStr) {
    const inputTaskDate = document.getElementById('input-task-date');
    if (inputTaskDate) inputTaskDate.value = oldDateStr;
  }

  // Extraction de la suite logique : Phase 1, 2 et 3 de l'architecture initiale
  function proceedWithContiguityRadar(logId, taskAbbr, oldDateStr, newDateStr) {
    // --- PHASE 1 : LE RADAR (Analyse des conditions A, B, C, D) ---
    // Condition A : La tâche a une pastille avant
    let hasSameTaskLeft = false;
    // Condition B : La tâche a une pastille après
    let hasSameTaskRight = false;
    // Condition C : Il y a une AUTRE tâche collée avant
    let hasDifferentTaskLeftContiguous = false;
    // Condition D : Il y a une AUTRE tâche collée après
    let hasDifferentTaskRightContiguous = false;

    if (window.lastPlanningData && window.lastPlanningData.planning) {
      const rowData = window.lastPlanningData.planning.find(p => p.id === logId);
      if (rowData && rowData.tasks) {
        const workingDays = window.lastPlanningData.headers.workingDays;
        const tasksArr = rowData.tasks;
        const targetIdx = window.lastPlanningData.headers.dates.indexOf(oldDateStr);

        if (targetIdx !== -1) {
          const getBaseTasks = (cellContent) => {
            if (!cellContent) return [];
            return String(cellContent).split('|').map(t => t.split('@')[0].trim()).filter(t => t.length > 0);
          };
          const baseTaskAbbr = taskAbbr.split('@')[0].trim();

          // Scan Gauche (Passé)
          for (let i = targetIdx - 1; i >= 0; i--) {
            if (workingDays[i] == 0) continue; // Sauter les week-ends

            const cellTasks = getBaseTasks(tasksArr[i]);
            if (cellTasks.length === 0) break; // Cellule vide = bloc rompu

            if (cellTasks.includes(baseTaskAbbr)) {
              hasSameTaskLeft = true; // Condition A
            }
            if (cellTasks.some(t => t !== baseTaskAbbr)) {
              hasDifferentTaskLeftContiguous = true; // Condition C
            }
            if (!cellTasks.includes(baseTaskAbbr)) {
              break; // On a touché une autre tâche pure, on arrête le scan
            }
          }

          // Scan Droite (Futur)
          for (let i = targetIdx + 1; i < tasksArr.length; i++) {
            if (workingDays[i] == 0) continue; // Sauter les week-ends

            const cellTasks = getBaseTasks(tasksArr[i]);
            if (cellTasks.length === 0) break; // Cellule vide = bloc rompu

            if (cellTasks.includes(baseTaskAbbr)) {
              hasSameTaskRight = true; // Condition B
            }
            if (cellTasks.some(t => t !== baseTaskAbbr)) {
              hasDifferentTaskRightContiguous = true; // Condition D
            }
            if (!cellTasks.includes(baseTaskAbbr)) {
              break; // On a touché une autre tâche pure, on arrête le scan
            }
          }
        }
      }
    }

    // --- PHASE 2 : GÉNÉRATION DES 5 OPTIONS ---
    let choicesHtml = '';

    // 1 - TOUJOURS : Déplacer seulement cette pastille
    choicesHtml += `
      <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer transition-all">
        <input type="radio" name="domino-strategy" value="only-this" checked class="mt-1 text-primary focus:ring-primary">
        <div>
          <span class="font-bold text-slate-800 block text-sm">Cette pastille uniquement</span>
          <span class="text-xs text-slate-400 block">Seule cette journée bouge. Aucun impact sur le reste.</span>
        </div>
      </label>
    `;

    // 2 - Si Condition A ou B : Déplacer toute la tâche
    if (hasSameTaskLeft || hasSameTaskRight) {
      choicesHtml += `
        <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer transition-all">
          <input type="radio" name="domino-strategy" value="entire-task" class="mt-1 text-primary focus:ring-primary">
          <div>
            <span class="font-bold text-slate-800 block text-sm">Toutes les pastilles de cette tâche</span>
            <span class="text-xs text-slate-400 block">Déplace l'intégralité de la tâche de manière groupée.</span>
          </div>
        </label>
      `;
    }

    // 3 - Si Condition A : Déplacer cette pastille et les suivantes de la même tâche
    if (hasSameTaskLeft && hasSameTaskRight) {
      choicesHtml += `
        <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer transition-all">
          <input type="radio" name="domino-strategy" value="task-from-here" class="mt-1 text-primary focus:ring-primary">
          <div>
            <span class="font-bold text-slate-800 block text-sm">Cette pastille et les suivantes (même tâche)</span>
            <span class="text-xs text-slate-400 block">Déplace à partir de ce jour, sans toucher au travail déjà fait.</span>
          </div>
        </label>
      `;
    }

    // 4 - Si Condition C ou D : Déplacer toute la tâche + les autres tâches autour
    if (hasDifferentTaskLeftContiguous || hasDifferentTaskRightContiguous) {
      choicesHtml += `
        <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer transition-all">
          <input type="radio" name="domino-strategy" value="entire-block" class="mt-1 text-primary focus:ring-primary">
          <div>
            <span class="font-bold text-slate-800 block text-sm">Tout le bloc d'intervention (avant et après)</span>
            <span class="text-xs text-slate-400 block">Déplace toute la chaîne d'interventions collées, tous corps d'état confondus.</span>
          </div>
        </label>
      `;
    }

    // 5 - Si Condition D : Déplacer cette pastille + toutes les suivantes (même et autres tâches)
    if (hasDifferentTaskRightContiguous) {
      choicesHtml += `
        <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer transition-all">
          <input type="radio" name="domino-strategy" value="this-and-all-successors" class="mt-1 text-primary focus:ring-primary">
          <div>
            <span class="font-bold text-slate-800 block text-sm">Cette pastille et TOUTES les interventions suivantes</span>
            <span class="text-xs text-slate-400 block">Déplace tout ce qui s'enchaîne à partir de ce jour.</span>
          </div>
        </label>
      `;
    }

    const pNew = newDateStr.split('-');
    const displayNewDate = `${pNew[2]}/${pNew[1]}/${pNew[0]}`;

    showModal({
      icon: 'question',
      title: 'Stratégie de déplacement',
      width: '600px', // showModal handles this perfectly
      html: `
        <div class="text-left mb-4 text-xs text-slate-500 font-semibold bg-slate-50 p-3 rounded-xl border border-slate-200">
          Déplacement de <b>${taskAbbr}</b> au <span class="text-primary font-bold">${displayNewDate}</span>.
        </div>
        <div class="flex flex-col gap-2.5 text-left max-h-[50vh] overflow-y-auto">
          ${choicesHtml}
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'Appliquer',
      cancelButtonText: 'Annuler',
      preConfirm: () => {
        const selected = document.querySelector('input[name="domino-strategy"]:checked');
        if (!selected) {
          Swal.showValidationMessage("Veuillez sélectionner une option.");
          return false;
        }
        return selected.value;
      }
    }).then((result) => {
      if (result.isConfirmed) {
        executeShift(logId, taskAbbr, oldDateStr, newDateStr, result.value);
      } else {
        resetCalendarInput(oldDateStr);
      }
    });
  }

  function updateLocalCacheAfterDomino(logId, taskAbbr, oldDateStr, newDateStr, mode) {
    if (!window.lastPlanningData || !window.lastPlanningData.planning) return;

    const row = window.lastPlanningData.planning.find(p => String(p.id).trim() === String(logId).trim());
    if (!row || !row.tasks) return;

    const dates = window.lastPlanningData.headers.dates;
    const workingDays = window.lastPlanningData.headers.workingDays;

    const oldTimelineIdx = dates.indexOf(oldDateStr);
    const newTimelineIdx = dates.indexOf(newDateStr);

    // Si le départ ou l'arrivée est hors écran, on laisse la synchronisation globale s'en charger au prochain scroll
    if (oldTimelineIdx === -1 || newTimelineIdx === -1) return; 

    // Calcul du delta de déplacement en jours ouvrés
    let workingDaysDelta = 0;
    const step = oldTimelineIdx <= newTimelineIdx ? 1 : -1;
    let curr = oldTimelineIdx;
    while (curr !== newTimelineIdx) {
        curr += step;
        if (workingDays[curr] != 0) workingDaysDelta += step;
    }

    const targetBaseTaskUpper = taskAbbr.toUpperCase().split('@')[0].trim();

    const getBaseTasks = (idx) => {
        if (!row.tasks[idx]) return [];
        return String(row.tasks[idx]).split('|').map(t => t.trim()).filter(t => t.length > 0);
    };
    const hasBaseTask = (idx, base) => getBaseTasks(idx).some(t => t.toUpperCase().split('@')[0] === base);
    const hasAnyTask = (idx) => getBaseTasks(idx).length > 0;
    const isWorking = (idx) => workingDays[idx] != 0;

    let indices = [];

    // Identification des blocs à déplacer (identique au Backend)
    if (mode === 'only-this') {
        indices.push(oldTimelineIdx);
    } else if (mode === 'entire-task') {
        for (let i = oldTimelineIdx; i >= 0; i--) {
            if (!isWorking(i)) continue;
            if (hasBaseTask(i, targetBaseTaskUpper)) indices.push(i); else break;
        }
        for (let i = oldTimelineIdx + 1; i < dates.length; i++) {
            if (!isWorking(i)) continue;
            if (hasBaseTask(i, targetBaseTaskUpper)) indices.push(i); else break;
        }
    } else if (mode === 'task-from-here') {
        for (let i = oldTimelineIdx; i < dates.length; i++) {
            if (!isWorking(i)) continue;
            if (hasBaseTask(i, targetBaseTaskUpper)) indices.push(i); else break;
        }
    } else if (mode === 'entire-block') {
        for (let i = oldTimelineIdx; i >= 0; i--) {
            if (!isWorking(i)) continue;
            if (hasAnyTask(i)) indices.push(i); else break;
        }
        for (let i = oldTimelineIdx + 1; i < dates.length; i++) {
            if (!isWorking(i)) continue;
            if (hasAnyTask(i)) indices.push(i); else break;
        }
    } else if (mode === 'this-and-all-successors') {
        for (let i = oldTimelineIdx; i < dates.length; i++) {
            if (!isWorking(i)) continue;
            if (hasAnyTask(i)) indices.push(i); else break;
        }
    }

    indices = [...new Set(indices)].sort((a, b) => a - b);
    let tasksToRemove = [];
    let tasksToAdd = [];

    indices.forEach(idx => {
        const cellTasks = getBaseTasks(idx);
        cellTasks.forEach(t => {
            const tBase = t.toUpperCase().split('@')[0];
            let shouldMove = false;

            if (mode === 'only-this' || mode === 'entire-task' || mode === 'task-from-here') {
                if (tBase === targetBaseTaskUpper) shouldMove = true;
            } else {
                shouldMove = true; // Tous les corps d'état
            }

            if (shouldMove) {
                tasksToRemove.push({ originalIdx: idx, task: t });

                let targetIdx = idx;
                if (workingDaysDelta !== 0) {
                    let remaining = Math.abs(workingDaysDelta);
                    const stepMove = workingDaysDelta > 0 ? 1 : -1;
                    while (remaining > 0) {
                        targetIdx += stepMove;
                        if (targetIdx < 0 || targetIdx >= dates.length) break;
                        if (workingDays[targetIdx] != 0) remaining--;
                    }
                }

                // SÉCURITÉ : Si la tâche atterrit en dehors de notre fenêtre de 50 jours, on l'ignore (le backend s'en chargera pour la base de données).
                if (targetIdx >= 0 && targetIdx < dates.length) {
                    tasksToAdd.push({ targetIdx: targetIdx, task: t });
                }
            }
        });
    });

    // Application stricte au tableau local (row.tasks)
    let updatedRowTasks = [...row.tasks];

    tasksToRemove.forEach(item => {
        let arr = String(updatedRowTasks[item.originalIdx] || "").split('|').map(t => t.trim()).filter(t => t.length > 0);
        const idx = arr.findIndex(t => t.toUpperCase() === item.task.toUpperCase());
        if (idx !== -1) {
            arr.splice(idx, 1);
            updatedRowTasks[item.originalIdx] = arr.join(' | ');
        }
    });

    tasksToAdd.forEach(item => {
        let arr = String(updatedRowTasks[item.targetIdx] || "").split('|').map(t => t.trim()).filter(t => t.length > 0);
        if (arr.indexOf(item.task) === -1) {
            arr.push(item.task);
            updatedRowTasks[item.targetIdx] = arr.join(' | ');
        }
    });

    row.tasks = updatedRowTasks;
}

  // =========================================================
  // BOUTONS D'ACTION DE LA FICHE — Historique / Valider / Corriger
  // =========================================================
  // Même "cerveau" que EDL_Script_2.txt : showHistoryModal() vient de
  // ClientLib.txt (partagé), validateReservesIntervention() et
  // gsCorrectInterventionReference() viennent de EDL_gs.txt mais sont
  // globales à tout le projet Apps Script — aucune modification serveur
  // n'était nécessaire pour ces deux-là. Adapté ici pour fonctionner sur
  // l'intervention actuellement affichée dans #sidebar-content (fetch à la
  // demande via gsGetInterventionDetails) plutôt que sur un tableau
  // interventionsCache en mémoire comme côté EDL, puisque Planning n'affiche
  // qu'une intervention à la fois.
  //
  // NOTE : le bouton "Corriger" ne propose ici QUE "La référence" (la
  // correction de statut existe déjà par ailleurs sur cette page, via la
  // section "Informations Techniques" de la fiche) — pas de dispatcher
  // "Le statut" / "La référence" comme côté EDL.

  // "15/06/2026" -> vrai si strictement postérieure à aujourd'hui. Même
  // logique que isFutureDateFr() côté EDL, adaptée au format "dd/MM/yyyy"
  // (avec slashs) que renvoie gsGetInterventionDetails() ici, au lieu de
  // l'affichage "MAR. 09 JUIN 2026" utilisé côté EDL.
  function isFutureDateSlash(dateStr) {
    if (!dateStr || !dateStr.includes('/')) return false;
    const parts = dateStr.split('/');
    if (parts.length !== 3) return false;
    const d = new Date(parts[2], parts[1] - 1, parts[0]);
    if (isNaN(d.valueOf())) return false;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return d > today;
  }

  // Compression identique à celle utilisée côté EDL pour les photos jointes
  // à la validation — Planning n'en avait pas encore de copie.
  function compressImageToWebP(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(1, 800 / Math.max(img.width, img.height));
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/webp', 0.8).split(',')[1]);
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

    let photosPayload = [];
    const { isConfirmed, value } = await Swal.fire({
