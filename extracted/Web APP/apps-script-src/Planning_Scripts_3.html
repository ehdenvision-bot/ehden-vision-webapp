  // ---------------------------------------------------------
  // CORRIGER — "La référence" (réassignation à un autre logement)
  // ---------------------------------------------------------
  // Réutilise gsCorrectInterventionReference() (EDL_gs.txt, générique à tout
  // le projet — retrouve l'intervention par ID dans tout le classeur
  // Réserves, quel que soit l'onglet). Le sélecteur en cascade est
  // reconstruit avec les données propres à Planning : window.viewConfigs
  // pour les libellés de champs, et le nouveau gsGetLogementsStructure()
  // (Planning_gs.txt) pour une structure Bâtiment/Hall/Étage-Orientation/
  // Porte-Description-Trame/ID complète et jamais filtrée par un éventuel
  // filtre Bâtiment actif sur la grille.
  //
  // Cascade à 4 niveaux, uniforme sur les 3 vues (demande explicite —
  // volontairement différent des 3-4 niveaux asymétriques d'EDL) :
  //   1. Vue courante (contexte, non interactif — celle déjà ouverte)
  //   2. Bâtiment - Hall (locataires/communs) OU Orientation (façades)
  //   3. Étage (locataires/communs) OU Trame (façades)
  //   4. ID — toujours une sélection finale à part entière : Porte
  //      (locataires), Description (communs), ou Partie (façades).
  // Pour les façades, le niveau 2 est l'Orientation seule (pas de Bâtiment/
  // Hall) : c'est une lecture littérale de la demande — si un projet a
  // plusieurs bâtiments, le libellé de chaque option du niveau 4 inclut son
  // Bâtiment/Hall pour lever toute ambiguïté malgré ce raccourci.

  window._planRefCorrStructureCache = window._planRefCorrStructureCache || {};

  function planRefCorrFetchStructure(view) {
    if (window._planRefCorrStructureCache[view]) {
      return Promise.resolve(window._planRefCorrStructureCache[view]);
    }
    return new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler((list) => {
        window._planRefCorrStructureCache[view] = list || [];
        resolve(window._planRefCorrStructureCache[view]);
      }).withFailureHandler(reject)
        .gsGetLogementsStructure(APP_DATA.token, APP_DATA.projectId, view));
  }

  function planRefCorrFieldLabel(view, fieldId, fallback) {
    const cfg = (window.viewConfigs && window.viewConfigs[view]) || [];
    const found = cfg.find(c => c.id === fieldId);
    return (found && found.label) ? found.label : fallback;
  }

  function planRefCorrViewLabel(view) {
    return view === 'communs' ? 'Communs' : (view === 'facades' ? 'Façades' : 'Locataires');
  }

  function planRefCorrPopulateL2(view, list, preselectKey) {
    const sel = document.getElementById('planrefcorr-l2');
    if (view === 'facades') {
      sel.innerHTML = `<option value="" disabled selected>Orientation</option>`;
      const orientations = [...new Set(list.map(i => String(i.orientation || '').trim()).filter(v => v !== ''))];
      orientations.sort().forEach(o => {
        sel.innerHTML += `<option value="${o}" ${o === preselectKey ? 'selected' : ''}>${o}</option>`;
      });
    } else {
      sel.innerHTML = `<option value="" disabled selected>Bâtiment - Hall</option>`;
      const map = new Map();
      list.forEach(item => {
        if (!item.batiment) return;
        const bat = String(item.batiment).trim();
        const hall = item.hall ? String(item.hall).trim() : "";
        const key = `${bat}||${hall}`;
        if (!map.has(key)) map.set(key, { bat, hall });
      });
      const sorted = Array.from(map.entries()).sort((a, b) => {
        if (a[1].bat !== b[1].bat) return a[1].bat.localeCompare(b[1].bat, undefined, { numeric: true });
        return a[1].hall.localeCompare(b[1].hall, undefined, { numeric: true });
      });
      sorted.forEach(([key, val]) => {
        const label = val.hall ? `Bât. ${val.bat} - Hall ${val.hall}` : `Bât. ${val.bat}`;
        sel.innerHTML += `<option value="${key}" ${key === preselectKey ? 'selected' : ''}>${label}</option>`;
      });
    }
  }

  function planRefCorrFilterByL2(view, list, l2Value) {
    if (view === 'facades') {
      return list.filter(i => String(i.orientation || '').trim() === l2Value);
    }
    const [bat, hall] = String(l2Value || '').split('||');
    return list.filter(i => String(i.batiment || '').trim() === bat && String(i.hall || '').trim() === (hall || ''));
  }

  function planRefCorrPopulateL3(view, list, l2Value, preselectVal) {
    const sel = document.getElementById('planrefcorr-l3');
    const label = view === 'facades' ? 'Trame' : planRefCorrFieldLabel(view, 'etage', 'Étage');
    sel.innerHTML = `<option value="" disabled selected>${label}</option>`;
    const filtered = planRefCorrFilterByL2(view, list, l2Value);

    if (view === 'facades') {
      const trames = [...new Set(filtered.map(f => String(f.trame_filter_val || f.trame || '').trim()).filter(Boolean))];
      trames.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      trames.forEach(t => {
        sel.innerHTML += `<option value="${t}" ${t === preselectVal ? 'selected' : ''}>${t}</option>`;
      });
    } else {
      const etages = [...new Set(filtered.map(i => String(i.etage ?? '').trim()).filter(v => v !== ''))];
      etages.sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).forEach(e => {
        sel.innerHTML += `<option value="${e}" ${e === preselectVal ? 'selected' : ''}>${label} ${e}</option>`;
      });
    }
    sel.disabled = false;
  }

  function planRefCorrPopulateL4(view, list, l2Value, l3Value) {
    const sel = document.getElementById('planrefcorr-l4');
    sel.innerHTML = `<option value="" disabled selected>ID</option>`;
    const filtered = planRefCorrFilterByL2(view, list, l2Value).filter(i => {
      return view === 'facades'
        ? String(i.trame_filter_val || i.trame || '').trim() === l3Value
        : String(i.etage ?? '').trim() === l3Value;
    });

    if (view === 'locataires') {
      filtered.sort((a, b) => String(a.porte || '').localeCompare(String(b.porte || ''), undefined, { numeric: true }));
      filtered.forEach(loc => {
        const occupant = (loc.nom || loc.prenom) ? ` — ${(loc.nom || '')} ${(loc.prenom || '')}`.trim() : '';
        sel.innerHTML += `<option value="${loc.id}">Porte ${loc.porte || loc.id}${occupant} (${loc.id})</option>`;
      });
    } else if (view === 'communs') {
      filtered.sort((a, b) => String(a.description || '').localeCompare(String(b.description || '')));
      filtered.forEach(com => {
        sel.innerHTML += `<option value="${com.id}">${com.description || com.id} (${com.id})</option>`;
      });
    } else if (view === 'facades') {
      filtered.sort((a, b) => String(a.partie || '').localeCompare(String(b.partie || ''), undefined, { numeric: true }));
      filtered.forEach(f => {
        const partieName = (f.partie && String(f.partie).trim() !== '') ? `Partie ${String(f.partie).trim()}` : 'Trame complète';
        const batHall = f.hall ? `Bât. ${f.batiment} - Hall ${f.hall}` : `Bât. ${f.batiment}`;
        sel.innerHTML += `<option value="${f.id}">${batHall} — ${partieName} (${f.id})</option>`;
      });
    }
    sel.disabled = false;
  }

  async function openPlanningReferenceCorrectionModal(interventionId) {
    const view = window.currentView || 'locataires';
    const isReserve = String(interventionId).startsWith('R-');

    showLoading('Chargement...', 'Récupération de la structure du bâtiment');
    let details, structureList;
    try {
      [details, structureList] = await Promise.all([
        new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
          .gsGetInterventionDetails(APP_DATA.token, interventionId, view, isClient)),
        planRefCorrFetchStructure(view)
      ]);
    } catch (e) {
      Swal.close();
      showModal({ icon: 'error', title: 'Erreur', text: "Impossible de charger les données nécessaires à la correction." });
      appErrorLog(e, "openPlanningReferenceCorrectionModal", { interventionId, view });
      return;
    }
    Swal.close();
    if (!details) return;

    const oldLogementId = details.logement || '';
    const oldItem = structureList.find(i => String(i.id).trim() === String(oldLogementId).trim());
    const oldLogementLabel = oldItem
      ? (oldItem.nom ? `${oldItem.nom} ${oldItem.prenom || ''} (${oldLogementId})`.trim()
         : (oldItem.description ? `${oldItem.description} (${oldLogementId})`
            : `${oldItem.trame || ''}${oldItem.partie ? ' - Partie ' + oldItem.partie : ''} (${oldLogementId})`.trim()))
      : oldLogementId;

    const preselectL2 = oldItem
      ? (view === 'facades' ? String(oldItem.orientation || '').trim() : `${String(oldItem.batiment || '').trim()}||${oldItem.hall ? String(oldItem.hall).trim() : ''}`)
      : null;
    const preselectL3 = oldItem
      ? (view === 'facades' ? String(oldItem.trame_filter_val || oldItem.trame || '').trim() : String(oldItem.etage || '').trim())
      : null;

    const l2Label = view === 'facades' ? 'Orientation' : 'Bâtiment - Hall';
    const l3Label = view === 'facades' ? 'Trame' : planRefCorrFieldLabel(view, 'etage', 'Étage');

    Swal.fire({
      title: `<div class="text-xl font-black text-slate-800">Modifier la Référence</div>
              <div class="text-xs font-medium text-slate-500 mt-1 uppercase tracking-wider">Intervention ID : ${interventionId}</div>`,
      html: `
        <div class="flex flex-col gap-4 mt-2 text-left">
          <div class="text-xs bg-slate-50 border border-slate-200 rounded-lg p-2">
            Vue : <b>${planRefCorrViewLabel(view)}</b><br>
            Référence actuelle : <b>${oldLogementLabel || 'Inconnue'}</b>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">${l2Label}</label>
            <select id="planrefcorr-l2" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50">
              <option value="" disabled selected>${l2Label}</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">${l3Label}</label>
            <select id="planrefcorr-l3" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50" disabled>
              <option value="" disabled selected>${l3Label}</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ID</label>
            <select id="planrefcorr-l4" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50" disabled>
              <option value="" disabled selected>ID</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Motif de la correction <span class="text-red-500">*</span></label>
            <textarea id="planrefcorr-note" rows="2" placeholder="Ex: Réserve rattachée au mauvais lot lors de la saisie..." class="w-full rounded-lg border-slate-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50"></textarea>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'Continuer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#0d59f2',
      focusConfirm: false,
      didOpen: () => {
        const selL2 = document.getElementById('planrefcorr-l2');
        const selL3 = document.getElementById('planrefcorr-l3');
        const selL4 = document.getElementById('planrefcorr-l4');

        planRefCorrPopulateL2(view, structureList, preselectL2);

        selL2.addEventListener('change', (e) => {
          selL4.innerHTML = `<option value="" disabled selected>ID</option>`;
          selL4.disabled = true;
          planRefCorrPopulateL3(view, structureList, e.target.value, null);
        });

        selL3.addEventListener('change', (e) => {
          planRefCorrPopulateL4(view, structureList, selL2.value, e.target.value);
        });

        // Pré-remplissage niveaux 2 & 3 depuis la référence actuelle (épargne
        // des clics) — le niveau 4 (ID) reste volontairement vide pour forcer
        // un choix actif et éviter de "corriger" vers la même référence.
        if (preselectL2) {
          selL2.value = preselectL2;
          planRefCorrPopulateL3(view, structureList, preselectL2, preselectL3);
          if (preselectL3) selL3.value = preselectL3;
        }
      },
      preConfirm: () => {
        const note = document.getElementById('planrefcorr-note').value.trim();
        if (!note) {
          Swal.showValidationMessage("Le motif de la correction est obligatoire pour l'historique.");
          return false;
        }
        const l4 = document.getElementById('planrefcorr-l4');
        if (!l4 || !l4.value) {
          Swal.showValidationMessage("Complétez la sélection pour identifier la référence cible.");
          return false;
        }
        const newId = l4.value;
        const newLabel = l4.options[l4.selectedIndex].text;

        if (String(newId).trim() === String(oldLogementId).trim()) {
          Swal.showValidationMessage("La nouvelle référence est identique à la référence actuelle.");
          return false;
        }

        return {
          id: interventionId,
          isReserve: isReserve,
          moduleView: view,
          note: note,
          newLogementId: newId,
          newLogementLabel: newLabel
        };
      }
    }).then((result) => {
      if (!result.isConfirmed) return;
      const data = result.value;

      const hasPlanning = !!(details.dateStr && String(details.dateStr).trim() !== '');

      if (hasPlanning) {
        Swal.fire({
          title: 'Intervention déjà planifiée',
          html: `Cette intervention est planifiée le <b>${details.dateStr}${details.creneau ? ' à ' + details.creneau : ''}</b>.<br>Que souhaitez-vous faire de cette planification ?`,
          icon: 'question',
          showDenyButton: true,
          showCancelButton: true,
          confirmButtonText: 'Déplacer vers la nouvelle référence',
          denyButtonText: 'Retirer du planning',
          cancelButtonText: 'Annuler la correction',
          confirmButtonColor: '#0d59f2',
          denyButtonColor: '#e11d48'
        }).then((planChoice) => {
          if (planChoice.isConfirmed) submitPlanningReferenceCorrection(Object.assign({}, data, { planningAction: 'move' }));
          else if (planChoice.isDenied) submitPlanningReferenceCorrection(Object.assign({}, data, { planningAction: 'remove' }));
          // Annuler/fermer : on abandonne toute la correction, rien n'est envoyé.
        });
      } else {
        submitPlanningReferenceCorrection(Object.assign({}, data, { planningAction: null }));
      }
    });
  }

  function submitPlanningReferenceCorrection(data) {
    showLoading('Correction en cours...', 'Mise à jour de la référence');

    const payload = {
      interId: data.id,
      newLogementId: data.newLogementId,
      newLogementLabel: data.newLogementLabel,
      planningAction: data.planningAction, // 'move' | 'remove' | null
      note: data.note,
      moduleView: data.moduleView,
      userEmail: (typeof APP_USER_EMAIL !== 'undefined') ? APP_USER_EMAIL : "Email inconnu"
    };

    const oldLogId = window.currentInterventionLogId;

    google.script.run
      .withSuccessHandler((res) => {
        if (res.planningWarning) {
          showToast('Référence corrigée — vérifiez le planning', 'warning', res.planningWarning, 4500);
        } else {
          showToast('Référence corrigée avec succès', 'success');
        }

        const structuredDetails = {
          "Référence": { "Ancienne": res.oldLogementId, "Nouvelle": res.newLogementId },
          "Planification": (data.planningAction === 'move' ? "Déplacée vers la nouvelle référence"
                          : data.planningAction === 'remove' ? "Supprimée"
                          : "Sans objet (aucune planification existante)") + (res.planningWarning ? ` — ATTENTION : ${res.planningWarning}` : ''),
          "Motif": data.note
        };
        appLog(data.moduleView, data.id, "Correction référence", data.isReserve ? "Public" : "Private", "Detail", structuredDetails, payload.userEmail);

        // La référence a changé : ce point n'appartient plus au logement
        // actuellement affiché dans la fiche — on rafraîchit les deux lignes
        // concernées (ancienne et nouvelle référence) si elles sont
        // visibles dans la grille actuelle, puis on ferme la fiche (elle
        // n'a plus de sens pour ce logement).
        if (oldLogId) refreshSingleRowDOM(oldLogId);
        refreshSingleRowDOM(data.newLogementId);
        closeEditSidebar();
      })
      .withFailureHandler((err) => {
        appErrorLog(err, "gsCorrectInterventionReference", { payload });
        showModal({ icon: 'error', title: 'Erreur', text: "La correction a échoué : " + err.message });
      })
      .gsCorrectInterventionReference(APP_DATA.token, APP_DATA.projectId, payload);
  }

  window.onCorrigerInterventionClicked = function(interventionId) {
    openPlanningReferenceCorrectionModal(interventionId);
  };

  function fetchAndDrawIntervention(interId, dateISO = window.currentInterventionDateISO) {
    // FIX E1: All three fetches run in parallel via Promise.all.
    // Previously: disciplines resolved → equipes resolved → details resolved (fully sequential, ~2–4s).
    // Now: all three start at once. Caches short-circuit to Promise.resolve() so warm loads are instant.
    const getDisciplines = () => new Promise(resolve =>
      google.script.run.withSuccessHandler(resolve).gsGetDisciplines(APP_DATA.token));
    const getEquipes = () => new Promise(resolve =>
      google.script.run.withSuccessHandler(resolve).gsGetEquipes(APP_DATA.token));
    const getDetails = () => new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
        .gsGetInterventionDetails(APP_DATA.token, interId, window.currentView));

    async function loadData() {
      try {
        const [disciplines, equipes, data] = await Promise.all([
          (currentDisciplines && currentDisciplines.length > 0) ? Promise.resolve(currentDisciplines) : getDisciplines(),
          (currentEquipes     && currentEquipes.length     > 0) ? Promise.resolve(currentEquipes)     : getEquipes(),
          getDetails()
        ]);

        currentDisciplines = disciplines;
        currentEquipes     = equipes;

        if (data) {
          drawInterventionUI(data, interId, window.currentInterventionLogId);
        } else {
          const content = document.getElementById('sidebar-content');
          content.innerHTML = `
            <div class="py-12 text-center flex flex-col items-center justify-center">
              <span class="material-symbols-outlined text-[48px] text-slate-300 mb-3">search_off</span>
              <h4 class="text-sm font-black text-slate-700 uppercase tracking-widest mb-1">Intervention introuvable</h4>
              <p class="text-[11px] font-medium text-slate-500 max-w-[250px] leading-relaxed mb-6">Le point <b>${interId}</b> n'a pas été trouvé dans la base de données (${interId.startsWith('A-') ? 'Autocontrôles' : 'Réserves'}).</p>
              <button onclick="closeEditSidebar()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-200 transition-colors uppercase tracking-widest">Fermer</button>
            </div>
          `;
        }
      } catch (e) {
        console.error(e);
        showModal({
          icon: 'error',
          title: 'Erreur',
          text: "Impossible de charger les détails."
        });
        appErrorLog(e, "fetchAndDrawIntervention", {
          interId: interId,
          dateISO: dateISO,
          projectId: PROJECT_ID || "Inconnu"
        });
      }
    }
    
    loadData();
  }

  }

  // --- POPUP CRÉNEAU HORAIRE AMÉLIORÉ (SANS SAISIE CLAVIER) ---
  async function openCreneauPicker(interId, currentStart, currentEnd) {
    // Normalisation des formats si la base contient des "h" au lieu de ":"
    if (currentStart) currentStart = currentStart.replace('h', ':');
    if (currentEnd) currentEnd = currentEnd.replace('h', ':');

    // Générateur dynamique de créneaux fluides toutes les 30 minutes
    const buildSelectOptions = (currentValue, allowEmpty, emptyLabel) => {
      let htmlOptions = allowEmpty ? `<option value="">${emptyLabel}</option>` : '';
      let timeSlots = [];
      
      for (let h = 5; h <= 19; h++) {
        const hourString = String(h).padStart(2, '0');
        timeSlots.push(`${hourString}:00`, `${hourString}:30`);
      }
      timeSlots.push("20:00"); // Heure maximale standard
      
      // Sécurité : Si l'heure enregistrée est custom (ex: 08:15), on l'intègre proprement
      if (currentValue && !timeSlots.includes(currentValue)) {
        timeSlots.push(currentValue);
        timeSlots.sort();
      }
      
      timeSlots.forEach(time => {
        htmlOptions += `<option value="${time}" ${currentValue === time ? 'selected' : ''}>${time}</option>`;
      });
      return htmlOptions;
    };

    const startOptions = buildSelectOptions(currentStart, false);
    const endOptions = buildSelectOptions(currentEnd, true, "Pas d'heure de fin");

    const result = await showModal({
      title: 'Créneau Horaire',
      heightAuto: false, // On conserve cette protection
      html: `
        <div class="text-left font-sans">
          <div class="mb-5">
            <span class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-2">Options Prédéfinies</span>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="document.getElementById('swal-cren-start').value='08:00'; document.getElementById('swal-cren-end').value='12:00';" 
                class="flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200/60 rounded-xl hover:bg-primary hover:text-white hover:border-primary group transition-all cursor-pointer shadow-sm">
                <span class="text-lg mb-0.5">🌅</span>
                <span class="text-xs font-black text-slate-700 group-hover:text-white">Matin</span>
                <span class="text-[10px] text-slate-400 group-hover:text-primary-light font-medium mt-0.5">08:00 - 12:00</span>
              </button>
          
              <button type="button" onclick="document.getElementById('swal-cren-start').value='13:00'; document.getElementById('swal-cren-end').value='17:00';" 
                class="flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200/60 rounded-xl hover:bg-primary hover:text-white hover:border-primary group transition-all cursor-pointer shadow-sm">
                <span class="text-lg mb-0.5">☀️</span>
                <span class="text-xs font-black text-slate-700 group-hover:text-white">Après-Midi</span>
                <span class="text-[10px] text-slate-400 group-hover:text-primary-light font-medium mt-0.5">13:00 - 17:00</span>
              </button>
          
              <button type="button" onclick="document.getElementById('swal-cren-start').value='08:00'; document.getElementById('swal-cren-end').value='17:00';" 
                class="flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200/60 rounded-xl hover:bg-primary hover:text-white hover:border-primary group transition-all cursor-pointer shadow-sm">
                <span class="text-lg mb-0.5">📅</span>
                <span class="text-xs font-black text-slate-700 group-hover:text-white">Journée</span>
                <span class="text-[10px] text-slate-400 group-hover:text-primary-light font-medium mt-0.5">08:00 - 17:00</span>
              </button>
            </div>
          </div>

          <div class="relative flex items-center my-5">
            <div class="flex-grow border-t border-slate-100"></div>
            <span class="flex-shrink mx-3 text-[9px] font-black uppercase tracking-wider text-slate-400">Ou ajustement précis</span>
            <div class="flex-grow border-t border-slate-100"></div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1.5">Heure de début</label>
              <select id="swal-cren-start" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm font-bold focus:ring-primary focus:border-primary text-slate-700 shadow-sm cursor-pointer transition-all">
                ${startOptions}
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1.5">Heure de fin</label>
              <select id="swal-cren-end" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm font-bold focus:ring-primary focus:border-primary text-slate-700 shadow-sm cursor-pointer transition-all">
                ${endOptions}
              </select>
            </div>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'Enregistrer',
      cancelButtonText: 'Annuler',
      preConfirm: () => {
        const start = document.getElementById('swal-cren-start').value;
        const end = document.getElementById('swal-cren-end').value;
        if (start && end && end <= start) {
          Swal.showValidationMessage("L'heure de fin doit être postérieure à l'heure de début.");
          return false;
        }
        return { start, end };
      }
    });

    const formValues = result.value;

    if (formValues) {
      const { start, end } = formValues;
      let finalCreneau = start;
      if (start && end) {
          finalCreneau = `${start} - ${end}`;
      } else if (!start && !end) {
          finalCreneau = "";
      }

      document.getElementById('display-inter-cren').textContent = finalCreneau || 'Choisir un créneau...';

      const container = document.getElementById('display-inter-cren').parentElement;
      container.setAttribute('onclick', `openCreneauPicker('${interId}', '${start}', '${end}')`);

      autoSaveInterventionField(interId, 'creneau', finalCreneau);
    }
  }
  
  // Fonction de sauvegarde de l'intervention
function autoSaveInterventionField(interId, fieldName, value) {
   const payload = {};
   payload[fieldName] = value;
   
   // On capture l'ancienne date d'origine AVANT l'enregistrement
   const oldIsoDate = window.currentInterventionDateISO;
   showLoading('Sauvegarde...', '', true);
   google.script.run
     .withSuccessHandler((res) => {
        if (res && res.success === false && res.isUserNotice) {
          showModal({
            icon: 'warning',
            title: 'Action impossible',
            text: res.message
          });
          return;
        }
        showToast('Modifié avec succès');

        appLog(
          window.currentView,
          interId,
          "MODIFICATION_INTERVENTION_CHAMP",
          "Public",
          "Detail",
          { field: fieldName, value: value }
        );
        
        // SI ON CHANGE LA DATE, ON MET À JOUR LA LIGNE DANS LE DOM SANS RECHARGEMENT GLOBAL !
        if (fieldName === 'dateStr') {
           let logId = window.currentInterventionLogId;
           let parts = value.split('/');
           let newIsoDate = `${parts[2]}-${parts[1]}-${parts[0]}`;

           // 1. Mettre à jour le cache local (window.lastPlanningData.repairs)
           if (window.lastPlanningData && window.lastPlanningData.repairs && window.lastPlanningData.repairs[logId]) {
               
               // Retirer le point de l'ancienne cellule de date
               if (oldIsoDate && window.lastPlanningData.repairs[logId][oldIsoDate]) {
                   window.lastPlanningData.repairs[logId][oldIsoDate] = window.lastPlanningData.repairs[logId][oldIsoDate].filter(id => id !== interId);
                   // Nettoyage si la case devient vide
                   if (window.lastPlanningData.repairs[logId][oldIsoDate].length === 0) {
                       delete window.lastPlanningData.repairs[logId][oldIsoDate];
                   }
               }
               
               // Ajouter le point à la nouvelle cellule de date
               if (!window.lastPlanningData.repairs[logId][newIsoDate]) {
                   window.lastPlanningData.repairs[logId][newIsoDate] = [];
               }
               if (!window.lastPlanningData.repairs[logId][newIsoDate].includes(interId)) {
                   window.lastPlanningData.repairs[logId][newIsoDate].push(interId);
               }
           }

           // 2. Mettre à jour la date de suivi dans la sidebar active
           window.currentInterventionDateISO = newIsoDate;
           
           // 3. Rafraîchir UNIQUEMENT la ligne concernée dans le DOM
           refreshSingleRowDOM(logId);

           // CORRECTION : 4. Récupérer toutes les interventions de la NOUVELLE date pour actualiser le menu déroulant
           let newItems = window.lastPlanningData.repairs[logId]?.[newIsoDate] || [];
           if (isClient || window.isClientViewActive) {
              newItems = newItems.filter(i => !i.startsWith('A-'));
           }
           window.currentInterventionsList = newItems;

           // CORRECTION : 5. Redessiner entièrement l'interface de l'intervention pour synchroniser les données
           fetchAndDrawIntervention(interId, newIsoDate);
        }
     })
     .withFailureHandler(err => {
        showModal({
          icon: 'error',
          title: 'Erreur',
          text: err.message
        });
        appErrorLog(err, "autoSaveInterventionField", {
          interId: interId,
          fieldName: fieldName,
          value: value,
          currentView: window.currentView,
          projectId: PROJECT_ID || "Inconnu"
        });
     })
     .gsSaveInterventionDetails(APP_DATA.token, interId, payload, window.currentView);
  }

  function updateSelectColor(selectEl) {
    const val = selectEl.value;
    
    // 1. On retire toutes les couleurs de fond potentielles
    const allBgColors = [
      'bg-blue-200', 'bg-red-300', 'bg-red-400', 'bg-orange-200',
      'bg-green-200', 'bg-green-400', 'bg-transparent'
    ];
    selectEl.classList.remove(...allBgColors);

    // On force le texte à rester sombre pour une lisibilité parfaite sur fond coloré
    selectEl.classList.add('text-slate-900');

    // 2. On applique la nouvelle couleur de fond
    if (val === 'En cours') {
      selectEl.classList.add('bg-blue-200'); // Bleu
    } else if (val === 'Bloqué') {
      selectEl.classList.add('bg-red-300'); // Rouge doux
    } else if (val === 'Bloquant') {
      selectEl.classList.add('bg-red-400'); // Rouge très agressif
    } else if (val === 'Réserves' || val === 'Attention') {
      selectEl.classList.add('bg-orange-200'); // Orange
    } else if (val === 'Info') {
      selectEl.classList.add('bg-blue-200'); // bleu clair
    } else if (val === 'Fini') {
      selectEl.classList.add('bg-green-400'); // Vert plus soutenu
    } else {
      selectEl.classList.add('bg-transparent'); // Vide
    }
  }

function openCustomCalendarPicker(targetType, targetId, extraParam, currentDateStr, navDateStr = null) {
  if (window.calendarLoadingState === 'ready') {
    renderCustomCalendarPicker(targetType, targetId, extraParam, currentDateStr, navDateStr);
    return;
  }

  if (window.calendarLoadingState === 'loading') {
    showLoading('Chargement en cours...', 'Le calendrier est en préparation.');
    const checkInterval = setInterval(() => {
      if (window.calendarLoadingState === 'ready') {
        clearInterval(checkInterval);
        Swal.close();
        renderCustomCalendarPicker(targetType, targetId, extraParam, currentDateStr, navDateStr);
      }
    }, 500);
    return;
  }

  initCalendarBackground();
  openCustomCalendarPicker(targetType, targetId, extraParam, currentDateStr, navDateStr);
}

function renderCustomCalendarPicker(targetType, targetId, extraParam, currentDateStr, navDateStr) {
  const dateToDisplay = navDateStr ? new Date(navDateStr) : (currentDateStr ? new Date(currentDateStr) : new Date());
  const currentYear = dateToDisplay.getFullYear();
  const currentMonth = dateToDisplay.getMonth();
  const projStart = window.projectStart ? new Date(window.projectStart) : null;
  const projEnd = window.projectEnd ? new Date(window.projectEnd) : null;
  const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  
  // NOUVEAU : Récupération de la vraie date d'aujourd'hui au format YYYY-MM-DD
  const realTodayObj = new Date();
  const realTodayStr = `${realTodayObj.getFullYear()}-${String(realTodayObj.getMonth() + 1).padStart(2, '0')}-${String(realTodayObj.getDate()).padStart(2, '0')}`;

  let firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
  let calendarHtml = `
    <div class="flex justify-between items-center mb-4 bg-slate-50 p-2 rounded-lg border border-slate-200">
      <button onclick="renderCustomCalendarPicker('${targetType}', '${targetId}', '${extraParam}', '${currentDateStr}', '${new Date(currentYear, currentMonth - 1, 1).toISOString()}')" class="p-1 hover:bg-white rounded shadow-sm text-slate-500"><span class="material-symbols-outlined">chevron_left</span></button>
      <div class="font-bold text-slate-800 text-sm">${monthNames[currentMonth]} ${currentYear}</div>
      <button onclick="renderCustomCalendarPicker('${targetType}', '${targetId}', '${extraParam}', '${currentDateStr}', '${new Date(currentYear, currentMonth + 1, 1).toISOString()}')" class="p-1 hover:bg-white rounded shadow-sm text-slate-500"><span class="material-symbols-outlined">chevron_right</span></button>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center text-xs font-black text-slate-400 uppercase tracking-wider mb-2">
      <div>Lu</div><div>Ma</div><div>Me</div><div>Je</div><div>Ve</div><div>Sa</div><div>Di</div>
    </div>
  
    <div class="grid grid-cols-7 gap-1.5 text-center">
  `;

  for (let i = 0; i < firstDayIndex; i++) { calendarHtml += `<div class="p-2 text-transparent select-none">.</div>`; }

  for (let day = 1; day <= daysInMonth; day++) {
    const dayStr = String(day).padStart(2, '0');
    const monthStr = String(currentMonth + 1).padStart(2, '0');
    const loopDateStr = `${currentYear}-${monthStr}-${dayStr}`;
    const loopDateObj = new Date(currentYear, currentMonth, day);
    
    const isOutOfRange = (projStart && loopDateObj < projStart) || (projEnd && loopDateObj > projEnd);
    const isSelected = (loopDateStr === currentDateStr);
    const isRealToday = (loopDateStr === realTodayStr);

    let isNonWorking = false;
    if (window.masterProjectCalendar && window.masterProjectCalendar[loopDateStr] !== undefined) {
      isNonWorking = (window.masterProjectCalendar[loopDateStr] === 0);
    } else {
      isNonWorking = (loopDateObj.getDay() === 0 || loopDateObj.getDay() === 6);
    }

    let baseClass = "p-2 text-xs rounded-lg transition-all ";
    
    if (isOutOfRange) {
        calendarHtml += `<div class="${baseClass} text-slate-200 bg-slate-50 select-none">${day}</div>`;
    } else if (isNonWorking) {
      calendarHtml += `<div class="p-2 text-xs font-bold text-red-400 bg-red-50/70 border border-red-100 rounded-lg line-through pointer-events-none select-none">${day}</div>`;
    } else if (isSelected && isRealToday) {
      // Si la date est à la fois "Aujourd'hui" ET "Sélectionnée" (Fond bleu + bordure orange)
      calendarHtml += `<div onclick="selectCustomCalendarDate('${targetType}', '${targetId}', '${extraParam}', '${currentDateStr}', '${loopDateStr}')" class="${baseClass} font-black text-white bg-primary shadow-sm cursor-pointer border-2 border-amber-500 ring-2 ring-amber-500/50">${day}</div>`;
    } else if (isSelected) {
      // Date actuellement sélectionnée (Bleu classique)
      calendarHtml += `<div onclick="selectCustomCalendarDate('${targetType}', '${targetId}', '${extraParam}', '${currentDateStr}', '${loopDateStr}')" class="${baseClass} font-black text-white bg-primary shadow-sm cursor-pointer border border-primary">${day}</div>`;
    } else if (isRealToday) {
      // Vraie date du jour (Orange/Amber comme la colonne du planning)
      calendarHtml += `<div onclick="selectCustomCalendarDate('${targetType}', '${targetId}', '${extraParam}', '${currentDateStr}', '${loopDateStr}')" class="${baseClass} font-black text-white bg-amber-500 shadow-sm cursor-pointer border border-amber-600 hover:bg-amber-600">${day}</div>`;
    } else {
      // Jours normaux
      calendarHtml += `<div onclick="selectCustomCalendarDate('${targetType}', '${targetId}', '${extraParam}', '${currentDateStr}', '${loopDateStr}')" class="${baseClass} font-bold text-slate-700 bg-white border border-slate-200 cursor-pointer hover:bg-primary hover:text-white hover:border-primary">${day}</div>`;
    }
  }

  calendarHtml += `</div>`;
  showModal({
    title: 'Choisir une date',
    html: calendarHtml,
    showConfirmButton: false,
    showCancelButton: true,
    cancelButtonText: 'Fermer',
    width: '380px'
  });
}

function selectCustomCalendarDate(targetType, targetId, extraParam, oldDateStr, selectedIsoDate) {
  Swal.close();
  
  if (targetType === 'task') {
    // Mise à jour visuelle rapide du bouton
    const triggerEl = document.getElementById('task-date-picker-trigger');
    if (triggerEl) triggerEl.querySelector('span').textContent = selectedIsoDate.split('-').reverse().join('/');
    
    // Appel du moteur Domino qui gérera l'UI, le loader et appellera gsShiftTaskWithDomino
    triggerDominoEffect(targetId, extraParam, oldDateStr, selectedIsoDate);
  } 
  else if (targetType === 'intervention') {
    const display = document.getElementById('display-inter-date');
    const hidden = document.getElementById('input-inter-date');
    if (hidden) hidden.value = selectedIsoDate;
    
    let frenchDate = "";
    if (selectedIsoDate) {
        frenchDate = selectedIsoDate.split('-').reverse().join('/');
        if (display) display.textContent = frenchDate;
    }
    
    // CORRECTION : Mettre à jour instantanément l'attribut onclick pour éviter que le calendrier 
    // ne se rouvre avec l'ancienne date si l'utilisateur clique trop vite.
    const container = display ? display.parentElement : null;
    if (container) {
      container.setAttribute('onclick', `openCustomCalendarPicker('intervention', '${targetId}', '', '${selectedIsoDate}')`);
    }

    autoSaveInterventionField(targetId, 'dateStr', frenchDate);
  }
}

  async function startPlanningIntervention(idx, targetDateFR, targetDateISO, logId) {

    if (inter.status && inter.status.trim() !== '') {
      // On récupère le résultat complet du modal
      const result = await showModal({
        title: 'Mise à jour du statut',
        html: `Le statut actuel est <b class="text-amber-500">${inter.status}</b>.<br>Quel statut souhaitez-vous lui attribuer en la planifiant ?`,
        input: 'radio',
        inputOptions: {
          'Planifié': 'Planifié',
          'En cours': 'En cours'
        },
        inputValidator: (value) => { 
          if (!value) return 'Vous devez choisir un statut !';
        },
        showCancelButton: true,
        confirmButtonText: 'Suivant <span class="material-symbols-outlined !text-[14px] ml-1">arrow_forward</span>',
        cancelButtonText: 'Annuler'
      });

      if (!result.value) return; // Annulé ou fermé
  
      newStatus = result.value;
    } else {
      newStatus = 'Planifié';
    }

    // ÉTAPE 2 : Choix du Créneau Horaire (Utilisation d'un utilitaire custom pour retourner la valeur)
    const creneauResult = await promptForCreneauSequence(inter.creneau);
    if (creneauResult === null) return; // Annulé

    // ÉTAPE 3 : Exécution de la Sauvegarde
    const payload = {
      dateStr: targetDateFR,
      status: newStatus,
      creneau: creneauResult
    };

    showLoading('Planification...', 'Mise à jour de la base de données');

    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success === false && res.isUserNotice) {
          showModal({
            icon: 'warning',
            title: 'Action impossible',
            text: res.message
          });
          return;
        }
        showToast('Planifié !');

        appLog(
          window.currentView,
          res.newId || "new-int",
          "CREATION_INTERVENTION",
          "Public",
          "Milestone",
          { 
            logement: logId, 
            discipline: inter.discipline, 
            date: targetDateFR 
          }
        );
        
        updateLocalCacheAfterInterventionPlanning(logId, inter.id, targetDateISO);
        refreshSingleRowDOM(logId);
      })
      .withFailureHandler(err => {
        showModal({
          icon: 'error',
          title: 'Erreur',
          text: err.message
        });
        appErrorLog(err, "startPlanningIntervention", {
          idx: idx,
          targetDateFR: targetDateFR,
          targetDateISO: targetDateISO,
          logId: logId,
          interId: inter.id,
          payload: payload,
          currentView: window.currentView,
          projectId: PROJECT_ID || "Inconnu"
        });
      })
      .gsSaveInterventionDetails(APP_DATA.token, inter.id, payload, window.currentView);
  }

  function updateLocalCacheAfterInterventionPlanning(logId, interId, newDateISO) {
    if (!window.lastPlanningData || !window.lastPlanningData.repairs) return;

    // 1. Initialiser l'objet du logement s'il n'existe pas
    if (!window.lastPlanningData.repairs[logId]) {
      window.lastPlanningData.repairs[logId] = {};
    }
    const repairsRow = window.lastPlanningData.repairs[logId];

    // 2. Nettoyer l'ID de l'intervention de toutes les dates (au cas où elle était déjà planifiée ailleurs)
    for (const dateKey in repairsRow) {
      repairsRow[dateKey] = repairsRow[dateKey].filter(id => id !== interId);
      if (repairsRow[dateKey].length === 0) {
          delete repairsRow[dateKey];
      }
    }

    // 3. Ajouter l'intervention à sa nouvelle date
    // (SÉCURITÉ : on s'assure que la date est dans notre fenêtre de 50 jours)
    if (window.lastPlanningData.headers && window.lastPlanningData.headers.dates.includes(newDateISO)) {
      if (!repairsRow[newDateISO]) repairsRow[newDateISO] = [];
      if (!repairsRow[newDateISO].includes(interId)) {
          repairsRow[newDateISO].push(interId);
      }
    }
  }

  // Version utilitaire du sélecteur de créneau qui retourne directement la chaîne générée
  async function promptForCreneauSequence(currentCreneau) {
    let currentStart = "", currentEnd = "";
    if (currentCreneau) {
       let parts = currentCreneau.split('-');
       if(parts.length > 0) currentStart = parts[0].trim().replace('h', ':');
       if(parts.length > 1) currentEnd = parts[1].trim().replace('h', ':');
    }

    const buildSelectOptions = (currentValue, allowEmpty, emptyLabel) => {
      let htmlOptions = allowEmpty ? `<option value="">${emptyLabel}</option>` : '';
      let timeSlots = [];
      for (let h = 5; h <= 19; h++) {
        const hourString = String(h).padStart(2, '0');
        timeSlots.push(`${hourString}:00`, `${hourString}:30`);
      }
      timeSlots.push("20:00");
      if (currentValue && !timeSlots.includes(currentValue)) {
        timeSlots.push(currentValue);
        timeSlots.sort();
      }
      timeSlots.forEach(time => {
        htmlOptions += `<option value="${time}" ${currentValue === time ? 'selected' : ''}>${time}</option>`;
      });
      return htmlOptions;
    };

    const startOptions = buildSelectOptions(currentStart, false);
    const endOptions = buildSelectOptions(currentEnd, true, "Pas d'heure de fin");

    // Note: showModal returns the full Swal result object
    const result = await showModal({
      title: 'Créneau Horaire',
      html: `
        <div class="text-left font-sans">
          <div class="mb-5">
            <span class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-2">Options Prédéfinies</span>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="document.getElementById('swal-seq-start').value='08:00'; document.getElementById('swal-seq-end').value='12:00';" class="flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200/60 rounded-xl hover:bg-primary hover:text-white hover:border-primary group transition-all cursor-pointer shadow-sm">
                <span class="text-lg mb-0.5">🌅</span><span class="text-xs font-black text-slate-700 group-hover:text-white">Matin</span>
              </button>
              <button type="button" onclick="document.getElementById('swal-seq-start').value='13:00'; document.getElementById('swal-seq-end').value='17:00';" class="flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200/60 rounded-xl hover:bg-primary hover:text-white hover:border-primary group transition-all cursor-pointer shadow-sm">
                <span class="text-lg mb-0.5">☀️</span><span class="text-xs font-black text-slate-700 group-hover:text-white">Après-Midi</span>
              </button>
              <button type="button" onclick="document.getElementById('swal-seq-start').value='08:00'; document.getElementById('swal-seq-end').value='17:00';" class="flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200/60 rounded-xl hover:bg-primary hover:text-white hover:border-primary group transition-all cursor-pointer shadow-sm">
                <span class="text-lg mb-0.5">📅</span><span class="text-xs font-black text-slate-700 group-hover:text-white">Journée</span>
              </button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1.5">Heure de début</label>
              <select id="swal-seq-start" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm font-bold focus:ring-primary focus:border-primary text-slate-700 shadow-sm cursor-pointer">${startOptions}</select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1.5">Heure de fin</label>
              <select id="swal-seq-end" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm font-bold focus:ring-primary focus:border-primary text-slate-700 shadow-sm cursor-pointer">${endOptions}</select>
            </div>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'Valider <span class="material-symbols-outlined !text-[14px] ml-1">check</span>',
      cancelButtonText: 'Annuler',
      preConfirm: () => {
        const start = document.getElementById('swal-seq-start').value;
        const end = document.getElementById('swal-seq-end').value;
        if (start && end && end <= start) {
          Swal.showValidationMessage("L'heure de fin doit être postérieure à l'heure de début.");
          return false;
        }
        return { start, end };
      }
    });

    const formValues = result.value;

    if (formValues) {
      const { start, end } = formValues;
      if (start && end) return `${start} - ${end}`;
      if (start) return start;
      return "";
    }
    return null; 
  }



</script>
