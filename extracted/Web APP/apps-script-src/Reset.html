  <script>

<body class="bg-background-light min-h-screen flex items-center justify-center p-6 font-display">

  <div class="w-full max-w-md">

    <div class="bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-200/50 p-8">

                 class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"

  <?!= include_('ClientLib', data); ?>

  <script>
    const companyName = APP_DATA.companyName;
    document.getElementById('company-name').innerText = companyName;

    /**
     * Updates the UI message box with custom text and styling.
     */
    function showMessage(txt, isError = false) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = txt;
      msgDiv.className = "mt-6 text-sm text-center " + (isError ? "text-red-500 font-medium" : "text-emerald-600 font-medium");
    }

    /**
     * Form Submission Handler
     * Calls gsResetPassword(token, newPassword) — token is the one-time reset token,
     * not a session token. No authentication is required for this action by design.
     */
    document.getElementById('form').addEventListener('submit', function(e){
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;

      // Local Validation using Toast
      if (p1.length < 8) {
        return showToast('Attention', 'warning', 'Le mot de passe doit faire au moins 8 caractères.');
      }

      if (p1 !== p2) {
        return showToast('Attention', 'warning', 'Les mots de passe ne sont pas identiques.');
      }

      // UI Loading State using showLoading
      showLoading('Veuillez patienter', 'Enregistrement de votre nouveau mot de passe…');
      
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');

      // Server-side call: gsResetPassword(token, newPassword)
      google.script.run
        .withSuccessHandler(function(){
          showToast('Succès', 'success', 'Redirection en cours...');
          
          // Redirect after short delay
          setTimeout(() => {
            if (typeof navTo === "function") {
              navTo('login');
            } else {
              window.top.location.href = '?page=login';
            }
          }, 2000);
        })
        .withFailureHandler(function(err){
          // Reset UI and showModal on failure
          showModal({ icon: 'error', title: 'Erreur', text: err.message || "Erreur lors de la réinitialisation." });
          btn.disabled = false;
          btn.classList.remove('opacity-60', 'cursor-not-allowed');
          appErrorLog(err, "gsResetPassword", { tokenUsed: token });
        })
        .gsResetPassword(token, p1);
    });
  </script>

</body>
</html>
